<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다들 모여!</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        
        #lobby {
            margin-bottom: 15px;
            display: flex;
            gap: 12px;
            align-items: center;
            background: #333;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #555;
            flex-wrap: wrap;
            z-index: 20;
        }
        select, button, input {
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            border: none;
        }
        input[type="password"] {
            background-color: #444;
            color: #fff;
            border: 1px solid #666;
            width: 80px;
            text-align: center;
        }
        input[type="text"] {
            background-color: #444;
            color: #fff;
            border: 1px solid #666;
            width: 100px;
        }
        input[type="number"] {
            background-color: #444;
            color: #fff;
            border: 1px solid #666;
            width: 45px;
            text-align: center;
        }
        select {
            background-color: #444;
            color: #fff;
            border: 1px solid #666;
        }
        button {
            background-color: #f39c12;
            color: #fff;
            cursor: pointer;
        }
        button:hover {
            background-color: #d35400;
        }
        button:disabled, select:disabled, input:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
        }

        #mainLayout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            justify-content: center;
            width: 100%;
            max-width: 1780px; 
            padding: 0 20px;
            box-sizing: border-box;
        }

        .side-panel {
            width: 240px;
            height: 508px; 
            background-color: #555555;
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .side-panel.log-panel {
            width: 480px;
        }

        .panel-title {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 1px;
            border-bottom: 2px solid #666;
            padding-bottom: 10px;
        }

        #keyGuideList {
            display: flex;
            flex-direction: column;
            gap: 15px;
            font-size: 14px;
            line-height: 1.6;
        }
        .key-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }
        .key-val {
            color: #f1c40f;
            font-weight: bold;
        }

        #logContainer {
            flex: 1;
            overflow-y: auto;
            background: #444;
            border-radius: 6px;
            padding: 12px;
            font-size: 15px; 
            display: flex;
            flex-direction: column;
            gap: 10px;
            word-break: break-all;
            white-space: pre-wrap;
        }
        
        .log-item {
            border-bottom: 1px solid #555;
            padding-bottom: 6px;
            line-height: 1.5;
        }
        .log-time { color: #aaa; margin-right: 6px; font-size: 12px; }
        .log-type-score { color: #2ecc71; font-weight: bold; }
        .log-type-defense { color: #e67e22; font-weight: bold; }
        .log-type-chat { color: #f1c40f; font-weight: bold; background: rgba(241, 196, 15, 0.1); border-radius: 2px; padding: 2px 4px; }

        #chatInputZone {
            margin-top: 10px;
            display: none; 
            gap: 5px;
        }
        #directorChatMsg {
            flex: 1;
            background: #333;
            color: #fff;
            border: 1px solid #666;
            padding: 6px;
            font-size: 13px;
            border-radius: 4px;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 0 25px rgba(0,0,0,0.7);
        }
        canvas {
            background-color: #d35400;
            border: 4px solid #fff;
            display: block;
            border-radius: 4px;
            outline: none;
        }
        #cutIn {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 70px;
            font-weight: 900;
            color: #e74c3c;
            text-shadow: -4px -4px 0 #fff, 4px -4px 0 #fff, -4px 4px 0 #fff, 4px 4px 0 #fff, 0px 8px 10px rgba(0,0,0,0.5);
            font-style: italic;
            pointer-events: none;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }
        #cutIn.active {
            transform: translate(-50%, -50%) scale(1);
        }
        #miniGameUI {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 15px 25px;
            border-radius: 10px;
            border: 2px solid #fff;
            text-align: center;
            display: none;
            z-index: 5;
        }
        .progress-bar {
            width: 300px;
            height: 25px;
            background-color: #555;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
            border: 1px solid #fff;
        }
        #progress {
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, #3498db, #e74c3c);
            transition: width 0.05s linear;
        }
        #ui {
            margin-top: 15px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            gap: 60px;
            justify-content: center;
            width: 100%;
        }
        #adminSkillZone {
            display: none;
            align-items: center;
            gap: 5px;
            background: #444;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #666;
        }
        #pauseBtn { background-color: #34495e; color: #fff; }
        #pauseBtn:hover { background-color: #2c3e50; }
        #resetBtn { background-color: #c0392b; color: #fff; }
        #resetBtn:hover { background-color: #962d22; }
        #clearLogBtn { background-color: #7f8c8d; color: #fff; margin-left: 5px; }
        #clearLogBtn:hover { background-color: #95a5a6; }
        
        .capacity-zone {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #444;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #666;
            font-size: 13px;
        }

        /* 신규 추가: 화면 하단 글로벌 디펜스 쿨타임 안내 UI */
        #globalCooldownBarZone {
            margin-top: 15px;
            width: 400px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #666;
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        #cooldownTitle {
            font-size: 12px;
            font-weight: bold;
            color: #2ecc71;
        }
        .cooldown-progress-container {
            width: 100%;
            height: 12px;
            background-color: #333;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #555;
        }
        #cooldownProgressFiller {
            width: 0%;
            height: 100%;
            background: #2ecc71;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="lobby">
        <div id="refereeZone" style="display: flex; gap: 8px; align-items: center;">
            <label for="refName">감독 이름: </label>
            <input type="text" id="refName" placeholder="감독명 입력" style="width: 90px;">
            <label for="refKey">코드: </label>
            <input type="password" id="refKey" placeholder="코드">
            <button onclick="authReferee()" id="authBtn">감독 임명</button>
        </div>
        
        <div id="adminSkillZone">
            <label id="directorTitleLabel" style="color: #f1c40f; margin-right: 5px; font-weight: bold;"></label>
            <label>경기력 관리:</label>
            <select id="adminTargetPlayer" onchange="loadTargetSkillLevel()"></select>
            <input type="number" id="adminSkillInput" min="5.0" max="9.9" step="0.1" value="5.0">
            <button onclick="updatePlayerSkill()">적용</button>
            <button id="clearLogBtn" onclick="clearLogsFromServer()">로그 초기화</button>
        </div>

        <span style="color:#555;">|</span>

        <label>팀명 세팅: </label>
        <input type="text" id="teamNameBlueInput" value="TEAM BLUE" placeholder="블루팀명" oninput="sendLiveTeamName('BLUE')" disabled>
        <input type="text" id="teamNameRedInput" value="TEAM RED" placeholder="레드팀명" oninput="sendLiveTeamName('RED')" disabled>

        <div class="capacity-zone">
            <span style="color: #3498db; font-weight: bold;">BLUE</span>
            <input type="number" id="maxBlueInput" min="1" max="5" value="5" onchange="sendMatchCapacity()" disabled>
            <span style="font-weight: bold; color: #aaa;">VS</span>
            <input type="number" id="maxRedInput" min="1" max="5" value="5" onchange="sendMatchCapacity()" disabled>
            <span style="color: #e74c3c; font-weight: bold;">RED</span>
        </div>

        <button id="startBtn" onclick="startGame()" disabled>[시작] GAME START</button>
        <button id="pauseBtn" onclick="togglePause()" disabled>[정지] PAUSE</button>
        <button id="resetBtn" onclick="triggerManualReset()" disabled>[초기화] RESET MATCH</button>
        <span id="statusText" style="color: #f1c40f; margin-left: 5px;">[관전자 모드] 코드를 입력하세요.</span>
    </div>
    
    <div id="mainLayout">
        <div class="side-panel">
            <div class="panel-title">조작키</div>
            <div id="keyGuideList">
                <div class="key-row"><span>상하좌우 이동</span><span class="key-val">W, A, S, D</span></div>
                <div class="key-row"><span>공 줍기</span><span class="key-val">E</span></div>
                <div class="key-row"><span>패스</span><span class="key-val">Shift</span></div>
                <div class="key-row"><span>슛</span><span class="key-val">Space</span></div>
                <div class="key-row"><span>디펜스 시도</span><span class="key-val">좌클릭</span></div>
                <div class="key-row"><span>디펜스 게임</span><span class="key-val">우클릭 유지</span></div>
            </div>
        </div>

        <div id="gameContainer">
            <div id="cutIn">디펜스!!</div>
            <div id="miniGameUI">
                <div id="miniGameTitle" style="font-weight:bold; font-size:16px;">🔥 마우스 우클릭을 꾹 누르고 계세요! 🔥</div>
                <div class="progress-bar">
                    <div id="progress"></div>
                </div>
                <div id="miniGameVS" style="font-size:12px; margin-top:5px; color:#ccc;">수비수 VS 공격수</div>
            </div>
            <canvas id="gameCanvas" width="1000" height="500" tabindex="1"></canvas>
        </div>

        <div class="side-panel log-panel">
            <div class="panel-title">LOG</div>
            <div id="logContainer"></div>
            <div id="chatInputZone">
                <input type="text" id="directorChatMsg" placeholder="감독 공지 메시지 입력..." onkeydown="if(event.key==='Enter') sendDirectorChat()">
                <button onclick="sendDirectorChat()" style="padding: 4px 10px; font-size:12px;">전송</button>
            </div>
        </div>
    </div>
    
    <div id="ui">
        <div style="color: #3498db;"><span id="teamLabel1">TEAM BLUE</span>: <span id="score1">0</span></div>
        <div style="color: #e74c3c;"><span id="teamLabel2">TEAM RED</span>: <span id="score2">0</span></div>
    </div>

    <div id="globalCooldownBarZone">
        <div id="cooldownTitle">디펜스 가능 시스템 온 (READY)</div>
        <div class="cooldown-progress-container">
            <div id="cooldownProgressFiller"></div>
        </div>
    </div>

<script>
const socket = io();

let myUserToken = localStorage.getItem("basketball_user_token");
if (!myUserToken) {
    myUserToken = "tk_" + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
    localStorage.setItem("basketball_user_token", myUserToken);
}

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const cutIn = document.getElementById("cutIn");
const miniGameUI = document.getElementById("miniGameUI");
const progressBar = document.getElementById("progress");
const statusText = document.getElementById("statusText");
const pauseBtn = document.getElementById("pauseBtn");
const resetBtn = document.getElementById("resetBtn");
const logContainer = document.getElementById("logContainer");
const chatInputZone = document.getElementById("chatInputZone");

const maxBlueInput = document.getElementById("maxBlueInput");
const maxRedInput = document.getElementById("maxRedInput");

// 글로벌 디펜스 게이지 용 자바스크립트 변수 바인딩
const cooldownTitle = document.getElementById("cooldownTitle");
const cooldownProgressFiller = document.getElementById("cooldownProgressFiller");

let isReferee = false; 
let myDirectorName = ""; 

let scoreBlue = 0;
let scoreRed = 0;
let teamBlueName = "TEAM BLUE";
let teamRedName = "TEAM RED";

let maxBluePlayers = 5;
let maxRedPlayers = 5;

let gameState = "SETUP"; 
let miniGameGauge = 50;    
let miniGameTimer = 0;
let activeDefender = null;
let activeAttacker = null;

// 서버와 동기화되는 전역 디펜스 쿨타임 타임스탬프 (모든 유저 공유)
let globalDefenseLockUntil = 0; 
let rightButtonHolding = false; // 현재 내가 우클릭을 누르고 있는지 여부

let myControllingPlayer = null; 
let keys = {};
const registeredNames = new Set();

let lastTime = performance.now();

const court = {
    width: canvas.width,
    height: canvas.height,
    leftGoal: { x: 50, y: 250, radius: 20 },
    rightGoal: { x: 950, y: 250, radius: 20 }
};

const onlineScheme = { 
    up: 'w', 
    down: 's', 
    left: 'a', 
    right: 'd', 
    grab: 'e', 
    pass: 'shift', 
    shoot: ' ' 
};

class Player {
    constructor(x, y, team, id, spawnIndex) {
        this.x = x;
        this.y = y;
        this.team = team; 
        this.id = id;
        this.spawnIndex = spawnIndex;
        this.radius = 16;
        
        this.baseSpeed = 210;
        this.color = team === "BLUE" ? "#3498db" : "#e74c3c";
        
        this.ownerName = null;     
        this.socketId = null;
        this.userToken = null; 
        this.angle = team === "BLUE" ? 0 : Math.PI; 
        this.skillLevel = 5.0;
    }

    draw() {
        if (gameState === "SETUP") {
            if (this.team === "BLUE" && this.id > maxBluePlayers) return;
            if (this.team === "RED" && this.id > maxRedPlayers) return;
        }

        const isMe = (myControllingPlayer && myControllingPlayer.team === this.team && myControllingPlayer.id === this.id);

        ctx.save();
        if (this.ownerName) {
            ctx.strokeStyle = "rgba(255, 242, 0, 0.75)";
            ctx.lineWidth = 2.5;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x + Math.cos(this.angle) * 45, this.y + Math.sin(this.angle) * 45);
            ctx.stroke();
        }
        ctx.restore();

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);

        if (isMe) {
            ctx.fillStyle = this.color;
        } else {
            ctx.fillStyle = this.team === "BLUE" ? "#1e547b" : "#8a2b21";
        }
        ctx.fill();

        if (isMe) {
            ctx.lineWidth = 4.5;
            ctx.strokeStyle = "#f1c40f";
        } else {
            ctx.lineWidth = 2.0;
            ctx.strokeStyle = this.ownerName ? "#444444" : "#cccccc"; 
        }
        ctx.stroke();
        ctx.closePath();

        ctx.fillStyle = "#fff";
        ctx.font = "bold 10px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(this.id, this.x, this.y);

        if (this.ownerName) {
            ctx.fillStyle = isMe ? "#fff" : "#bbbbbb";
            ctx.font = isMe ? "bold 12px sans-serif" : "bold 11px sans-serif";
            ctx.fillText(`${this.ownerName} [${this.skillLevel.toFixed(1)}v]`, this.x, this.y - this.radius - 8);
        }
    }

    move(dx, dy, dt) {
        this.x += dx * this.baseSpeed * dt;
        this.y += dy * this.baseSpeed * dt;
        this.x = Math.max(this.radius, Math.min(court.width - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(court.height - this.radius, this.y));

        if (dx !== 0 || dy !== 0) {
            this.angle = Math.atan2(dy, dx);
        }
    }
}

const ball = {
    x: 500,
    y: 250,
    radius: 9,
    vx: 0,
    vy: 0,
    holder: null,
    isFlying: false,
    ignoreWalls: false, 
    isChecking: false, 
    lastShooterSkill: 5.0,

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#e67e22";
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = "#000";
        ctx.stroke();
        ctx.closePath();
    },

    update(dt) {
        if (gameState !== "PLAYING") return;
        if (this.holder) {
            const dribbleY = Math.sin(Date.now() * 0.012) * 6;
            this.x = this.holder.x + Math.cos(this.holder.angle) * 14;
            this.y = this.holder.y + Math.sin(this.holder.angle) * 14 + dribbleY;
            this.ignoreWalls = false;
            this.isChecking = false;
        } else if (this.isFlying) {
            this.x += this.vx * dt * 60;
            this.y += this.vy * dt * 60;
            this.vx *= Math.pow(0.98, dt * 60);
            this.vy *= Math.pow(0.98, dt * 60);

            const distToRight = Math.hypot(this.x - court.rightGoal.x, this.y - court.rightGoal.y);
            const distToLeft = Math.hypot(this.x - court.leftGoal.x, this.y - court.leftGoal.y);

            if (distToRight < court.rightGoal.radius + 25 || distToLeft < court.leftGoal.radius + 25) {
                this.ignoreWalls = true;
            } else {
                this.ignoreWalls = false;
                this.isChecking = false; 
            }

            if (!this.isChecking) {
                if (distToRight < court.rightGoal.radius + 25) {
                    this.isChecking = true;
                    this.checkGoalProbability("BLUE"); 
                }
                else if (distToLeft < court.leftGoal.radius + 25) {
                    this.isChecking = true;
                    this.checkGoalProbability("RED"); 
                }
            }

            if (Math.abs(this.vx) < 0.3 && Math.abs(this.vy) < 0.3) {
                this.isFlying = false;
                this.ignoreWalls = false;
                this.isChecking = false;
            }
        }

        if (!this.ignoreWalls) {
            if (this.x < this.radius || this.x > court.width - this.radius) this.vx *= -1;
            if (this.y < this.radius || this.y > court.height - this.radius) this.vy *= -1;
        }
        this.x = Math.max(this.radius, Math.min(court.width - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(court.height - this.radius, this.y));
    },

    checkGoalProbability(scoringTeam) {
        const shooterLv = this.lastShooterSkill || 5.0;
        let successChance = 0.50; 

        if (shooterLv >= 6.0 && shooterLv < 7.0) successChance = 0.60;
        else if (shooterLv >= 7.0 && shooterLv < 8.0) successChance = 0.70;
        else if (shooterLv >= 8.0 && shooterLv < 9.0) successChance = 0.80;
        else if (shooterLv >= 9.0) successChance = 0.90;

        if (Math.random() < successChance) {
            this.isFlying = false;
            this.ignoreWalls = false;
            this.isChecking = false;

            if (scoringTeam === "BLUE") { scoreBlue += 2; }
            else { scoreRed += 2; }
            
            document.getElementById("score1").innerText = scoreBlue;
            document.getElementById("score2").innerText = scoreRed;
            
            if (isReferee) {
                socket.emit("syncScore", { blue: scoreBlue, red: scoreRed, scoringTeam: scoringTeam });
            }
            this.resetBall();
        } else {
            const randomAngle = Math.random() * Math.PI * 2;
            const bouncePower = 11 + Math.random() * 4; 
            
            this.vx = Math.cos(randomAngle) * bouncePower;
            this.vy = Math.sin(randomAngle) * bouncePower;
            this.x += this.vx * 1.5;
            this.ignoreWalls = false;

            if (isReferee) {
                socket.emit("syncBallAction", { 
                    x: this.x, 
                    y: this.y, 
                    vx: this.vx, 
                    vy: this.vy, 
                    holderId: null, 
                    isFlying: true, 
                    lastShooterSkill: shooterLv 
                });
            }
        }
    },

    resetBall() {
        this.x = 500;
        this.y = 250;
        this.vx = 0;
        this.vy = 0;
        this.holder = null;
        this.isFlying = false;
        this.ignoreWalls = false;
        this.isChecking = false;
        this.lastShooterSkill = 5.0;
        if (isReferee) {
            socket.emit("syncBallAction", { x: 500, y: 250, vx: 0, vy: 0, holderId: null, isFlying: false });
        }
    }
};

const allSpawnPositions = {
    BLUE: [ {x:200, y:250}, {x:320, y:130}, {x:320, y:370}, {x:120, y:160}, {x:120, y:340} ],
    RED:  [ {x:800, y:250}, {x:680, y:130}, {x:680, y:370}, {x:880, y:160}, {x:880, y:340} ]
};
let activePlayers = [];

function buildActivePlayersPool(preserveNames = true) {
    const backupMap = {};
    activePlayers.forEach(p => {
        if (p.ownerName) {
            backupMap[`${p.team}_${p.id}`] = {
                ownerName: p.ownerName,
                socketId: p.socketId,
                userToken: p.userToken,
                skillLevel: p.skillLevel
            };
        }
    });

    if (!preserveNames) {
        registeredNames.clear();
    }

    activePlayers = [];
    for(let i = 0; i < maxBluePlayers; i++) {
        let bPos = allSpawnPositions.BLUE[i];
        let p = new Player(bPos.x, bPos.y, "BLUE", i+1, i);
        let bk = backupMap[`BLUE_${i+1}`];
        if (bk && preserveNames) {
            p.ownerName = bk.ownerName;
            p.socketId = bk.socketId;
            p.userToken = bk.userToken;
            p.skillLevel = bk.skillLevel;
            registeredNames.add(bk.ownerName);
        }
        activePlayers.push(p);
    }
    for(let i = 0; i < maxRedPlayers; i++) {
        let rPos = allSpawnPositions.RED[i];
        let p = new Player(rPos.x, rPos.y, "RED", i+1, i);
        let bk = backupMap[`RED_${i+1}`];
        if (bk && preserveNames) {
            p.ownerName = bk.ownerName;
            p.socketId = bk.socketId;
            p.userToken = bk.userToken;
            p.skillLevel = bk.skillLevel;
            registeredNames.add(bk.ownerName);
        }
        activePlayers.push(p);
    }

    const findMySlot = activePlayers.find(p => p.userToken === myUserToken);
    if (findMySlot) {
        myControllingPlayer = findMySlot;
    }
    updateAdminDropdown();
}

// 마우스 우클릭 누름/뗌 이벤트 추가 감지
canvas.addEventListener("mousedown", e => {
    canvas.focus(); 
    
    // 미니게임 진행 중 우클릭 입력 등록 처리
    if (gameState === "MINIGAME" && e.button === 2) {
        e.preventDefault();
        rightButtonHolding = true;
        return;
    }

    if (e.button === 0) {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        
        if ((gameState === "SETUP" || gameState === "PLAYING") && myControllingPlayer) {
            if (gameState === "PLAYING") checkDefenseTrigger(myControllingPlayer);
            return;
        }

        if (gameState === "SETUP" && !myControllingPlayer) {
            activePlayers.forEach(p => {
                const dist = Math.hypot(p.x - mouseX, p.y - mouseY);
                if (dist < p.radius + 10) {
                    if (!p.ownerName) {
                        const name = prompt(`[${p.team === "BLUE" ? "블루" : "레드"} ${p.id}번] 유저 이름 입력:`);
                        if (name && name.trim() !== "") {
                            const trimmedName = name.trim();
                            if (registeredNames.has(trimmedName)) {
                                alert("이미 등록된 유저명입니다.");
                                return;
                            }
                            p.ownerName = trimmedName;
                            p.socketId = socket.id;
                            p.userToken = myUserToken; 
                            myControllingPlayer = p;
                            registeredNames.add(trimmedName);
                            socket.emit("syncRegisterOwner", { team: p.team, id: p.id, ownerName: trimmedName, userToken: myUserToken });
                            updateAdminDropdown();
                        }
                    } else {
                        alert(`이미 선택 완료된 캐릭터입니다.`);
                    }
                }
            });
        }
    }
});

window.addEventListener("keydown", e => {
    if (document.activeElement === document.getElementById("directorChatMsg")) {
        return;
    }
    const key = e.key.toLowerCase();
    keys[key] = true;
    if (e.key === " " || e.key === "Enter" || e.key.toLowerCase() === "shift") {
        e.preventDefault();
    }
    if (gameState === "PAUSE") return;
    if (gameState === "PLAYING" && myControllingPlayer) {
        const p = myControllingPlayer;
        if (key === onlineScheme.grab) {
            checkManualBallGrab(p);
        }
        if (ball.holder && ball.holder.team === p.team && ball.holder.id === p.id) {
            if (key === onlineScheme.shoot) {
                shootAction(p);
            } else if (key === onlineScheme.pass) {
                passAction(p);
            }
        }
    }
});

window.addEventListener("keyup", e => {
    const key = e.key.toLowerCase();
    keys[key] = false;
});

function checkManualBallGrab(player) {
    if (ball.holder || ball.isFlying || gameState !== "PLAYING") return;
    const dist = Math.hypot(player.x - ball.x, player.y - ball.y);
    if (dist < player.radius + ball.radius + 12) {
        ball.holder = player;
        socket.emit("syncBallAction", { x: ball.x, y: ball.y, vx: 0, vy: 0, holderId: player.id, holderTeam: player.team, isFlying: false });
    }
}

// [수정] 디펜스 진입 발동 조건 제어 (전역 쿨타임 시스템 검증 반영)
function checkDefenseTrigger(player) {
    if (gameState !== "PLAYING" || !ball.holder || ball.holder.team === player.team) return;
    
    // 글로벌 디펜스 쿨타임이 아직 남아있다면 어느 선수도 디펜스 시도 불가
    if (Date.now() < globalDefenseLockUntil) return;

    const target = ball.holder;
    const dist = Math.hypot(player.x - target.x, player.y - target.y);
    if (dist < player.radius + target.radius + 28) {
        activeDefender = player;
        activeAttacker = target;
        miniGameGauge = 50;
        miniGameTimer = 5.0; // 미니게임 제한시간 5초
        rightButtonHolding = false; // 마우스 상태 초기화
        gameState = "MINIGAME";

        socket.emit("syncStartMiniGame", {
            defTeam: player.team, defId: player.id,
            attTeam: target.team, attId: target.id
        });
    }
}

function gameLoop(currentTime) {
    const dt = (currentTime - lastTime) / 1000;
    lastTime = currentTime;

    // 실시간 하단 전역 디펜스 쿨타임 바 안내 시각화 갱신 로직
    if (gameState === "PLAYING") {
        const now = Date.now();
        if (now < globalDefenseLockUntil) {
            const timeLeft = globalDefenseLockUntil - now;
            const pct = (timeLeft / 3000) * 100;
            cooldownTitle.innerText = `⚠️ 전역 디펜스 과부하 방지 쿨타임 진행 중! (${(timeLeft/1000).toFixed(1)}초)`;
            cooldownTitle.style.color = "#e74c3c";
            cooldownProgressFiller.style.backgroundColor = "#e74c3c";
            cooldownProgressFiller.style.width = `${pct}%`;
        } else {
            cooldownTitle.innerText = "디펜스 가능 시스템 온 (READY)";
            cooldownTitle.style.color = "#2ecc71";
            cooldownProgressFiller.style.backgroundColor = "#2ecc71";
            cooldownProgressFiller.style.width = "100%";
        }
    } else {
        cooldownProgressFiller.style.width = "0%";
        if (gameState === "MINIGAME") {
            cooldownTitle.innerText = "⚡ 디펜스 대치 경합이 펼쳐지는 중입니다! ⚡";
            cooldownTitle.style.color = "#f1c40f";
        } else {
            cooldownTitle.innerText = "경기 대기 중";
            cooldownTitle.style.color = "#aaa";
        }
    }

    if (gameState === "PLAYING") {
        if (myControllingPlayer) {
            let dx = 0; let dy = 0;
            if (keys[onlineScheme.up]) dy = -1;
            if (keys[onlineScheme.down]) dy = 1;
            if (keys[onlineScheme.left]) dx = -1;
            if (keys[onlineScheme.right]) dx = 1;

            if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

            if (dx !== 0 || dy !== 0) {
                myControllingPlayer.move(dx, dy, dt);
                socket.emit("syncPlayerMove", {
                    team: myControllingPlayer.team,
                    id: myControllingPlayer.id,
                    x: myControllingPlayer.x,
                    y: myControllingPlayer.y,
                    angle: myControllingPlayer.angle
                });
            }
        }
        ball.update(dt);
    }
    // [핵심 수정] 마우스 우클릭 유지 누적 계산 및 심판 소켓 기반 제한시간 판정 처리
    else if (gameState === "MINIGAME") {
        // 미니게임에 직접 참여 중인 클라이언트가 우클릭을 꾹 누르고 있으면 실시간으로 게이지 변동 반영 및 패킷 발송
        if (myControllingPlayer) {
            const p = myControllingPlayer;
            if (activeDefender && p.team === activeDefender.team && p.id === activeDefender.id && rightButtonHolding) {
                // 수비수가 누르고 있으면 게이지를 왼쪽(0에 가깝게)으로 깎음 (초당 약 15% 속도)
                miniGameGauge -= 15 * dt;
                if (miniGameGauge < 0) miniGameGauge = 0;
                socket.emit("syncMiniGameHit", miniGameGauge);
            } 
            else if (activeAttacker && p.team === activeAttacker.team && p.id === activeAttacker.id && rightButtonHolding) {
                // 공격수가 누르고 있으면 게이지를 오른쪽(100에 가깝게)으로 채움
                miniGameGauge += 15 * dt;
                if (miniGameGauge > 100) miniGameGauge = 100;
                socket.emit("syncMiniGameHit", miniGameGauge);
            }
        }

        // 오직 심판(방장)의 루프에서만 공정하게 제한시간 타이머 차감 및 최종 승패 연산 수행
        if (isReferee) {
            miniGameTimer -= dt;
            if (miniGameTimer <= 0) {
                // 제한시간 종료 시 게이지 수치가 50 미만이면 수비(스틸) 성공, 50 초과면 공격(돌파) 성공
                let isDefWin = miniGameGauge < 50; 
                if (Math.abs(miniGameGauge - 50) < 0.01) isDefWin = Math.random() < 0.5;
                
                gameState = "PLAYING";
                if (isDefWin) {
                    ball.holder = activeDefender;
                    socket.emit("syncEndMiniGame", { isDefWin: true, defTeam: activeDefender.team, defId: activeDefender.id, holderTeam: activeDefender.team, holderId: activeDefender.id });
                } else {
                    ball.holder = activeAttacker;
                    socket.emit("syncEndMiniGame", { isDefWin: false, attTeam: activeAttacker.team, attId: activeAttacker.id, holderTeam: activeAttacker.team, holderId: activeAttacker.id });
                }
            }
        }
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawCourt();
    activePlayers.forEach(p => p.draw());
    ball.draw();

    requestAnimationFrame(gameLoop);
}

function drawCourt() {
    ctx.fillStyle = "#27ae60";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(255,255,255,0.6)";

    ctx.beginPath();
    ctx.moveTo(500, 0);
    ctx.lineTo(500, 500);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(500, 250, 75, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "rgba(52, 152, 219, 0.2)";
    ctx.fillRect(0, 100, 120, 300);
    ctx.strokeRect(0, 100, 120, 300);

    ctx.fillStyle = "rgba(231, 76, 60, 0.2)";
    ctx.fillRect(880, 100, 120, 300);
    ctx.strokeRect(880, 100, 120, 300);

    ctx.lineWidth = 5;
    ctx.strokeStyle = "#3498db";
    ctx.beginPath();
    ctx.arc(court.leftGoal.x, court.leftGoal.y, court.leftGoal.radius, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = "#e74c3c";
    ctx.beginPath();
    ctx.arc(court.rightGoal.x, court.rightGoal.y, court.rightGoal.radius, 0, Math.PI * 2);
    ctx.stroke();
}

function endMiniGame(resultData) {
    gameState = "PLAYING";
    miniGameUI.style.display = "none";
    rightButtonHolding = false;

    if (resultData.holderId) {
        ball.holder = activePlayers.find(p => p.team === resultData.holderTeam && p.id === resultData.holderId);
    } else {
        ball.holder = null;
    }

    // 서버가 발행한 3초 글로벌 쿨타임 적용 동기화
    if (resultData.globalDefenseLockUntil) {
        globalDefenseLockUntil = resultData.globalDefenseLockUntil;
    }

    cutIn.innerText = resultData.isDefWin ? "스틸 성공!!" : "돌파 성공!!";
    cutIn.classList.add("active");
    setTimeout(() => { cutIn.classList.remove("active"); }, 900);
}

    document.getElementById("score1").innerText = scoreBlue;
    document.getElementById("score2").innerText = scoreRed;

    maxBluePlayers = state.maxBluePlayers;
    maxRedPlayers = state.maxRedPlayers;
    maxBlueInput.value = maxBluePlayers;
    maxRedInput.value = maxRedPlayers;

    teamBlueName = state.teamBlueName;
    teamRedName = state.teamRedName;
    document.getElementById("teamNameBlueInput").value = teamBlueName;
    document.getElementById("teamNameRedInput").value = teamRedName;
    document.getElementById("teamLabel1").innerText = teamBlueName;
    document.getElementById("teamLabel2").innerText = teamRedName;

    // 전역 쿨타임 백업 상태 동기화
    if (state.globalDefenseLockUntil) {
        globalDefenseLockUntil = state.globalDefenseLockUntil;
    }

    buildActivePlayersPool(true);

    state.registeredOwners.forEach(data => {
        const p = activePlayers.find(o => o.team === data.team && o.id === data.id);
        if (p) {
            p.ownerName = data.ownerName;
            p.socketId = data.socketId;
            p.userToken = data.userToken;
            p.skillLevel = data.skillLevel;
            registeredNames.add(data.ownerName);
            
            if (data.userToken === myUserToken) {
                myControllingPlayer = p;
                socket.emit("reconnectPlayer", { userToken: myUserToken });
            }
        }
    });
    updateAdminDropdown();

    logContainer.innerHTML = "";
    state.logs.forEach(log => appendLogToUI(log));

    if (state.directorName) {
        if (state.directorToken === myUserToken) {
            isReferee = true;
            myDirectorName = state.directorName;
            document.getElementById("directorTitleLabel").innerText = `[공식 감독관: ${myDirectorName}]`;
            document.getElementById("adminSkillZone").style.display = "flex";
            document.getElementById("refereeZone").style.display = "none";
            chatInputZone.style.display = "flex";
            document.getElementById("teamNameBlueInput").disabled = false;
            document.getElementById("teamNameRedInput").disabled = false;
            socket.emit("syncRegisterDirector", { name: myDirectorName, token: myUserToken });
        } else {
            document.getElementById("statusText").innerText = `[관전자 모드] 감독 ${state.directorName}님이 방을 관리 중입니다.`;

    } else {
        isReferee = false;
        myDirectorName = "";
        document.getElementById("refereeZone").style.display = "flex";
        document.getElementById("adminSkillZone").style.display = "none";
        chatInputZone.style.display = "none";
    }
    
    gameState = state.gameState;
    toggleUIVisibility();
    
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
});

socket.on("onRegisterOwner", (data) => {
    const p = activePlayers.find(o => o.team === data.team && o.id === data.id);
    if (p) {
        if (p.ownerName) registeredNames.delete(p.ownerName);
        
        if (data.ownerName === "") {
            p.ownerName = null;
            p.socketId = null;
            p.userToken = null;
            p.skillLevel = 5.0;
        } else {
            p.ownerName = data.ownerName;
            p.socketId = data.socketId || null;
            p.userToken = data.userToken || null;
            registeredNames.add(data.ownerName);
            
            if (data.userToken === myUserToken) {
                myControllingPlayer = p;
            }
        }
    }
    updateAdminDropdown();
});

socket.on("onUpdateSkillLevel", (data) => {
    const p = activePlayers.find(o => o.team === data.team && o.id === data.id);
    if (p) {
        p.skillLevel = data.skillLevel;
    }
    loadTargetSkillLevel();
});

socket.on("onLiveTeamName", (data) => {
    if (data.team === "BLUE") {
        teamBlueName = data.name;
        document.getElementById("teamNameBlueInput").value = data.name;
        document.getElementById("teamLabel1").innerText = data.name;
    } else {
        teamRedName = data.name;
        document.getElementById("teamNameRedInput").value = data.name;
        document.getElementById("teamLabel2").innerText = data.name;
    }
});

socket.on("onRegisterDirector", (data) => {
    if (!data.directorName) {
        isReferee = false;
        myDirectorName = "";
        document.getElementById("refereeZone").style.display = "flex";
        document.getElementById("adminSkillZone").style.display = "none";
        chatInputZone.style.display = "none";
        document.getElementById("teamNameBlueInput").disabled = true;
        document.getElementById("teamNameRedInput").disabled = true;
        toggleUIVisibility();
        return;
    }

    if (data.directorToken === myUserToken) {
        isReferee = true;
        myDirectorName = data.directorName;
        document.getElementById("directorTitleLabel").innerText = `[공식 감독관: ${myDirectorName}]`;
        document.getElementById("adminSkillZone").style.display = "flex";
        document.getElementById("refereeZone").style.display = "none";
        chatInputZone.style.display = "flex";
        
        document.getElementById("teamNameBlueInput").disabled = false;
        document.getElementById("teamNameRedInput").disabled = false;
    } else {
        document.getElementById("statusText").innerText = `[관전자 모드] 감독 ${data.directorName}님이 방을 관리 중입니다.`;
    }
    toggleUIVisibility();
});

socket.on("onClearLogs", () => {
    logContainer.innerHTML = "";
});

socket.on("onStartGame", (data) => {
    gameState = "PLAYING";
    teamBlueName = data.teamBlueName;
    teamRedName = data.teamRedName;
    maxBluePlayers = data.maxBluePlayers;
    maxRedPlayers = data.maxRedPlayers;
    globalDefenseLockUntil = 0; 
    buildActivePlayersPool(true);
    toggleUIVisibility();
});

socket.on("onGameStateChange", (data) => {
    gameState = data.state;
    toggleUIVisibility();
});

socket.on("onResetMatch", () => {
    gameState = "SETUP";
    scoreBlue = 0;
    scoreRed = 0;
    document.getElementById("score1").innerText = 0;
    document.getElementById("score2").innerText = 0;
    
    myControllingPlayer = null;
    isReferee = false;
    myDirectorName = "";
    globalDefenseLockUntil = 0;
    rightButtonHolding = false;
    registeredNames.clear();

    buildActivePlayersPool(false);
    ball.resetBall();

    document.getElementById("refName").value = "";
    document.getElementById("refKey").value = "";
    document.getElementById("refereeZone").style.display = "flex";
    document.getElementById("adminSkillZone").style.display = "none";
    chatInputZone.style.display = "none";
    document.getElementById("teamNameBlueInput").disabled = true;
    document.getElementById("teamNameRedInput").disabled = true;

    toggleUIVisibility();
});

socket.on("onScoreUpdate", (data) => {
    scoreBlue = data.blue;
    scoreRed = data.red;
    document.getElementById("score1").innerText = scoreBlue;
    document.getElementById("score2").innerText = scoreRed;
});

socket.on("onStartMiniGame", (data) => {
    startMiniGameUI(data);
});

socket.on("onMiniGameGauge", (gauge) => {
    miniGameGauge = gauge;
    progressBar.style.width = `${miniGameGauge}%`;
});

socket.on("onEndMiniGame", (resultData) => {
    endMiniGame(resultData);
});

socket.on("onNewLog", (logEntry) => {
    appendLogToUI(logEntry);
});

function toggleUIVisibility() {
    const inputsDisabled = (gameState !== "SETUP" || !isReferee);
    maxBlueInput.disabled = inputsDisabled;
    maxRedInput.disabled = inputsDisabled;

    if (gameState === "PLAYING" || gameState === "MINIGAME" || gameState === "PAUSE") {
        document.getElementById("startBtn").disabled = true;
        pauseBtn.disabled = !isReferee;
        resetBtn.disabled = !isReferee;
        if (gameState === "PAUSE") {
            statusText.innerText = "[일시정지] 경기가 멈췄습니다.";
            statusText.style.color = "#e74c3c";
            pauseBtn.innerText = "[재개] RESUME";
        } else {
            statusText.innerText = "[경기 중] 매치 진행 중!";
            statusText.style.color = "#2ecc71";
            pauseBtn.innerText = "[정지] PAUSE";
        }
    } else {
        statusText.innerText = isReferee ? "[대기 모드] 팀별 매치 인원을 설정하고 경기를 시작하세요." : "[관전자 모드] 코드를 입력하세요.";
        statusText.style.color = "#f1c40f";
        document.getElementById("startBtn").disabled = !isReferee;
        pauseBtn.disabled = true;
        resetBtn.disabled = !isReferee;
        pauseBtn.innerText = "[정지] PAUSE";
    }
}
</script>
</body>
</html>
