<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5vs5 실시간 멀티플레이 농구 게임 (관전자 모드 포함)</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #gameCanvas {
            border: 4px solid #fff;
            background-color: #e67e22; 
        }
        #lobby {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #fff;
            z-index: 10;
        }
        #uiOverlay {
            position: absolute;
            top: 20px;
            display: flex;
            gap: 15px;
            z-index: 5;
        }
        input, button, select {
            padding: 10px;
            margin: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
        }
        button {
            background-color: #3498db;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #2980b9;
        }
        .spec-btn {
            background-color: #e67e22;
        }
        .spec-btn:hover {
            background-color: #d35400;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="lobby">
        <h2>🏀 5vs5 농구 게임 입장 🏀</h2>
        <input type="text" id="nicknameInput" placeholder="닉네임을 입력하세요" maxlength="8"><br>
        <select id="teamSelect">
            <option value="A">A팀 (블루)</option>
            <option value="B">B팀 (레드)</option>
            <option value="spectator">관전자 모드</option>
        </select><br>
        <button id="startBtn">게임 참여하기</button>
    </div>

    <div id="uiOverlay" style="display: none;">
        <button id="toggleSpecBtn" class="spec-btn">관전자 모드 전환</button>
        <button id="returnLobbyBtn">대기실로 나가기</button>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        // 현재 호스팅 환경(로컬 또는 Render 도메인 주소)에 맞게 자동으로 주소를 찾아 연결합니다.
        const socket = io();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const lobby = document.getElementById('lobby');
        const uiOverlay = document.getElementById('uiOverlay');
        const nicknameInput = document.getElementById('nicknameInput');
        const teamSelect = document.getElementById('teamSelect');
        const startBtn = document.getElementById('startBtn');
        const toggleSpecBtn = document.getElementById('toggleSpecBtn');
        const returnLobbyBtn = document.getElementById('returnLobbyBtn');

        let myId = null;
        let remotePlayers = {};
        let isPlaying = false;

        // 클라이언트 본인의 초기 상태 구조체 데이터
        let myData = {
            name: '',
            team: 'A',
            isSpectator: false,
            x: 400,
            y: 300,
            speed: 5
        };

        const keys = {};

        // 게임 참여하기 처리
        startBtn.addEventListener('click', () => {
            const name = nicknameInput.value.trim();
            if (!name) {
                alert('닉네임을 입력해 주세요!');
                return;
            }
            
            myData.name = name;
            const selectedTeam = teamSelect.value;

            if (selectedTeam === 'spectator') {
                myData.team = 'spectator';
                myData.isSpectator = true;
            } else {
                myData.team = selectedTeam;
                myData.isSpectator = false;
                // 진영에 따른 플레이어 배치 설정
                myData.x = (myData.team === 'A') ? 200 : 600;
                myData.y = 300;
            }

            lobby.style.display = 'none';
            uiOverlay.style.display = 'flex';
            isPlaying = true;

            // 기존 관전자 상태 비트를 포함하여 서버에 조인 요청 전송
            socket.emit('joinGame', {
                name: myData.name,
                team: myData.team,
                isSpectator: myData.isSpectator,
                x: myData.x,
                y: myData.y
            });

            // 버튼 텍스트 초기 셋업
            toggleSpecBtn.textContent = myData.isSpectator ? "선수로 참전하기" : "관전자 모드 전환";
        });

        // 인게임 실시간 모드 체인저 버튼 액션
        toggleSpecBtn.addEventListener('click', () => {
            if (!isPlaying) return;

            if (!myData.isSpectator) {
                // 선수 -> 관전자로 전환
                myData.isSpectator = true;
                myData.team = 'spectator';
                toggleSpecBtn.textContent = "선수로 참전하기";
                socket.emit('changeToSpectator');
            } else {
                // 관전자 -> 선수로 복귀 (기본 A팀 배정)
                myData.isSpectator = false;
                myData.team = 'A';
                myData.x = 200;
                myData.y = 300;
                toggleSpecBtn.textContent = "관전자 모드 전환";
                socket.emit('changeToPlayer', {
                    team: myData.team,
                    x: myData.x,
                    y: myData.y
                });
            }
        });

        // 대기실로 나가는 버튼 액션
        returnLobbyBtn.addEventListener('click', () => {
            location.reload(); // 단순 브라우저 새로고침으로 완전 초기화 및 세션 재시작
        });

        socket.on('connect', () => { myId = socket.id; });
        socket.on('updatePlayers', (serverPlayers) => { remotePlayers = serverPlayers; });

        window.addEventListener('keydown', (e) => { keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key] = false; });

        function updateMovement() {
            // 재생 중이 아니거나 관전자 상태일 때는 조작 무효화 (기존 로직 보존)
            if (!isPlaying || myData.isSpectator) return;

            let moved = false;

            if (keys['ArrowUp'] || keys['w'] || keys['W']) { myData.y -= myData.speed; moved = true; }
            if (keys['ArrowDown'] || keys['s'] || keys['S']) { myData.y += myData.speed; moved = true; }
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) { myData.x -= myData.speed; moved = true; }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) { myData.x += myData.speed; moved = true; }

            if (myData.x < 15) myData.x = 15;
            if (myData.x > canvas.width - 15) myData.x = canvas.width - 15;
            if (myData.y < 15) myData.y = 15;
            if (myData.y > canvas.height - 15) myData.y = canvas.height - 15;

            if (moved) {
                socket.emit('playerMove', {
                    x: myData.x,
                    y: myData.y
                });
            }
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 경기장 기본 중앙선 및 센터서클 선 그리기
            ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 70, 0, Math.PI * 2);
            ctx.stroke();

            // 접속 데이터 순회 렌더링
            for (let id in remotePlayers) {
                const player = remotePlayers[id];

                // 관전자는 경기장 바닥에 원형 캐릭터 모델을 렌더링하지 않음 (기존 시스템 반영)
                if (player.isSpectator || player.team === 'spectator') continue;

                ctx.beginPath();
                ctx.arc(player.x, player.y, 15, 0, Math.PI * 2);
                
                if (player.team === 'A') {
                    ctx.fillStyle = '#3498db'; 
                } else {
                    ctx.fillStyle = '#e74c3c'; 
                }
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#fff';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(player.name, player.x, player.y - 22);
            }
        }

        function gameLoop() {
            updateMovement();
            drawGame();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
