<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>다들 모여 매치 코어</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Noto Sans KR', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #container {
            width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        #auth-section {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        input, button, select {
            background: #3a3a3a;
            border: 1px solid #555;
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            cursor: pointer;
            background: #4a4a4a;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background: #5a5a5a;
        }
        #game-screen {
            position: relative;
            width: 1000px;
            height: 500px;
            background: #252525;
            border: 4px solid #444;
            border-radius: 8px;
            overflow: hidden;
            display: none;
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
        }
        #setup-board {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }
        .setup-row {
            display: flex;
            gap: 20px;
            background: #222;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #444;
        }
        
        /* 📌 디펜스 경합 오버레이 테마 스타일 */
        #minigame-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            box-sizing: border-box;
        }
        #minigame-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            letter-spacing: 2px;
        }
        #minigame-timer {
            font-size: 22px;
            color: #ff4757;
            font-weight: bold;
            margin-bottom: 15px;
            background: #000;
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid #ff4757;
        }
        #gauge-container {
            width: 600px;
            height: 35px;
            background: #333;
            border: 3px solid #fff;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        #gauge-bar {
            width: 50%;
            height: 100%;
            background: #FFD700; 
            transition: width 0.08s ease-out;
        }
        #gauge-center-line {
            position: absolute;
            top: 0; left: 50%; width: 4px; height: 100%;
            background: #ffffff;
            transform: translateX(-50%);
            opacity: 0.7;
        }
        #minigame-guide {
            margin-top: 15px;
            font-size: 16px;
            color: #ccc;
            background: #222;
            padding: 8px 20px;
            border-radius: 4px;
        }
        .player-token {
            position: absolute;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
            color: #fff;
            transform: translate(-50%, -50%);
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
            user-select: none;
            cursor: pointer;
            z-index: 6;
        }
        .team-blue { background: #1e3799; border: 2px solid #4a89ff; }
        .team-red { background: #b71540; border: 2px solid #ff4d4d; }
        .player-label {
            position: absolute;
            bottom: -18px;
            background: rgba(0,0,0,0.7);
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 9px;
            white-space: nowrap;
            pointer-events: none;
        }
        .player-token:hover { box-shadow: 0 0 10px #fffb00; }
        .my-controlled { box-shadow: 0 0 15px #00ff88 !important; border-color: #00ff88 !important; }

        #game-ball {
            position: absolute;
            width: 18px;
            height: 18px;
            background: #fffb00;
            border: 2px solid #000;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #fffb00;
            z-index: 5;
        }
        #dashboard { display: flex; gap: 15px; width: 1000px; }
        .panel { background: #2a2a2a; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .panel h3 { margin-top: 0; margin-bottom: 12px; font-size: 15px; border-left: 4px solid #fffb00; padding-left: 8px; }
        #log-box {
            height: 160px;
            overflow-y: auto;
            background: #111;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            line-height: 1.6;
            border: 1px solid #444;
        }
        .log-line { margin-bottom: 5px; border-bottom: 1px solid #222; padding-bottom: 2px; }
        .log-chat { color: #55afff; }
        .log-score { color: #ff55ff; font-weight: bold; }
        .log-defense { color: #ffaa00; }
        .slot-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        .slot-table th, .slot-table td { border: 1px solid #444; padding: 6px; text-align: center; font-size: 12px; }
        .slot-table th { background: #222; }
        .slot-taken { background: #333; color: #aaa; }
        .skill-box { margin-top: 10px; background: #1e1e1e; padding: 8px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>

<div id="container">
    <div id="auth-section">
        <label>방 번호:</label>
        <input type="text" id="input-room" placeholder="0001" value="0001" style="width: 80px; text-align: center;">
        <label>닉네임:</label>
        <input type="text" id="input-name" placeholder="닉네임 입력" style="width: 150px;">
        <label>비밀번호:</label>
        <input type="password" id="input-pass" placeholder="비밀번호" style="width: 100px;">
        <button onclick="connectToRoom()">경기장 입장</button>
    </div>

    <div id="game-screen">
        <div id="setup-board">
            <h2 style="margin:0; font-size:26px; color:#fffb00;">🏀 MATCH WAITING LOUNGE</h2>
            <div class="setup-row">
                <div>
                    <label style="color:#4a89ff; font-weight:bold;">BLUE 팀명: </label>
                    <input type="text" id="setup-blue-name" value="TEAM BLUE" style="width:130px;">
                </div>
                <div>
                    <label style="color:#ff4d4d; font-weight:bold;">RED 팀명: </label>
                    <input type="text" id="setup-red-name" value="TEAM RED" style="width:130px;">
                </div>
            </div>
            <button onclick="requestStartGame()" style="padding:12px 40px; background:#2ed573; font-size:16px; border:none; color:white;">경기 개시 (START)</button>
        </div>

        <div id="minigame-overlay">
            <div id="minigame-title">⚡ PRESSURE DEFENSE MATCH ⚡</div>
            <div id="minigame-timer">남은 시간: 5.00초</div>
            <div id="gauge-container">
                <div id="gauge-bar"></div>
                <div id="gauge-center-line"></div>
            </div>
            <div id="minigame-guide">마우스 버튼이나 [스페이스바]를 폭풍 연타하세요!</div>
            <button id="btn-hit" onclick="strokeHit()" style="margin-top:22px; padding:12px 50px; background:#FFD700; color:#000; font-size:20px; border-radius:30px;">PUSH!!</button>
        </div>

        <div id="field-area" style="position:relative; width:100%; height:100%;">
            <div id="game-ball"></div>
        </div>
    </div>

    <div id="dashboard">
        <div class="panel" style="flex: 0 0 320px; display:flex; flex-direction:column; justify-content:space-between;">
            <div>
                <h3>📊 SCORE BOARD</h3>
                <div style="font-size: 22px; font-weight:bold; text-align:center; margin: 12px 0; background:#1e1e1e; padding:10px; border-radius:6px;">
                    <span id="txt-blue-team" style="color:#4a89ff;">BLUE</span> 
                    <span id="score-blue" style="color:#fff; margin:0 10px;">0</span>:<span id="score-red" style="color:#fff; margin:0 10px;">0</span> 
                    <span id="txt-red-team" style="color:#ff4d4d;">RED</span>
                </div>
                <div style="display:flex; gap:5px; justify-content:center; margin-bottom:10px;">
                    <button onclick="sendScore('BLUE')" style="background:#1e3799;">BLUE +2</button>
                    <button onclick="sendScore('RED')" style="background:#b71540;">RED +2</button>
                    <button onclick="triggerMiniGameTest()" style="background:#8A2BE2; font-size:11px;">경합 강제테스트</button>
                </div>
                <div style="display:flex; gap:5px; justify-content:center;">
                    <button onclick="togglePauseGame()" style="background:#d2af26; width:48%; font-size:12px;">일시정지 토글</button>
                    <button onclick="registerAsDirector()" style="background:#444; width:48%; font-size:12px;">감독 권한획득</button>
                </div>
                <div class="skill-box">
                    <label>🎚️ 내 캐릭터 슛 스킬 레벨: <span id="txt-skill-val" style="color:#fffb00; font-weight:bold;">5.0</span></label>
                    <input type="range" id="range-skill" min="1.0" max="10.0" step="0.5" value="5.0" style="width:100%; margin-top:5px;" oninput="updateSkillLevel(this.value)">
                </div>
            </div>
            <div style="margin-top:15px; border-top:1px dashed #555; padding-top:10px;">
                <button onclick="requestReset()" style="background:#ff4757; width:100%; padding:10px; font-size:13px;">🔄 경기 리셋 & 모든 캐릭터 초기화</button>
            </div>
        </div>

        <div class="panel" style="flex: 0 0 340px;">
            <h3>🏃 포지션 배정 명부</h3>
            <div style="max-height:210px; overflow-y:auto; background:#1a1a1a; padding:5px; border-radius:4px;">
                <table class="slot-table">
                    <thead>
                        <tr><th>팀</th><th>번호</th><th>담당 선수명</th><th>동작</th></tr>
                    </thead>
                    <tbody id="slot-tbody"></tbody>
                </table>
            </div>
        </div>

        <div class="panel" style="flex: 1;">
            <h3>📝 MATCH REALTIME LOGS</h3>
            <div id="log-box"></div>
        </div>
    </div>
</div>

<script>
    const socket = io();
    let myRoomId = null, myName = null, myPass = "", myRole = null, miniGameCountdownInterval = null;
    let myAssignedTeam = null, myAssignedId = null, isDragging = false, dragTarget = null;
    let localBallState = { x: 500, y: 250, vx: 0, vy: 0, holderTeam: null, holderId: null }, currentRoomCache = null;

    function buildPositionTable() {
        const tbody = document.getElementById('slot-tbody'); tbody.innerHTML = "";
        ['BLUE', 'RED'].forEach(team => {
            for(let i=1; i<=5; i++) {
                const tr = document.createElement('tr'); tr.id = `slot-row-${team}-${i}`;
                tr.innerHTML = `<td style="color:${team==='BLUE'?'#4a89ff':'#ff4d4d'}; font-weight:bold;">${team}</td><td>${i}번</td><td id="slot-name-${team}-${i}">- 공석 -</td><td><button id="slot-btn-${team}-${i}" onclick="claimPosition('${team}', ${i})" style="padding:2px 6px; font-size:11px;">등록</button></td>`;
                tbody.appendChild(tr);
            }
        });
    }
    buildPositionTable();

    function connectToRoom() {
        const roomId = document.getElementById('input-room').value.trim();
        const userName = document.getElementById('input-name').value.trim();
        const userPass = document.getElementById('input-pass').value.trim();
        if(!roomId || !userName) return alert("방 번호와 닉네임을 입력해 주세요.");
        myRoomId = roomId; myName = userName; myPass = userPass;
        socket.emit('joinRoom', { roomId, userName, password: userPass });
    }

    socket.on('authResult', (res) => {
        if(res.success) {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            initFieldInteraction();
        }
    });

    socket.on('onInitRoomState', (room) => {
        currentRoomCache = room;
        localBallState = { ...room.ballState };

        document.getElementById('txt-blue-team').innerText = room.teamBlueName;
        document.getElementById('txt-red-team').innerText = room.teamRedName;
        document.getElementById('score-blue').innerText = room.scoreBlue;
        document.getElementById('score-red').innerText = room.scoreRed;

        if(room.gameState === "SETUP" || room.gameState === "PLAYING") {
            document.getElementById('setup-board').style.display = (room.gameState === "SETUP") ? 'flex' : 'none';
            document.getElementById('minigame-overlay').style.display = 'none';
            clearMiniGameTimer();
        }

        updateBallDOM(room.ballState.x, room.ballState.y);

        for(let team of ['BLUE', 'RED']) {
            for(let i=1; i<=5; i++) {
                const nameTd = document.getElementById(`slot-name-${team}-${i}`);
                const btn = document.getElementById(`slot-btn-${team}-${i}`);
                nameTd.innerText = "- 공석 -"; nameTd.className = ""; btn.innerText = "등록"; btn.disabled = false;
                btn.setAttribute("onclick", `claimPosition('${team}', ${i})`);
            }
        }

        const field = document.getElementById('field-area');
        document.querySelectorAll('.player-token').forEach(el => el.remove());

        room.registeredOwners.forEach(p => {
            const nameTd = document.getElementById(`slot-name-${p.team}-${p.id}`);
            const btn = document.getElementById(`slot-btn-${p.team}-${p.id}`);
            if(nameTd && btn) {
                nameTd.innerText = p.ownerName; nameTd.className = "slot-taken";
                if(p.ownerName === myName) {
                    btn.innerText = "취소"; btn.setAttribute("onclick", `releasePosition('${p.team}', ${p.id})`);
                    myAssignedTeam = p.team; myAssignedId = p.id;
                } else { btn.innerText = "점유됨"; btn.disabled = true; }
            }

            const token = document.createElement('div');
            token.className = `player-token ${p.team === 'BLUE' ? 'team-blue' : 'team-red'}`;
            if(p.ownerName === myName) token.classList.add('my-controlled');
            token.style.left = p.x + 'px'; token.style.top = p.y + 'px'; token.innerText = p.id;
            
            const label = document.createElement('span'); label.className = 'player-label'; label.innerText = p.ownerName;
            token.appendChild(label);
            token.setAttribute("data-team", p.team); token.setAttribute("data-id", p.id);
            field.appendChild(token);
        });

        if(room.gameState === "PLAYING" && !localBallState.holderId && !localBallState.isFlying) {
            if(myAssignedTeam && myAssignedId) {
                const me = room.registeredOwners.find(o => o.team === myAssignedTeam && o.id === myAssignedId);
                if(me) {
                    const dist = Math.sqrt(Math.pow(me.x - localBallState.x, 2) + Math.pow(me.y - localBallState.y, 2));
                    if(dist < 25 && Date.now() > room.globalDefenseLockUntil) {
                        socket.emit('syncBallAction', { x: me.x, y: me.y, vx: 0, vy: 0, isFlying: false, holderTeam: myAssignedTeam, holderId: myAssignedId });
                    }
                }
            }
        } else if(room.gameState === "PLAYING" && localBallState.holderId && (localBallState.holderTeam !== myAssignedTeam)) {
            if(myAssignedTeam && myAssignedId) {
                const me = room.registeredOwners.find(o => o.team === myAssignedTeam && o.id === myAssignedId);
                if(me) {
                    const dist = Math.sqrt(Math.pow(me.x - localBallState.x, 2) + Math.pow(me.y - localBallState.y, 2));
                    if(dist < 25 && Date.now() > room.globalDefenseLockUntil) {
                        const opp = room.registeredOwners.find(o => o.team === localBallState.holderTeam && o.id === localBallState.holderId);
                        if(opp) {
                            socket.emit('syncStartMiniGame', { attTeam: opp.team, attId: opp.id, attName: opp.ownerName, defTeam: myAssignedTeam, defId: myAssignedId, defName: myName });
                        }
                    }
                }
            }
        }

        const box = document.getElementById('log-box'); box.innerHTML = "";
        room.logs.forEach(log => {
            const line = document.createElement('div'); line.className = `log-line log-${log.type}`;
            line.innerText = `[${log.timestamp}] ${log.message}`; box.appendChild(line);
        });
        box.scrollTop = box.scrollHeight;
    });

    socket.on('onPlayerMove', (data) => {
        if(currentRoomCache) {
            const target = currentRoomCache.registeredOwners.find(o => o.team === data.team && o.id === data.id);
            if(target) { target.x = data.x; target.y = data.y; }
        }
        const token = document.querySelector(`.player-token[data-team="${data.team}"][data-id="${data.id}"]`);
        if(token && (!isDragging || dragTarget !== token)) { token.style.left = data.x + 'px'; token.style.top = data.y + 'px'; }
    });

    socket.on('onBallAction', (data) => { localBallState = { ...data }; updateBallDOM(data.x, data.y); });
    function updateBallDOM(x, y) { const ball = document.getElementById('game-ball'); if(ball) { ball.style.left = x + 'px'; ball.style.top = y + 'px'; } }

    function initFieldInteraction() {
        const field = document.getElementById('field-area');
        field.addEventListener('mousedown', (e) => {
            const tokenEl = e.target.closest('.player-token');
            if(tokenEl) {
                const tTeam = tokenEl.getAttribute('data-team'); const tId = parseInt(tokenEl.getAttribute('data-id'));
                if((tTeam === myAssignedTeam && tId === myAssignedId) || (currentRoomCache && currentRoomCache.directorName === myName)) {
                    isDragging = true; dragTarget = tokenEl; tokenEl.style.zIndex = 100;
                }
            } else {
                if(localBallState.holderTeam === myAssignedTeam && localBallState.holderId === myAssignedId) {
                    const rect = field.getBoundingClientRect();
                    const dx = (e.clientX - rect.left) - localBallState.x; const dy = (e.clientY - rect.top) - localBallState.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if(distance > 0) {
                        const power = 16; 
                        socket.emit('syncBallAction', {
                            x: localBallState.x, y: localBallState.y, vx: (dx / distance) * power, vy: (dy / distance) * power, isFlying: true, holderId: null, holderTeam: null,
                            lastShooterSkill: currentRoomCache?.registeredOwners.find(o => o.team === myAssignedTeam && o.id === myAssignedId)?.skillLevel || 5.0
                        });
                    }
                }
            }
        });

        window.addEventListener('mousemove', (e) => {
            if(!isDragging || !dragTarget) return;
            const rect = field.getBoundingClientRect();
            let x = e.clientX - rect.left; let y = e.clientY - rect.top;
            if(x < 0) x = 0; if(x > 1000) x = 1000; if(y < 0) y = 0; if(y > 500) y = 500;

            dragTarget.style.left = x + 'px'; dragTarget.style.top = y + 'px';
            const tTeam = dragTarget.getAttribute('data-team'); const tId = parseInt(dragTarget.getAttribute('data-id'));
            socket.emit('syncPlayerMove', { team: tTeam, id: tId, x, y, angle: 0 });

            if(localBallState.holderTeam === tTeam && localBallState.holderId === tId) {
                socket.emit('syncBallAction', { x, y, vx: 0, vy: 0, isFlying: false, holderTeam: tTeam, holderId: tId });
            }
        });

        window.addEventListener('mouseup', () => { if(isDragging && dragTarget) { dragTarget.style.zIndex = 6; isDragging = false; dragTarget = null; } });
    }

    function claimPosition(team, id) {
        if(myAssignedTeam && myAssignedId) return alert("이미 배정된 자리가 있습니다.");
        socket.emit('syncRegisterOwner', { team, id, ownerName: myName, password: myPass, x: team==='BLUE'? 250:750, y: 90 * id, angle: 0 });
    }
    function releasePosition(team, id) { socket.emit('syncRegisterOwner', { team, id, ownerName: "" }); myAssignedTeam = null; myAssignedId = null; }
    function updateSkillLevel(val) {
        document.getElementById('txt-skill-val').innerText = parseFloat(val).toFixed(1);
        if(myAssignedTeam && myAssignedId) socket.emit('syncUpdateSkillLevel', { team: myAssignedTeam, id: myAssignedId, skillLevel: parseFloat(val) });
    }
    function requestStartGame() {
        const bName = document.getElementById('setup-blue-name').value || "TEAM BLUE"; const rName = document.getElementById('setup-red-name').value || "TEAM RED";
        socket.emit('syncStartGame', { teamBlueName: bName, teamRedName: rName, maxBluePlayers: 5, maxRedPlayers: 5 });
    }
    function sendScore(team) {
        let b = parseInt(document.getElementById('score-blue').innerText); let r = parseInt(document.getElementById('score-red').innerText);
        if(team === 'BLUE') b += 2; else r += 2;
        socket.emit('syncScore', { blue: b, red: r, scoringTeam: team });
    }
    function togglePauseGame() { socket.emit('syncTogglePause'); }
    function registerAsDirector() { const token = prompt("감독 임명 코드를 입력하세요:"); if(token) socket.emit('syncRegisterDirector', { name: myName, token }); }
    
    function requestReset() { if(confirm("모든 데이터를 포맷 초기화하시겠습니까?")) socket.emit('syncResetMatch'); }
    
    // 📌 [잔상 제거 수정 핵심] 클라이언트 세션 변수, 필드 위의 DOM 노란색 토큰 흔적 전량 파괴
    socket.on('onResetMatch', () => {
        clearMiniGameTimer();
        myRoomId = null; myRole = null; myAssignedTeam = null; myAssignedId = null;
        currentRoomCache = null;
        localBallState = { x: 500, y: 250, vx: 0, vy: 0, holderTeam: null, holderId: null };

        document.getElementById('auth-section').style.display = 'flex';
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('setup-board').style.display = 'flex';
        document.getElementById('minigame-overlay').style.display = 'none';
        document.getElementById('log-box').innerHTML = '';
        
        const field = document.getElementById('field-area');
        if (field) { field.innerHTML = '<div id="game-ball"></div>'; }
        
        buildPositionTable();
        alert("모든 포지션 및 캐릭터 선택 기록이 초기화되었습니다. 다시 로그인 해주세요!");
    });

    // 📌 공격(황금색), 수비(보라색) UI 전용 테마 바인딩 연출
    socket.on('onStartMiniGame', (data) => {
        const overlay = document.getElementById('minigame-overlay');
        const gaugeBar = document.getElementById('gauge-bar');
        const timerText = document.getElementById('minigame-timer');
        
        overlay.style.display = 'flex';
        gaugeBar.style.backgroundColor = data.attackerColor; 
        overlay.style.border = `6px dashed ${data.defenderColor}`; 

        if(myName === data.attName) myRole = "ATTACKER";
        else if(myName === data.defName) myRole = "DEFENDER";
        else myRole = null;

        const btn = document.getElementById('btn-hit');
        if(myRole === "ATTACKER") btn.innerText = "🔥 돌파 연타 (황금공격)";
        else if(myRole === "DEFENDER") btn.innerText = "🛡️ 압박 연타 (보라스비)";
        else btn.innerText = "👀 타임어택 결투 관전 중";

        let timeLeft = 5.00;
        clearMiniGameTimer();
        miniGameCountdownInterval = setInterval(() => {
            timeLeft -= 0.05; if(timeLeft < 0) timeLeft = 0;
            timerText.innerText = `남은 시간: ${timeLeft.toFixed(2)}초`;
            if(timeLeft === 0) clearInterval(miniGameCountdownInterval);
        }, 50); 
    });

    function strokeHit() { if(!myRole) return; socket.emit('syncMiniGameHit', myRole); }
    socket.on('onMiniGameGauge', (gaugeValue) => { document.getElementById('gauge-bar').style.width = (gaugeValue / 50) * 100 + '%'; });
    socket.on('onEndMiniGame', () => { document.getElementById('minigame-overlay').style.display = 'none'; clearMiniGameTimer(); myRole = null; });
    function clearMiniGameTimer() { if(miniGameCountdownInterval) { clearInterval(miniGameCountdownInterval); miniGameCountdownInterval = null; } }
    function triggerMiniGameTest() { socket.emit('syncStartMiniGame', { attTeam: 'BLUE', attId: 1, attName: myName, defTeam: 'RED', defId: 2, defName: '가상상대' }); }

    window.addEventListener('keydown', (e) => {
        if(document.getElementById('minigame-overlay').style.display === 'flex') {
            if(e.code === 'Space') { e.preventDefault(); strokeHit(); }
            return;
        }
        if(myAssignedTeam && myAssignedId && currentRoomCache && !isDragging) {
            const me = currentRoomCache.registeredOwners.find(o => o.team === myAssignedTeam && o.id === myAssignedId);
            if(!me) return;
            let step = 8; let moved = false;
            if(e.code === 'KeyW' || e.code === 'ArrowUp') { me.y -= step; moved = true; }
            if(e.code === 'KeyS' || e.code === 'ArrowDown') { me.y += step; moved = true; }
            if(e.code === 'KeyA' || e.code === 'ArrowLeft') { me.x -= step; moved = true; }
            if(e.code === 'KeyD' || e.code === 'ArrowRight') { me.x += step; moved = true; }

            if(moved) {
                e.preventDefault();
                if(me.x < 0) me.x = 0; if(me.x > 1000) me.x = 1000; if(me.y < 0) me.y = 0; if(me.y > 500) me.y = 500;
                const token = document.querySelector(`.player-token[data-team="${myAssignedTeam}"][data-id="${myAssignedId}"]`);
                if(token) { token.style.left = me.x + 'px'; token.style.top = me.y + 'px'; }
                socket.emit('syncPlayerMove', { team: myAssignedTeam, id: myAssignedId, x: me.x, y: me.y, angle: 0 });
                if(localBallState.holderTeam === myAssignedTeam && localBallState.holderId === myAssignedId) {
                    socket.emit('syncBallAction', { x: me.x, y: me.y, vx: 0, vy: 0, isFlying: false, holderTeam: myAssignedTeam, holderId: myAssignedId });
                }
            }
        }
    });
</script>
</body>
</html>
