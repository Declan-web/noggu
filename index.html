<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>온라인 조작형 5vs5 농구 게임</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #lobby {
            margin-bottom: 15px;
            display: flex;
            gap: 12px;
            align-items: center;
            background: #333;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #555;
            flex-wrap: wrap;
        }
        select, button, input {
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            border: none;
        }
        input[type="password"] {
            background-color: #444;
            color: #fff;
            border: 1px solid #666;
            width: 80px;
            text-align: center;
        }
        input[type="text"] {
            background-color: #444;
            color: #fff;
            border: 1px solid #666;
            width: 100px;
        }
        input[type="number"] {
            background-color: #444;
            color: #fff;
            border: 1px solid #666;
            width: 50px;
            text-align: center;
        }
        select {
            background-color: #444;
            color: #fff;
            border: 1px solid #666;
        }
        button {
            background-color: #f39c12;
            color: #fff;
            cursor: pointer;
        }
        button:hover {
            background-color: #d35400;
        }
        button:disabled, select:disabled, input:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 0 25px rgba(0,0,0,0.7);
        }
        canvas {
            background-color: #d35400;
            border: 4px solid #fff;
            display: block;
            cursor: pointer;
        }
        #cutIn {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 70px;
            font-weight: 900;
            color: #e74c3c;
            text-shadow: -4px -4px 0 #fff, 4px -4px 0 #fff, -4px 4px 0 #fff, 4px 4px 0 #fff, 0px 8px 10px rgba(0,0,0,0.5);
            font-style: italic;
            pointer-events: none;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }
        #cutIn.active {
            transform: translate(-50%, -50%) scale(1);
        }
        #miniGameUI {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 15px 25px;
            border-radius: 10px;
            border: 2px solid #fff;
            text-align: center;
            display: none;
            z-index: 5;
        }
        .progress-bar {
            width: 300px;
            height: 25px;
            background-color: #555;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
            border: 1px solid #fff;
        }
        #progress {
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, #3498db, #e74c3c);
        }
        #ui {
            margin-top: 10px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            gap: 50px;
        }
        #adminSkillZone {
            display: none;
            align-items: center;
            gap: 5px;
            background: #444;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #666;
        }
        #pauseBtn {
            background-color: #34495e;
            color: #fff;
        }
        #pauseBtn:hover {
            background-color: #2c3e50;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="lobby">
        <div id="refereeZone">
            <label for="refKey">심판 코드: </label>
            <input type="password" id="refKey" placeholder="코드">
            <button onclick="authReferee()" id="authBtn">인증</button>
        </div>
        
        <div id="adminSkillZone">
            <label>📊 경기력 관리:</label>
            <select id="adminTargetPlayer" onchange="loadTargetSkillLevel()"></select>
            <input type="number" id="adminSkillInput" min="5.0" max="9.9" step="0.1" value="5.0">
            <button onclick="updatePlayerSkill()">적용</button>
        </div>

        <span style="color:#555;">|</span>

        <label>팀명 세팅: </label>
        <input type="text" id="teamNameBlueInput" value="TEAM BLUE" placeholder="블루팀명" oninput="sendLiveTeamName('BLUE')" disabled>
        <input type="text" id="teamNameRedInput" value="TEAM RED" placeholder="레드팀명" oninput="sendLiveTeamName('RED')" disabled>

        <label for="matchType">인원: </label>
        <select id="matchType" onchange="changeMatchType()" disabled>
            <option value="1">1 VS 1</option>
            <option value="2">2 VS 2</option>
            <option value="3">3 VS 3</option>
            <option value="4">4 VS 4</option>
            <option value="5" selected>5 VS 5</option>
        </select>
        <button id="startBtn" onclick="startGame()" disabled>▶ GAME START</button>
        <button id="pauseBtn" onclick="togglePause()" disabled>⏸ PAUSE</button>
        <span id="statusText" style="color: #f1c40f; margin-left: 5px;">[관전자 모드] 코드를 입력하세요.</span>
    </div>
    
    <div id="gameContainer">
        <div id="cutIn">디펜스!!</div>
        <div id="miniGameUI">
            <div id="miniGameTitle" style="font-weight:bold; font-size:16px;">🔥 연타 매치: 스페이스바 연타!! 🔥</div>
            <div class="progress-bar">
                <div id="progress"></div>
            </div>
            <div id="miniGameVS" style="font-size:12px; margin-top:5px; color:#ccc;">수비수 VS 공격수</div>
        </div>
        <canvas id="gameCanvas" width="1000" height="500"></canvas>
    </div>
    
    <div id="ui">
        <div style="color: #3498db;"><span id="teamLabel1">TEAM BLUE</span>: <span id="score1">0</span></div>
        <div style="color: #e74c3c;"><span id="teamLabel2">TEAM RED</span>: <span id="score2">0</span></div>
    </div>

<script>
const socket = io();

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const cutIn = document.getElementById("cutIn");
const miniGameUI = document.getElementById("miniGameUI");
const progressBar = document.getElementById("progress");
const statusText = document.getElementById("statusText");
const pauseBtn = document.getElementById("pauseBtn");

let isReferee = false; 

let scoreBlue = 0;
let scoreRed = 0;
let teamBlueName = "TEAM BLUE";
let teamRedName = "TEAM RED";

let gameState = "SETUP"; 
let currentMaxPairs = 5;
let miniGameGauge = 50;    
let miniGameTimer = 0;
let activeDefender = null;
let activeAttacker = null;

let defenseLockUntil = 0;

const registeredNames = new Set();

const court = {
    width: canvas.width,
    height: canvas.height,
    leftGoal: { x: 50, y: 250, radius: 20 },
    rightGoal: { x: 950, y: 250, radius: 20 }
};

const onlineScheme = { up: 'arrowup', down: 'arrowdown', left: 'arrowleft', right: 'arrowright', shoot: ' ', pass: 'c', def: 'x', grab: 'enter' };

class Player {
    constructor(x, y, team, id, spawnIndex) {
        this.x = x;
        this.y = y;
        this.team = team; 
        this.id = id;
        this.spawnIndex = spawnIndex;
        this.radius = 16;
        this.speed = 3.5;
        this.color = team === "BLUE" ? "#3498db" : "#e74c3c";
        
        this.ownerName = null;     
        this.angle = team === "BLUE" ? 0 : Math.PI; 

        this.lastDefenseTime = 0; 
        this.defenseCooldown = 7000; 
        
        this.skillLevel = 5.0;
    }

    draw() {
        const now = Date.now();
        const timePassed = now - this.lastDefenseTime;
        const isCooling = timePassed < this.defenseCooldown;

        if (this.ownerName) {
            ctx.save();
            ctx.strokeStyle = isCooling ? "rgba(180, 180, 180, 0.4)" : "rgba(255, 242, 0, 0.75)";
            ctx.lineWidth = 2.5;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x + Math.cos(this.angle) * 45, this.y + Math.sin(this.angle) * 45);
            ctx.stroke();
            ctx.restore();
        }

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.lineWidth = this.ownerName ? 4 : 1.5;
        ctx.strokeStyle = this.ownerName ? "#f1c40f" : "#fff"; 
        ctx.stroke();
        ctx.closePath();

        ctx.fillStyle = "#fff";
        ctx.font = "bold 10px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(this.id, this.x, this.y);

        if (this.ownerName) {
            ctx.fillStyle = "#fff";
            ctx.font = "bold 11px sans-serif";
            ctx.fillText(`${this.ownerName} [${this.skillLevel.toFixed(1)}v]`, this.x, this.y - this.radius - 8);

            if (isCooling && gameState !== "PAUSE") {
                const remaining = Math.ceil((this.defenseCooldown - timePassed) / 1000);
                ctx.fillStyle = "#ff4d4d";
                ctx.font = "9px sans-serif";
                ctx.fillText(`${remaining}s`, this.x, this.y + this.radius + 12);
            }
        }
    }

    move(dx, dy) {
        this.x += dx * this.speed;
        this.y += dy * this.speed;
        this.x = Math.max(this.radius, Math.min(court.width - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(court.height - this.radius, this.y));

        if (dx !== 0 || dy !== 0) {
            this.angle = Math.atan2(dy, dx);
        }
    }

    updateAI() {
        if (gameState !== "PLAYING" || this.ownerName) return;

        let dx = 0, dy = 0;
        if (ball.holder === this) {
            const targetGoal = this.team === "BLUE" ? court.rightGoal : court.leftGoal;
            const distToGoal = Math.hypot(targetGoal.x - this.x, targetGoal.y - this.y);
            if (distToGoal > 160) {
                dx = targetGoal.x - this.x;
                dy = targetGoal.y - this.y;
            } else if (Math.random() < 0.02) {
                shootAction(this);
            }
        } else {
            if (!ball.holder) {
                dx = ball.x - this.x;
                dy = ball.y - this.y;
            }
        }

        if (dx !== 0 || dy !== 0) {
            const length = Math.hypot(dx, dy);
            this.move(dx / length, dy / length);
            
            if (!ball.holder && !ball.isFlying && Math.hypot(ball.x - this.x, ball.y - this.y) < this.radius + ball.radius + 2) {
                ball.holder = this;
                socket.emit("syncBallAction", { x: ball.x, y: ball.y, vx: 0, vy: 0, holderId: { team: this.team, id: this.id }, isFlying: false });
            }
        }
    }
}

const ball = {
    x: 500,
    y: 250,
    radius: 9,
    vx: 0,
    vy: 0,
    holder: null,
    isFlying: false,

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#e67e22";
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = "#000";
        ctx.stroke();
        ctx.closePath();
    },

    update() {
        if (gameState !== "PLAYING") return;

        if (this.holder) {
            const dribbleY = Math.sin(Date.now() * 0.012) * 6;
            this.x = this.holder.x + Math.cos(this.holder.angle) * 14;
            this.y = this.holder.y + Math.sin(this.holder.angle) * 14 + dribbleY;
        } else if (this.isFlying) {
            this.x += this.vx;
            this.y += this.vy;
            this.vx *= 0.98;
            this.vy *= 0.98;

            const distToRight = Math.hypot(this.x - court.rightGoal.x, this.y - court.rightGoal.y);
            const distToLeft = Math.hypot(this.x - court.leftGoal.x, this.y - court.leftGoal.y);

            if (distToRight < court.rightGoal.radius) this.scoreGoal("BLUE");
            if (distToLeft < court.leftGoal.radius) this.scoreGoal("RED");

            if (Math.abs(this.vx) < 0.3 && Math.abs(this.vy) < 0.3) this.isFlying = false;
        }

        if (this.x < this.radius || this.x > court.width - this.radius) this.vx *= -1;
        if (this.y < this.radius || this.y > court.height - this.radius) this.vy *= -1;
        this.x = Math.max(this.radius, Math.min(court.width - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(court.height - this.radius, this.y));
    },

    scoreGoal(team) {
        this.isFlying = false;
        if (team === "BLUE") { scoreBlue += 2; document.getElementById("score1").innerText = scoreBlue; }
        else { scoreRed += 2; document.getElementById("score2").innerText = scoreRed; }
        
        socket.emit("syncScore", { blue: scoreBlue, red: scoreRed });
        this.resetBall();
    },

    resetBall() {
        this.x = 500;
        this.y = 250;
        this.vx = 0;
        this.vy = 0;
        this.holder = null;
    }
};

const allSpawnPositions = {
    BLUE: [ {x:200, y:250}, {x:320, y:130}, {x:320, y:370}, {x:120, y:160}, {x:120, y:340} ],
    RED:  [ {x:800, y:250}, {x:680, y:130}, {x:680, y:370}, {x:880, y:160}, {x:880, y:340} ]
};

let activePlayers = [];

function initPlayers() {
    activePlayers = [];
    registeredNames.clear();

    for(let i = 0; i < currentMaxPairs; i++) {
        let bPos = allSpawnPositions.BLUE[i];
        activePlayers.push(new Player(bPos.x, bPos.y, "BLUE", i+1, i));

        let rPos = allSpawnPositions.RED[i];
        activePlayers.push(new Player(rPos.x, rPos.y, "RED", i+1, i));
    }
    updateAdminDropdown();
}

function updateAdminDropdown() {
    const select = document.getElementById("adminTargetPlayer");
    if (!select) return;
    select.innerHTML = "";
    activePlayers.forEach(p => {
        if(p.ownerName) {
            const opt = document.createElement("option");
            opt.value = `${p.team}_${p.id}`;
            opt.innerText = `[${p.team}] ${p.ownerName} (${p.id}번)`;
            select.appendChild(opt);
        }
    });
    loadTargetSkillLevel();
}

function loadTargetSkillLevel() {
    const select = document.getElementById("adminTargetPlayer");
    if (!select || !select.value) return;
    const [team, id] = select.value.split("_");
    const target = activePlayers.find(p => p.team === team && p.id === parseInt(id));
    if (target) {
        document.getElementById("adminSkillInput").value = target.skillLevel.toFixed(1);
    }
}

function updatePlayerSkill() {
    if (!isReferee) return;
    const select = document.getElementById("adminTargetPlayer");
    if (!select || !select.value) return;
    const [team, id] = select.value.split("_");
    let val = parseFloat(document.getElementById("adminSkillInput").value);
    
    if (isNaN(val) || val < 5.0) val = 5.0;
    if (val > 9.9) val = 9.9;
    
    socket.emit("syncUpdateSkillLevel", { team, id: parseInt(id), skillLevel: val });
}

function authReferee() {
    const inputKey = document.getElementById("refKey").value;
    if (inputKey === "KEY") {
        isReferee = true;
        alert("심판 권한 인증 성공!");
        
        document.getElementById("matchType").disabled = false;
        document.getElementById("startBtn").disabled = false;
        pauseBtn.disabled = false;
        document.getElementById("teamNameBlueInput").disabled = false;
        document.getElementById("teamNameRedInput").disabled = false;
        document.getElementById("refereeZone").style.display = "none"; 
        document.getElementById("adminSkillZone").style.display = "flex"; 
        
        updateAdminDropdown();
        
        if(gameState === "SETUP") {
            statusText.innerText = "[대기 모드] 세팅 후 시작하세요.";
        }
    } else {
        alert("잘못된 심판 코드입니다!");
    }
}

function changeMatchType() {
    if (!isReferee) return;
    if (gameState !== "SETUP") return;
    currentMaxPairs = parseInt(document.getElementById("matchType").value);
    initPlayers();
    socket.emit("syncMatchType", currentMaxPairs);
}

// 실시간 팀명 송신 함수
function sendLiveTeamName(team) {
    if (!isReferee) return;
    let inputVal = "";
    if (team === "BLUE") {
        inputVal = document.getElementById("teamNameBlueInput").value.trim() || "TEAM BLUE";
        teamBlueName = inputVal;
        document.getElementById("teamLabel1").innerText = inputVal;
    } else {
        inputVal = document.getElementById("teamNameRedInput").value.trim() || "TEAM RED";
        teamRedName = inputVal;
        document.getElementById("teamLabel2").innerText = inputVal;
    }
    socket.emit("syncLiveTeamName", { team: team, name: inputVal });
}

function startGame() {
    if (!isReferee) return;
    
    document.getElementById("startBtn").blur();
    document.getElementById("matchType").blur();

    if (gameState === "SETUP") {
        teamBlueName = document.getElementById("teamNameBlueInput").value.trim() || "TEAM BLUE";
        teamRedName = document.getElementById("teamNameRedInput").value.trim() || "TEAM RED";
        
        socket.emit("syncStartGame", { teamBlueName, teamRedName });
    } else {
        socket.emit("syncResetMatch");
    }
}

function togglePause() {
    if (!isReferee) return;
    if (gameState === "SETUP") return; 
    pauseBtn.blur();
    socket.emit("syncTogglePause");
}

function shootAction(player) {
    if (gameState === "PAUSE") return;
    ball.holder = null;
    ball.isFlying = true;
    
    const lv = player.skillLevel;
    let successChance = 0.50; 
    
    if (lv >= 6.0 && lv < 7.0) successChance = 0.60;
    else if (lv >= 7.0 && lv < 8.0) successChance = 0.70;
    else if (lv >= 8.0 && lv < 9.0) successChance = 0.80;
    else if (lv >= 9.0) successChance = 0.90;

    const isSuccess = Math.random() < successChance;
    
    if (isSuccess) {
        const targetGoal = player.team === "BLUE" ? court.rightGoal : court.leftGoal;
        const angle = Math.atan2(targetGoal.y - player.y, targetGoal.x - player.x);
        const power = 14;
        ball.vx = Math.cos(angle) * power;
        ball.vy = Math.sin(angle) * power;
    } else {
        const targetGoal = player.team === "BLUE" ? court.rightGoal : court.leftGoal;
        const dev = (Math.random() - 0.5) * 0.6; 
        const angle = Math.atan2(targetGoal.y - player.y, targetGoal.x - player.x) + dev;
        const power = 13;
        ball.vx = Math.cos(angle) * power;
        ball.vy = Math.sin(angle) * power;
    }

    socket.emit("syncBallAction", { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy, holderId: null, isFlying: true });
}

function passAction(player) {
    if (gameState === "PAUSE") return;
    ball.holder = null;
    ball.isFlying = true;
    const power = 11;
    ball.vx = Math.cos(player.angle) * power;
    ball.vy = Math.sin(player.angle) * power;
    socket.emit("syncBallAction", { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy, holderId: null, isFlying: true });
}

canvas.addEventListener("click", e => {
    if (gameState !== "SETUP") return;

    const rect = canvas.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    activePlayers.forEach(p => {
        const dist = Math.hypot(p.x - mouseX, p.y - mouseY);
        if (dist < p.radius + 10) {
            if (!p.ownerName) {
                const name = prompt(`[${p.team === "BLUE" ? "블루" : "레드"} ${p.id}번] 지정할 유저의 이름을 입력하세요:`);
                if (name && name.trim() !== "") {
                    const trimmedName = name.trim();
                    
                    if (registeredNames.has(trimmedName)) {
                        alert(`'${trimmedName}' 유저는 이미 캐릭터를 선택했습니다.`);
                        return;
                    }

                    p.ownerName = trimmedName;
                    registeredNames.add(trimmedName);
                    
                    socket.emit("syncRegisterOwner", { team: p.team, id: p.id, ownerName: trimmedName });
                    updateAdminDropdown();
                }
            } else {
                alert(`이미 선점된 캐릭터입니다.`);
            }
        }
    });
});

const keys = {};
window.addEventListener("keydown", e => {
    if (e.key === " " || e.key === "Enter") e.preventDefault(); 

    const key = e.key.toLowerCase();
    keys[key] = true;
    
    if (gameState === "PAUSE") return; 

    if (gameState === "MINIGAME" && e.key === " ") {
        miniGameGauge -= 5;
        if (miniGameGauge < 0) miniGameGauge = 0;
        socket.emit("syncMiniGameHit", miniGameGauge);
        return;
    }

    if (gameState === "PLAYING") {
        activePlayers.forEach(p => {
            if (p.ownerName) {
                if (key === onlineScheme.grab) {
                    checkManualBallGrab(p);
                }
                
                if (ball.holder === p) {
                    if (key === onlineScheme.shoot) shootAction(p);
                    if (key === onlineScheme.pass) passAction(p);
                }
                if (key === onlineScheme.def) checkDefenseTrigger(p);
            }
        });
    }
});
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

function checkManualBallGrab(player) {
    if (ball.holder || ball.isFlying) return;
    
    const dist = Math.hypot(ball.x - player.x, ball.y - player.y);
    if (dist < player.radius + ball.radius + 15) { 
        ball.holder = player;
        socket.emit("syncBallAction", { x: ball.x, y: ball.y, vx: 0, vy: 0, holderId: { team: player.team, id: player.id }, isFlying: false });
    }
}

function checkDefenseTrigger(defender) {
    const now = Date.now();
    if (now < defenseLockUntil) return;
    if (now - defender.lastDefenseTime < defender.defenseCooldown) return; 

    if (ball.holder && ball.holder.team !== defender.team) {
        const dist = Math.hypot(defender.x - ball.holder.x, defender.y - ball.holder.y);
        if (dist < defender.radius + ball.holder.radius + 25) {
            defender.lastDefenseTime = now; 
            socket.emit("syncStartDefense", { defTeam: defender.team, defId: defender.id, attTeam: ball.holder.team, attId: ball.holder.id });
        }
    }
}

function startDefenseMiniGame(defender, attacker) {
    gameState = "MINIGAME";
    activeDefender = defender;
    activeAttacker = attacker;
    miniGameGauge = 50; 
    miniGameTimer = 150; 

    const defName = defender.ownerName || `${defender.team === "BLUE" ? teamBlueName : teamRedName} ${defender.id}`;
    const attName = attacker.ownerName || `${attacker.team === "BLUE" ? teamBlueName : teamRedName} ${attacker.id}`;
    document.getElementById("miniGameVS").innerText = `🛡️ 수비수 [${defName}] VS 🏀 공격수 [${attName}]`;

    cutIn.classList.add("active");
    setTimeout(() => {
        if (gameState === "PAUSE") return; 
        cutIn.classList.remove("active");
        miniGameUI.style.display = "block";
    }, 600);
}

function updateMiniGame() {
    if (gameState !== "MINIGAME") return;
    
    if (isReferee) {
        miniGameTimer--;
        miniGameGauge += 0.35; 
        if (miniGameGauge > 100) miniGameGauge = 100;
        
        socket.emit("syncMiniGameTick", { gauge: miniGameGauge, timer: miniGameTimer });

        if (miniGameGauge <= 5) socket.emit("syncEndMiniGame", true);
        else if (miniGameGauge >= 95 || miniGameTimer <= 0) socket.emit("syncEndMiniGame", false);
    }
}

function endMiniGame(isDefenderWin) {
    gameState = "PLAYING";
    miniGameUI.style.display = "none";

    if (isDefenderWin) {
        ball.holder = activeDefender;
    } else {
        const angle = Math.atan2(activeDefender.y - activeAttacker.y, activeDefender.x - activeAttacker.x);
        activeDefender.x += Math.cos(angle) * 50;
        activeDefender.y += Math.sin(angle) * 50;
    }
    
    defenseLockUntil = Date.now() + 3000;

    activeDefender = null;
    activeAttacker = null;
}

function update() {
    if (gameState === "PAUSE") return;

    if (gameState === "PLAYING") {
        activePlayers.forEach(p => {
            if (p.ownerName) {
                let dx = 0, dy = 0;
                if (keys[onlineScheme.up]) dy = -1;
                if (keys[onlineScheme.down]) dy = 1;
                if (keys[onlineScheme.left]) dx = -1;
                if (keys[onlineScheme.right]) dx = 1;
                
                if (dx !== 0 || dy !== 0) {
                    p.move(dx, dy);
                    socket.emit("syncPlayerMove", { team: p.team, id: p.id, x: p.x, y: p.y, angle: p.angle });
                }
            } else {
                if (isReferee) {
                    p.updateAI();
                    socket.emit("syncPlayerMove", { team: p.team, id: p.id, x: p.x, y: p.y, angle: p.angle });
                }
            }
        });

        ball.update();
        if (isReferee) {
            socket.emit("syncBallLocation", { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy, isFlying: ball.isFlying });
        }
    } else if (gameState === "MINIGAME") {
        updateMiniGame();
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "rgba(255,255,255,0.4)";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(500, 0); ctx.lineTo(500, 500); ctx.stroke();
    ctx.beginPath(); ctx.arc(500, 250, 70, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeRect(0, 150, 80, 200);
    ctx.strokeRect(920, 150, 80, 200);

    ctx.strokeStyle = "#fff";
    ctx.beginPath(); ctx.arc(court.leftGoal.x, court.leftGoal.y, court.leftGoal.radius, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(court.rightGoal.x, court.rightGoal.y, court.rightGoal.radius, 0, Math.PI * 2); ctx.stroke();

    activePlayers.forEach(p => p.draw());
    ball.draw();

    if (gameState === "PAUSE") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "#fff";
        ctx.font = "bold 40px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("⏸ MATCH PAUSED", canvas.width / 2, canvas.height / 2);
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

socket.on("onInitRoomState", (serverRoom) => {
    gameState = serverRoom.gameState;
    currentMaxPairs = serverRoom.currentMaxPairs;
    document.getElementById("matchType").value = currentMaxPairs;
    
    initPlayers();

    serverRoom.registeredOwners.forEach(data => {
        const target = activePlayers.find(p => p.team === data.team && p.id === data.id);
        if (target) {
            target.ownerName = data.ownerName;
            target.skillLevel = data.skillLevel || 5.0;
            registeredNames.add(data.ownerName);
        }
    });
    updateAdminDropdown();

    teamBlueName = serverRoom.teamBlueName;
    teamRedName = serverRoom.teamRedName;
    document.getElementById("teamLabel1").innerText = teamBlueName;
    document.getElementById("teamLabel2").innerText = teamRedName;
    document.getElementById("teamNameBlueInput").value = teamBlueName;
    document.getElementById("teamNameRedInput").value = teamRedName;

    scoreBlue = serverRoom.scoreBlue;
    scoreRed = serverRoom.scoreRed;
    document.getElementById("score1").innerText = scoreBlue;
    document.getElementById("score2").innerText = scoreRed;

    if (gameState === "PLAYING" || gameState === "MINIGAME" || gameState === "PAUSE") {
        document.getElementById("startBtn").disabled = !isReferee;
        pauseBtn.disabled = !isReferee;
        
        if (gameState === "PAUSE") {
            statusText.innerText = "[일시정지] 경기가 멈췄습니다.";
            statusText.style.color = "#e74c3c";
            pauseBtn.innerText = "▶ RESUME";
        } else {
            statusText.innerText = "[경기 중] 매치 진행 중!";
            statusText.style.color = "#2ecc71";
            pauseBtn.innerText = "⏸ PAUSE";
        }
        document.getElementById("startBtn").innerText = "⏸ RESET MATCH";
    } else {
        statusText.innerText = isReferee ? "[대기 모드] 세팅 후 시작하세요." : "[관전자 모드] 코드를 입력하세요.";
        statusText.style.color = "#f1c40f";
        document.getElementById("startBtn").innerText = "▶ GAME START";
        pauseBtn.disabled = true;
        pauseBtn.innerText = "⏸ PAUSE";
    }
});

socket.on("onPlayerMove", (data) => {
    const target = activePlayers.find(p => p.team === data.team && p.id === data.id);
    if (target) {
        target.x = data.x;
        target.y = data.y;
        target.angle = data.angle;
    }
});

socket.on("onBallLocation", (data) => {
    if (!isReferee) {
        ball.x = data.x;
        ball.y = data.y;
        ball.vx = data.vx;
        ball.vy = data.vy;
        ball.isFlying = data.isFlying;
    }
});

socket.on("onBallAction", (data) => {
    ball.x = data.x;
    ball.y = data.y;
    ball.vx = data.vx;
    ball.vy = data.vy;
    ball.isFlying = data.isFlying;
    if (data.holderId) {
        ball.holder = activePlayers.find(p => p.team === data.holderId.team && p.id === data.holderId.id);
    } else {
        ball.holder = null;
    }
});

socket.on("onRegisterOwner", (data) => {
    const target = activePlayers.find(p => p.team === data.team && p.id === data.id);
    if (target) {
        target.ownerName = data.ownerName;
        target.skillLevel = data.skillLevel || 5.0;
        registeredNames.add(data.ownerName);
        updateAdminDropdown();
    }
});

socket.on("onUpdateSkillLevel", (data) => {
    const target = activePlayers.find(p => p.team === data.team && p.id === data.id);
    if (target) {
        target.skillLevel = parseFloat(data.skillLevel);
    }
});

socket.on("onMatchType", (maxPairs) => {
    currentMaxPairs = maxPairs;
    document.getElementById("matchType").value = maxPairs;
    initPlayers();
});

// 다른 플레이어가 타이핑한 팀명을 실시간 수신하여 반영
socket.on("onLiveTeamName", (data) => {
    if (data.team === "BLUE") {
        teamBlueName = data.name;
        document.getElementById("teamLabel1").innerText = data.name;
        document.getElementById("teamNameBlueInput").value = data.name;
    } else {
        teamRedName = data.name;
        document.getElementById("teamLabel2").innerText = data.name;
        document.getElementById("teamNameRedInput").value = data.name;
    }
});

socket.on("onStartGame", (data) => {
    teamBlueName = data.teamBlueName;
    teamRedName = data.teamRedName;
    document.getElementById("teamLabel1").innerText = teamBlueName;
    document.getElementById("teamLabel2").innerText = teamRedName;
    
    document.getElementById("teamNameBlueInput").value = teamBlueName;
    document.getElementById("teamNameRedInput").value = teamRedName;

    gameState = "PLAYING";
    statusText.innerText = "[경기 중] 매치 진행 중!";
    statusText.style.color = "#2ecc71";
    document.getElementById("startBtn").innerText = "⏸ RESET MATCH";
    pauseBtn.disabled = !isReferee;
    pauseBtn.innerText = "⏸ PAUSE";
});

socket.on("onResetMatch", () => {
    gameState = "SETUP";
    statusText.innerText = "[대기 모드] 세팅 후 시작하세요.";
    statusText.style.color = "#f1c40f";
    document.getElementById("startBtn").innerText = "▶ GAME START";
    pauseBtn.disabled = true;
    pauseBtn.innerText = "⏸ PAUSE";
    
    scoreBlue = 0; scoreRed = 0;
    document.getElementById("score1").innerText = 0;
    document.getElementById("score2").innerText = 0;
    defenseLockUntil = 0;
    initPlayers();
    ball.resetBall();
});

socket.on("onTogglePause", (data) => {
    gameState = data.gameState;
    if (data.isPaused) {
        statusText.innerText = "[일시정지] 경기가 멈췄습니다.";
        statusText.style.color = "#e74c3c";
        pauseBtn.innerText = "▶ RESUME";
    } else {
        statusText.innerText = "[경기 중] 매치 진행 중!";
        statusText.style.color = "#2ecc71";
        pauseBtn.innerText = "⏸ PAUSE";
    }
});

socket.on("onScore", (data) => {
    scoreBlue = data.blue;
    scoreRed = data.red;
    document.getElementById("score1").innerText = scoreBlue;
    document.getElementById("score2").innerText = scoreRed;
});

socket.on("onStartDefense", (data) => {
    const def = activePlayers.find(p => p.team === data.defTeam && p.id === data.defId);
    const att = activePlayers.find(p => p.team === data.attTeam && p.id === data.attId);
    if (def && att) {
        def.lastDefenseTime = Date.now();
        startDefenseMiniGame(def, att);
    }
});

socket.on("onMiniGameTick", (data) => {
    if (!isReferee) {
        miniGameGauge = data.gauge;
        miniGameTimer = data.timer;
        progressBar.style.width = `${miniGameGauge}%`;
    }
});

socket.on("onMiniGameHit", (gauge) => {
    miniGameGauge = gauge;
    progressBar.style.width = `${miniGameGauge}%`;
});

socket.on("onEndMiniGame", (isDefWin) => {
    endMiniGame(isDefWin);
});

initPlayers();
ball.resetBall();
gameLoop();
</script>
</body>
</html>
