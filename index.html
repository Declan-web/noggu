<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5vs5 실시간 멀티플레이 농구 게임</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #gameCanvas {
            border: 4px solid #fff;
            background-color: #e67e22; /* 농구 코트의 황토색 바닥 구현 */
        }
        #lobby {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #fff;
        }
        input, button, select {
            padding: 10px;
            margin: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
        }
        button {
            background-color: #3498db;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #2980b9;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="lobby">
        <h2>🏀 5vs5 농구 게임 입장 🏀</h2>
        <input type="text" id="nicknameInput" placeholder="닉네임을 입력하세요" maxlength="8"><br>
        <select id="teamSelect">
            <option value="A">A팀 (블루)</option>
            <option value="B">B팀 (레드)</option>
        </select><br>
        <button id="startBtn">게임 참여하기</button>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        // 현재 호스팅 환경(로컬 또는 Render 도메인 주소)에 맞게 자동으로 소켓 연결을 수립합니다.
        const socket = io();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const lobby = document.getElementById('lobby');
        const nicknameInput = document.getElementById('nicknameInput');
        const teamSelect = document.getElementById('teamSelect');
        const startBtn = document.getElementById('startBtn');

        let myId = null;
        let remotePlayers = {};
        let isPlaying = false;

        // 클라이언트 본인의 초기 위치 및 이동 속도 정보
        let myData = {
            name: '',
            team: 'A',
            x: 400,
            y: 300,
            speed: 5
        };

        // 연속적인 키보드 입력을 처리하기 위한 버퍼 객체
        const keys = {};

        // '게임 참여하기' 버튼을 눌렀을 때의 동작
        startBtn.addEventListener('click', () => {
            const name = nicknameInput.value.trim();
            if (!name) {
                alert('닉네임을 입력해 주세요!');
                return;
            }
            
            myData.name = name;
            myData.team = teamSelect.value;
            
            // 진영에 따른 플레이어 배치 분기 처리
            if (myData.team === 'A') {
                myData.x = 200;
                myData.y = 300;
            } else {
                myData.x = 600;
                myData.y = 300;
            }

            lobby.style.display = 'none';
            isPlaying = true;

            // 서버에 신규 플레이어 진입 이벤트 전송
            socket.emit('joinGame', {
                name: myData.name,
                team: myData.team,
                x: myData.x,
                y: myData.y
            });
        });

        // 서버와 연결이 완료되면 내 고유 소켓 아이디 확보
        socket.on('connect', () => {
            myId = socket.id;
        });

        // 서버로부터 실시간 유저 전체 명단을 수신하여 화면 데이터 갱신
        socket.on('updatePlayers', (serverPlayers) => {
            remotePlayers = serverPlayers;
        });

        // 키보드 이벤트 청취기 등록
        window.addEventListener('keydown', (e) => { keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key] = false; });

        // 입력값에 따른 좌표 계산 및 경계 조건 처리 함수
        function updateMovement() {
            if (!isPlaying) return;

            let moved = false;

            if (keys['ArrowUp'] || keys['w'] || keys['W']) { myData.y -= myData.speed; moved = true; }
            if (keys['ArrowDown'] || keys['s'] || keys['S']) { myData.y += myData.speed; moved = true; }
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) { myData.x -= myData.speed; moved = true; }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) { myData.x += myData.speed; moved = true; }

            // 캔버스 밖으로 선수가 빠져나가지 않도록 경계면 홀딩 처리
            if (myData.x < 15) myData.x = 15;
            if (myData.x > canvas.width - 15) myData.x = canvas.width - 15;
            if (myData.y < 15) myData.y = 15;
            if (myData.y > canvas.height - 15) myData.y = canvas.height - 15;

            // 실제로 좌표 변화가 일어났을 때만 내 실시간 위치를 서버로 보고
            if (moved) {
                socket.emit('playerMove', {
                    x: myData.x,
                    y: myData.y
                });
            }
        }

        // 프레임별 화면 렌더링 갱신 함수
        function drawGame() {
            // 매 프레임마다 이전 잔상 삭제를 위해 전체 캔버스 영역 클리어
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 코트 규격용 라인 드로잉 설정
            ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
            ctx.lineWidth = 3;
            
            // 경기장 중앙 분할선 그리기
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            
            // 경기장 중앙 센터서클 원 그리기
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 70, 0, Math.PI * 2);
            ctx.stroke();

            // 서버에서 받아온 원격 유저들의 실시간 위치를 기반으로 캐릭터 시각화
            for (let id in remotePlayers) {
                const player = remotePlayers[id];

                // 플레이어 원형 캐릭터 생성
                ctx.beginPath();
                ctx.arc(player.x, player.y, 15, 0, Math.PI * 2);
                
                // 팀 할당값에 따른 조건부 유저 컬러 부여
                if (player.team === 'A') {
                    ctx.fillStyle = '#3498db'; // A팀: 블루
                } else {
                    ctx.fillStyle = '#e74c3c'; // B팀: 레드
                }
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 캐릭터 머리 위에 닉네임 문자열 출력
                ctx.fillStyle = '#fff';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(player.name, player.x, player.y - 22);
            }
        }

        // 메인 브라우저 최적화 렌더링 인터벌 루프 엔진
        function gameLoop() {
            updateMovement();
            drawGame();
            requestAnimationFrame(gameLoop);
        }

        // 전체 메인 시스템 가동 루프 트리거 시작
        gameLoop();
    </script>
</body>
</html>
