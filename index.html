<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 멀티플레이 농구 게임</title>
    <style>
        body {
            margin: 0;
            background-color: #2b2b2b;
            color: white;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        /* 상단 설정 바 스타일 */
        #topBar {
            background-color: #383838;
            border: 1px solid #4a4a4a;
            border-radius: 6px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
            font-size: 14px;
            width: 764px;
        }
        .divider {
            color: #555;
        }
        select {
            background-color: #222;
            color: white;
            border: 1px solid #666;
            padding: 4px 10px;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }
        #startBtn {
            background-color: #f39c12; /* 오렌지/주황색 버튼 */
            color: white;
            border: none;
            padding: 6px 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        #startBtn:hover {
            background-color: #d35400;
        }
        #statusText {
            color: #f1c40f; /* 노란색 안내 글씨 */
            font-size: 13px;
        }
        /* 경기장 캔버스 테두리 및 배경색 */
        #gameCanvas {
            border: 4px solid #fff;
            border-radius: 4px;
            background-color: #d35400; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        /* 하단 점수판 */
        #scoreBoard {
            display: flex;
            gap: 30px;
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        .blue-score { color: #3498db; }
        .red-score { color: #e74c3c; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="topBar">
        <div>
            <span class="divider">|</span> &nbsp;인원: 
            <select id="playerCountSelect">
                <option value="1">1 VS 1</option>
                <option value="2">2 VS 2</option>
                <option value="3">3 VS 3</option>
                <option value="4">4 VS 4</option>
                <option value="5">5 VS 5</option>
            </select>
        </div>
        <button id="startBtn">▶ GAME START</button>
        <div id="statusText">[대기 모드] 캐릭터를 선택하고 게임을 기동하세요.</div>
    </div>

    <canvas id="gameCanvas" width="850" height="500"></canvas>

    <div id="scoreBoard">
        <div class="blue-score">TEAM BLUE: <span id="blueScoreText">0</span></div>
        <div class="red-score">TEAM RED: <span id="redScoreText">0</span></div>
    </div>

    <script>
        const socket = io();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const playerCountSelect = document.getElementById('playerCountSelect');
        const startBtn = document.getElementById('startBtn');
        const statusText = document.getElementById('statusText');
        const blueScoreText = document.getElementById('blueScoreText');
        const redScoreText = document.getElementById('redScoreText');

        let myId = null;
        let remotePlayers = {};
        let gameState = {
            ball: { x: 425, y: 250 },
            score: { blue: 0, red: 0 },
            gameStarted: false,
            maxPlayers: 1
        };

        // 내 초기 기본 데이터 (진입 시 BLUE 팀 배치)
        let myData = {
            name: 'Chaehee',
            team: 'BLUE', 
            x: 200,
            y: 250,
            number: 1
        };

        const keys = {};

        // 인원 설정 변경 시 서버 전송
        playerCountSelect.addEventListener('change', (e) => {
            socket.emit('changeMaxPlayers', e.target.value);
        });

        // 게임 시작 버튼 클릭 시 서버 전송
        startBtn.addEventListener('click', () => {
            socket.emit('startGame');
        });

        socket.on('connect', () => {
            myId = socket.id;
            socket.emit('joinGame', myData);
        });

        socket.on('updatePlayers', (serverPlayers) => {
            remotePlayers = serverPlayers;
        });

        socket.on('updateGameState', (serverState) => {
            gameState = serverState;
            playerCountSelect.value = gameState.maxPlayers;
            blueScoreText.textContent = gameState.score.blue;
            redScoreText.textContent = gameState.score.red;
        });

        socket.on('gameStarted', (serverState) => {
            gameState = serverState;
            statusText.textContent = "[경기 중] 실시간 매치가 진행 중입니다!";
            statusText.style.color = "#2ecc71";
        });

        window.addEventListener('keydown', (e) => { keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key] = false; });

        function updateMovement() {
            if (!remotePlayers[myId]) return;

            let moved = false;
            let speed = 4;

            if (keys['ArrowUp'] || keys['w'] || keys['W']) { myData.y -= speed; moved = true; }
            if (keys['ArrowDown'] || keys['s'] || keys['S']) { myData.y += speed; moved = true; }
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) { myData.x -= speed; moved = true; }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) { myData.x += speed; moved = true; }

            if (myData.x < 20) myData.x = 20;
            if (myData.x > canvas.width - 20) myData.x = canvas.width - 20;
            if (myData.y < 20) myData.y = 20;
            if (myData.y > canvas.height - 20) myData.y = canvas.height - 20;

            if (moved) {
                socket.emit('playerMove', { x: myData.x, y: myData.y });
            }
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // [맵 디자인] 경기장 라인 그리기
            ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
            ctx.lineWidth = 2;

            // 중앙선 및 센터 서클
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 60, 0, Math.PI * 2);
            ctx.stroke();

            // 왼쪽 골라인 구획
            ctx.strokeRect(0, 150, 80, 200);
            ctx.beginPath();
            ctx.arc(80, 250, 40, -Math.PI/2, Math.PI/2);
            ctx.stroke();

            // 오른쪽 골라인 구획
            ctx.strokeRect(canvas.width - 80, 150, 80, 200);
            ctx.beginPath();
            ctx.arc(canvas.width - 80, 250, 40, Math.PI/2, -Math.PI/2);
            ctx.stroke();

            // 중앙 농구공 렌더링
            ctx.beginPath();
            ctx.arc(gameState.ball.x, gameState.ball.y, 10, 0, Math.PI * 2);
            ctx.fillStyle = "#e67e22";
            ctx.fill();
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // 선수들 그리기
            for (let id in remotePlayers) {
                const player = remotePlayers[id];

                ctx.beginPath();
                ctx.arc(player.x, player.y, 16, 0, Math.PI * 2);
                
                if (player.team === 'BLUE') {
                    ctx.fillStyle = '#3498db';
                } else {
                    ctx.fillStyle = '#e74c3c';
                }
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 등번호 텍스트
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(player.number, player.x, player.y);
            }
        }

        function gameLoop() {
            updateMovement();
            drawGame();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
