<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>다들 모여! - 멀티 세션 연동 버전</title>
    <style>
        body {
            margin: 0; background-color: #222; color: #fff;
            font-family: 'Arial', sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start; min-height: 100vh;
            overflow-x: hidden; overflow-y: auto; padding-bottom: 20px; box-sizing: border-box;
            -webkit-user-select: none; user-select: none;
        }

        /* 🚪 세션 입력용 확장 카드 UI 디자인 */
        #roomEntrance {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #1a1a1a; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10000;
        }
        .entrance-box {
            background: #2c3e50; padding: 25px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center;
            border: 2px solid #f39c12; max-width: 420px; width: 85%;
        }
        .entrance-box h1 { margin-top: 0; color: #f39c12; font-size: 24px; }
        .input-group {
            display: flex; flex-direction: column; margin-bottom: 12px; text-align: left;
        }
        .input-group label {
            font-size: 13px; color: #f1c40f; font-weight: bold; margin-bottom: 4px;
        }
        .entrance-box input, .entrance-box select {
            width: 100%; padding: 10px; font-size: 16px; text-align: center;
            border-radius: 6px; border: none; font-weight: bold;
            background: #fff; color: #000; box-sizing: border-box;
        }
        .entrance-box button {
            width: 100%; padding: 12px; font-size: 16px; background: #e67e22;
            color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;
            margin-top: 10px;
        }
        .entrance-box button:hover { background: #d35400; }
        
        #lobby {
            margin-top: 10px; margin-bottom: 15px; display: none; gap: 12px;
            align-items: center; background: #333; padding: 10px 20px;
            border-radius: 8px; border: 1px solid #555; flex-wrap: wrap;
            z-index: 20; justify-content: center; width: 95%; max-width: 1400px; box-sizing: border-box;
        }
        
        #mainLayout {
            display: none; gap: 20px; align-items: flex-start; justify-content: center;
            width: 100%; max-width: 1780px; padding: 0 10px; box-sizing: border-box; flex-wrap: wrap;
        }

        select, button, input { padding: 8px 12px; font-size: 14px; font-weight: bold; border-radius: 4px; border: none; }
        input[type="password"] { background-color: #444; color: #fff; border: 1px solid #666; width: 80px; text-align: center; }
        input[type="text"] { background-color: #444; color: #fff; border: 1px solid #666; width: 100px; }
        input[type="number"] { background-color: #444; color: #fff; border: 1px solid #666; width: 45px; text-align: center; }
        select { background-color: #444; color: #fff; border: 1px solid #666; }
        button { background-color: #f39c12; color: #fff; cursor: pointer; touch-action: manipulation; }
        button:hover { background-color: #d35400; }
        button:disabled, select:disabled, input:disabled { background-color: #555; color: #888; cursor: not-allowed; }

        .side-panel { width: 240px; height: 508px; background-color: #555555; border-radius: 12px; padding: 20px; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        .side-panel.log-panel { width: 440px; }

        #gameContainer { position: relative; box-shadow: 0 0 25px rgba(0,0,0,0.7); width: 100%; max-width: 1000px; margin: 0 auto; }
        canvas { background-color: #d35400; border: 4px solid #fff; display: block; border-radius: 4px; outline: none; width: 100% !important; height: auto !important; box-sizing: border-box; }

        @media (max-width: 1024px) {
            .side-panel { width: 100% !important; height: 160px !important; }
            .side-panel.log-panel { height: 200px !important; }
            #gameContainer { order: -1; width: 100%; }
        }

        .panel-title { font-size: 18px; font-weight: bold; text-align: center; margin-bottom: 15px; letter-spacing: 1px; border-bottom: 2px solid #666; padding-bottom: 10px; }
        #keyGuideList { display: flex; flex-direction: column; gap: 10px; font-size: 13px; line-height: 1.4; overflow-y: auto; }
        .key-row { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 5px; }
        .key-val { color: #f1c40f; font-weight: bold; }

        #logContainer { flex: 1; overflow-y: auto; background: #444; border-radius: 6px; padding: 12px; font-size: 14px; display: flex; flex-direction: column; gap: 8px; word-break: break-all; white-space: pre-wrap; }
        .log-item { border-bottom: 1px solid #555; padding-bottom: 4px; line-height: 1.4; }
        .log-time { color: #aaa; margin-right: 6px; font-size: 11px; }
        .log-type-score { color: #2ecc71; font-weight: bold; }
        .log-type-defense { color: #e67e22; font-weight: bold; }
        .log-type-chat { color: #f1c40f; font-weight: bold; background: rgba(241, 196, 15, 0.1); border-radius: 2px; padding: 2px 4px; }

        #chatInputZone { margin-top: 10px; display: none; gap: 5px; }
        #directorChatMsg { flex: 1; background: #333; color: #fff; border: 1px solid #666; padding: 6px; font-size: 13px; border-radius: 4px; }

        #cutIn {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0);
            font-size: 50px; font-weight: 900; color: #e74c3c;
            text-shadow: -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 3px 3px 0 #fff, 0px 6px 8px rgba(0,0,0,0.5);
            font-style: italic; pointer-events: none; transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 10;
        }
        #cutIn.active { transform: translate(-50%, -50%) scale(1); }
        
        #miniGameUI {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.9); padding: 15px 25px; border-radius: 12px;
            border: 3px solid #f1c40f; text-align: center; display: none; z-index: 25;
            touch-action: none; cursor: pointer; width: 80%; max-width: 320px; box-sizing: border-box;
        }
        .progress-bar { width: 100%; height: 20px; background-color: #555; border-radius: 10px; overflow: hidden; margin-top: 10px; border: 1px solid #fff; }
        #progress { width: 50%; height: 100%; background: linear-gradient(90deg, #3498db, #e74c3c); transition: width 0.05s linear; }
        
        #ui { margin-top: 10px; font-size: 24px; font-weight: bold; display: none; gap: 60px; justify-content: center; width: 100%; }
        #adminSkillZone { display: none; align-items: center; gap: 5px; background: #444; padding: 3px 8px; border-radius: 4px; border: 1px solid #666; }
        #pauseBtn { background-color: #34495e; color: #fff; }
        #resetBtn { background-color: #c0392b; color: #fff; }
        #clearLogBtn { background-color: #7f8c8d; color: #fff; margin-left: 5px; }
        .capacity-zone { display: flex; align-items: center; gap: 4px; background: #444; padding: 4px 8px; border-radius: 4px; border: 1px solid #666; font-size: 13px; }

        #globalDefenseLockUntilZone {
            margin-top: 15px; width: 90%; max-width: 400px; background: rgba(0, 0, 0, 0.6);
            border: 1px solid #666; padding: 8px 12px; border-radius: 6px; display: none;
            flex-direction: column; align-items: center; gap: 5px; box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        #cooldownTitle { font-size: 12px; font-weight: bold; color: #e74c3c; }
        .cooldown-progress-container { width: 100%; height: 12px; background-color: #333; border-radius: 6px; overflow: hidden; border: 1px solid #555; }
        #cooldownProgressFiller { width: 0%; height: 100%; background: #e74c3c; }

        #mobileController {
            display: none; position: fixed; left: 0; bottom: 0; width: 100vw; height: 160px;
            justify-content: space-between; align-items: center; padding: 10px 20px; box-sizing: border-box;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            z-index: 9999; pointer-events: none;
        }
        .v-joystick-container { position: relative; width: 120px; height: 120px; background: rgba(22, 22, 22, 0.7); border: 3px solid #f39c12; border-radius: 50%; display: flex; align-items: center; justify-content: center; touch-action: none; pointer-events: auto; }
        .v-joystick-stick { position: absolute; width: 45px; height: 45px; background: #f39c12; border-radius: 50%; box-shadow: 0 4px 8px rgba(0,0,0,0.6); }
        .v-buttons-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; pointer-events: auto; }
        .v-btn {
            width: 60px; height: 60px; background: rgba(50, 50, 50, 0.85); border: 2px solid #aaa;
            color: white; border-radius: 50%; font-size: 11px; font-weight: bold; display: flex;
            align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            touch-action: none; -webkit-tap-highlight-color: transparent;
        }
        .v-btn:active { background: #d35400; border-color: #fff; transform: scale(0.9); }
        .v-btn.btn-action-grab { background: rgba(41, 128, 185, 0.9); border-color: #3498db; }
        .v-btn.btn-action-def { background: rgba(39, 174, 96, 0.9); border-color: #2ecc71; }
        
        @media (pointer: coarse) { #mobileController.active { display: flex; } }
        #fullscreenBtn { background-color: #8e44ad; color: #fff; }
        #roomInfoBadge { background-color: #2980b9; color: white; padding: 6px 12px; border-radius: 4px; font-size: 13px; font-weight: bold; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="roomEntrance">
        <div class="entrance-box">
            <h1>🏀 경기 관리 연동소</h1>
            
            <div class="input-group">
                <label for="roomCodeSelect">경기 구역 지정</label>
                <select id="roomCodeSelect">
                    <option value="0001">0001호 경기 코트</option>
                    <option value="0002">0002호 경기 코트</option>
                </select>
            </div>

            <div class="input-group">
                <label for="roomUserNameInput">유저 참관명 (본인 실명)</label>
                <input type="text" id="roomUserNameInput" placeholder="예: 홍길동" style="width:100%;">
            </div>

            <div class="input-group">
                <label for="roomUserPasswordInput">접속 비밀번호 (숫자 4자리)</label>
                <input type="password" id="roomUserPasswordInput" maxlength="4" placeholder="••••" style="width:100%;">
            </div>

            <button onclick="submitRoomAuth(false)">경기 데이터망 동기화</button>
        </div>
    </div>

    <div id="lobby">
        <div id="roomInfoBadge">🏠 방: 미지정</div>
        <button id="fullscreenBtn" onclick="requestFullScreen()">📱 전체화면 켜기</button>

        <div id="refereeZone" style="display: flex; gap: 8px; align-items: center;">
            <label for="refName">감독: </label>
            <input type="text" id="refName" placeholder="감독명" style="width: 70px;">
            <label for="refKey">코드: </label>
            <input type="password" id="refKey" placeholder="코드">
            <button onclick="authReferee()" id="authBtn">임명</button>
        </div>
        
        <div id="adminSkillZone">
            <label id="directorTitleLabel" style="color: #f1c40f; margin-right: 5px; font-weight: bold;"></label>
            <label>경기력:</label>
            <select id="adminTargetPlayer" onchange="loadTargetSkillLevel()"></select>
            <input type="number" id="adminSkillInput" min="5.0" max="9.9" step="0.1" value="5.0">
            <button onclick="updatePlayerSkill()">적용</button>
            <button id="clearLogBtn" onclick="clearLogsFromServer()">로그 초기화</button>
        </div>

        <span style="color:#555;">|</span>

        <label>팀명: </label>
        <input type="text" id="teamNameBlueInput" value="TEAM BLUE" placeholder="블루팀명" oninput="sendLiveTeamName('BLUE')" disabled>
        <input type="text" id="teamNameRedInput" value="TEAM RED" placeholder="레드팀명" oninput="sendLiveTeamName('RED')" disabled>

        <div class="capacity-zone">
            <span style="color: #3498db; font-weight: bold;">BLUE</span>
            <input type="number" id="maxBlueInput" min="1" max="5" value="5" onchange="sendMatchCapacity()" disabled>
            <span style="font-weight: bold; color: #aaa;">VS</span>
            <input type="number" id="maxRedInput" min="1" max="5" value="5" onchange="sendMatchCapacity()" disabled>
            <span style="color: #e74c3c; font-weight: bold;">RED</span>
        </div>

        <button id="startBtn" onclick="startGame()" disabled>[시작] START</button>
        <button id="pauseBtn" onclick="togglePause()" disabled>PAUSE</button>
        <button id="resetBtn" onclick="triggerManualReset()" disabled>RESET</button>
        <span id="statusText" style="color: #f1c40f; margin-left: 5px;">[관전자 모드] 데이터를 입력하세요.</span>
    </div>
    
    <div id="mainLayout">
        <div class="side-panel">
            <div class="panel-title">조작키</div>
            <div id="keyGuideList">
                <div class="key-row"><span>상하좌우 이동</span><span class="key-val">W,A,S,D / 패드</span></div>
                <div class="key-row"><span>공 줍기</span><span class="key-val">E / GRAB</span></div>
                <div class="key-row"><span>패스</span><span class="key-val">Shift / PASS</span></div>
                <div class="key-row"><span>슛</span><span class="key-val">Space / SHOOT</span></div>
                <div class="key-row"><span>디펜스 시도</span><span class="key-val">좌클릭 / DEF</span></div>
                <div class="key-row"><span>디펜스 게임</span><span class="key-val">우클릭 / UI 연타</span></div>
            </div>
        </div>

        <div id="gameContainer">
            <div id="cutIn">디펜스!!</div>
            <div id="miniGameUI">
                <div id="miniGameTitle" style="font-weight:bold; font-size:14px;">🔥 화면(UI)을 마구 연타하세요!! 🔥</div>
                <div class="progress-bar"><div id="progress"></div></div>
                <div id="miniGameVS" style="font-size:11px; margin-top:5px; color:#ccc;">수비수 VS 공격수</div>
            </div>
            <canvas id="gameCanvas" width="1000" height="500" tabindex="1"></canvas>
        </div>

        <div class="side-panel log-panel">
            <div class="panel-title">LOG</div>
            <div id="logContainer"></div>
            <div id="chatInputZone">
                <input type="text" id="directorChatMsg" placeholder="감독 공지 메시지 입력..." onkeydown="if(event.key==='Enter') sendDirectorChat()">
                <button onclick="sendDirectorChat()" style="padding: 4px 10px; font-size:12px;">전송</button>
            </div>
        </div>
    </div>
    
    <div id="ui">
        <div style="color: #3498db;"><span id="teamLabel1">TEAM BLUE</span>: <span id="score1">0</span></div>
        <div style="color: #e74c3c;"><span id="teamLabel2">TEAM RED</span>: <span id="score2">0</span></div>
    </div>

    <div id="globalDefenseLockUntilZone">
        <div id="cooldownTitle">⚠️ 디펜스 쿨타임 진행 중!</div>
        <div class="cooldown-progress-container"><div id="cooldownProgressFiller"></div></div>
    </div>

    <div id="mobileController">
        <div class="v-joystick-container" id="vJoystickContainer"><div class="v-joystick-stick" id="vJoystickStick"></div></div>
        <div class="v-buttons-grid">
            <div class="v-btn btn-action-grab" id="vBtnGrab">GRAB</div>
            <div class="v-btn btn-action-def" id="vBtnDef">DEF</div>
            <div class="v-btn" id="vBtnPass">PASS</div>
            <div class="v-btn" id="vBtnShoot">SHOOT</div>
        </div>
    </div>

<script>
const socket = io();
let targetRoomId = null;
let myProfileName = "";
let myProfilePassword = "";

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const cutIn = document.getElementById("cutIn");
const miniGameUI = document.getElementById("miniGameUI");
const progressBar = document.getElementById("progress");
const statusText = document.getElementById("statusText");
const pauseBtn = document.getElementById("pauseBtn");
const resetBtn = document.getElementById("resetBtn");
const logContainer = document.getElementById("logContainer");
const chatInputZone = document.getElementById("chatInputZone");

const maxBlueInput = document.getElementById("maxBlueInput");
const maxRedInput = document.getElementById("maxRedInput");

const globalDefenseLockUntilZone = document.getElementById("globalDefenseLockUntilZone");
const cooldownTitle = document.getElementById("cooldownTitle");
const cooldownProgressFiller = document.getElementById("cooldownProgressFiller");

let isReferee = false; 
let myDirectorName = ""; 

let scoreBlue = 0; let scoreRed = 0;
let teamBlueName = "TEAM BLUE"; let teamRedName = "TEAM RED";
let maxBluePlayers = 5; let maxRedPlayers = 5;

let gameState = "SETUP"; 
let miniGameGauge = 50; let miniGameTimer = 0;
let activeDefender = null; let activeAttacker = null;
let globalDefenseLockUntil = 0; 

let myControllingPlayer = null; 
let keys = {};
const registeredNames = new Set();

let mobileMoveX = 0; let mobileMoveY = 0;
let lastTime = performance.now();
let loopStarted = false;

const court = {
    width: canvas.width, height: canvas.height,
    leftGoal: { x: 50, y: 250, radius: 20 },
    rightGoal: { x: 950, y: 250, radius: 20 }
};

const onlineScheme = { up: 'w', down: 's', left: 'a', right: 'd', grab: 'e', pass: 'shift', shoot: ' ' };

// 🚪 방 인증 및 자동 로그인 연동 처리 함수
function submitRoomAuth(isAutoRefresh = false) {
    let rCode, uName, uPass;

    if (isAutoRefresh) {
        // 새로고침 시 세션 스토리지에서 즉시 복원
        rCode = sessionStorage.getItem("saved_room_id");
        uName = sessionStorage.getItem("saved_user_name");
        uPass = sessionStorage.getItem("saved_password");
    } else {
        // 수동 일반 접속 시 입력값 추출
        rCode = document.getElementById("roomCodeSelect").value;
        uName = document.getElementById("roomUserNameInput").value.trim();
        uPass = document.getElementById("roomUserPasswordInput").value.trim();

        if(!uName) { alert("유저 참관명을 입력해 주세요!"); return; }
        if(!uPass || uPass.length !== 4 || isNaN(uPass)) { alert("숫자 4자리의 비밀번호를 정확히 입력해 주세요!"); return; }
    }

    targetRoomId = rCode;
    myProfileName = uName;
    myProfilePassword = uPass;

    console.log("[클라이언트] 서버 세션 동기화 검증 통신 시작");
    socket.emit('joinRoom', { 
        roomId: targetRoomId, 
        userName: myProfileName, 
        password: myProfilePassword,
        isAutoRefresh: isAutoRefresh 
    });
}

// 🔄 브라우저 로드 시 새로고침 상태인지 체크하여 자동 로그인 실행
window.addEventListener("DOMContentLoaded", () => {
    const savedRoom = sessionStorage.getItem("saved_room_id");
    const savedName = sessionStorage.getItem("saved_user_name");
    const savedPass = sessionStorage.getItem("saved_password");

    if (savedRoom && savedName && savedPass) {
        console.log("[클라이언트] 새로고침 감지: 기존 세션 데이터로 자동 복구 시도");
        submitRoomAuth(true);
    }
});

// 인증 결과 리스너
socket.on('authResult', (res) => {
    if(!res.success) {
        // 자동 재접속 실패 시 스토리지 비우고 로그인 화면 노출
        if (res.isAutoRefresh) {
            sessionStorage.clear();
        } else {
            alert(res.message);
        }
        return;
    }

    // 로그인 통과 시 세션 저장소에 정보 보존 (새로고침 대응용)
    sessionStorage.setItem("saved_room_id", targetRoomId);
    sessionStorage.setItem("saved_user_name", myProfileName);
    sessionStorage.setItem("saved_password", myProfilePassword);

    // 가시성 전환
    document.getElementById("roomEntrance").style.display = "none";
    document.getElementById("lobby").style.display = "flex";
    document.getElementById("mainLayout").style.display = "flex";
    document.getElementById("ui").style.display = "flex";
    document.getElementById("roomInfoBadge").innerText = `🏠 경기 코드: ${targetRoomId} [${myProfileName}]`;
    
    if (window.matchMedia("(pointer: coarse)").matches) {
        document.getElementById("mobileController").classList.add("active");
        document.body.style.paddingBottom = "180px";
    }
    canvas.focus();
});

function requestFullScreen() {
    const docEl = document.documentElement;
    if (docEl.requestFullscreen) { docEl.requestFullscreen(); }
    else if (docEl.webkitRequestFullscreen) { docEl.webkitRequestFullscreen(); }
}

class Player {
    constructor(x, y, team, id, spawnIndex) {
        this.x = x; this.y = y; this.team = team; this.id = id; this.spawnIndex = spawnIndex;
        this.radius = 16; this.baseSpeed = 210;
        this.color = team === "BLUE" ? "#3498db" : "#e74c3c";
        this.ownerName = null; this.socketId = null;
        this.angle = team === "BLUE" ? 0 : Math.PI; this.skillLevel = 5.0;
    }

    draw() {
        if (gameState === "SETUP") {
            if (this.team === "BLUE" && this.id > maxBluePlayers) return;
            if (this.team === "RED" && this.id > maxRedPlayers) return;
        }
        const isMe = (myControllingPlayer && myControllingPlayer.team === this.team && myControllingPlayer.id === this.id);
        ctx.save();
        if (this.ownerName) {
            ctx.strokeStyle = "rgba(255, 242, 0, 0.75)"; ctx.lineWidth = 2.5; ctx.setLineDash([4, 4]);
            ctx.beginPath(); ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x + Math.cos(this.angle) * 45, this.y + Math.sin(this.angle) * 45);
            ctx.stroke();
        }
        ctx.restore();

        ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        if (isMe) { ctx.fillStyle = this.color; } else { ctx.fillStyle = this.team === "BLUE" ? "#1e547b" : "#8a2b21"; }
        ctx.fill();

        if (isMe) { ctx.lineWidth = 4.5; ctx.strokeStyle = "#f1c40f"; } 
        else { ctx.lineWidth = 2.0; ctx.strokeStyle = this.ownerName ? "#444444" : "#cccccc"; }
        ctx.stroke(); ctx.closePath();

        ctx.fillStyle = "#fff"; ctx.font = "bold 10px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(this.id, this.x, this.y);

        if (this.ownerName) {
            ctx.fillStyle = isMe ? "#fff" : "#bbbbbb"; ctx.font = isMe ? "bold 12px sans-serif" : "bold 11px sans-serif";
            ctx.fillText(`${this.ownerName} [${this.skillLevel.toFixed(1)}v]`, this.x, this.y - this.radius - 8);
        }

    move(dx, dy, dt) {
        this.x += dx * this.baseSpeed * dt; this.y += dy * this.baseSpeed * dt;
        this.x = Math.max(this.radius, Math.min(court.width - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(court.height - this.radius, this.y));
        if (dx !== 0 || dy !== 0) { this.angle = Math.atan2(dy, dx); }

const ball = {
    x: 500, y: 250, radius: 9, vx: 0, vy: 0, holder: null, isFlying: false, ignoreWalls: false, isChecking: false, lastShooterSkill: 5.0,
    draw() {
        ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = "#e67e22"; ctx.fill();
        ctx.lineWidth = 1; ctx.strokeStyle = "#000"; ctx.stroke(); ctx.closePath();
    },
    update(dt) {
        if (gameState !== "PLAYING") return;
        if (this.holder) {
            const dribbleY = Math.sin(Date.now() * 0.012) * 6;
            this.x = this.holder.x + Math.cos(this.holder.angle) * 14;
            this.y = this.holder.y + Math.sin(this.holder.angle) * 14 + dribbleY;
            this.ignoreWalls = false; this.isChecking = false;
        } else if (this.isFlying) {
            this.x += this.vx * dt * 60; this.y += this.vy * dt * 60;
            this.vx *= Math.pow(0.98, dt * 60); this.vy *= Math.pow(0.98, dt * 60);
            const distToRight = Math.hypot(this.x - court.rightGoal.x, this.y - court.rightGoal.y);
            const distToLeft = Math.hypot(this.x - court.leftGoal.x, this.y - court.leftGoal.y);

            if (distToRight < court.rightGoal.radius + 25 || distToLeft < court.leftGoal.radius + 25) { this.ignoreWalls = true; } 
            else { this.ignoreWalls = false; this.isChecking = false; }

            if (!this.isChecking) {
                if (distToRight < court.rightGoal.radius + 25) { this.isChecking = true; this.checkGoalProbability("BLUE"); }
                else if (distToLeft < court.leftGoal.radius + 25) { this.isChecking = true; this.checkGoalProbability("RED"); }
            }
            if (Math.abs(this.vx) < 0.3 && Math.abs(this.vy) < 0.3) { this.isFlying = false; this.ignoreWalls = false; this.isChecking = false; }
        }
        if (!this.ignoreWalls) {
            if (this.x < this.radius || this.x > court.width - this.radius) this.vx *= -1;
            if (this.y < this.radius || this.y > court.height - this.radius) this.vy *= -1;
        }
        this.x = Math.max(this.radius, Math.min(court.width - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(court.height - this.radius, this.y));
    },
    checkGoalProbability(scoringTeam) {
        const shooterLv = this.lastShooterSkill || 5.0;
        let successChance = 0.50;
        if (shooterLv >= 6.0 && shooterLv < 7.0) successChance = 0.60;
        else if (shooterLv >= 7.0 && shooterLv < 8.0) successChance = 0.70;
        else if (shooterLv >= 8.0 && shooterLv < 9.0) successChance = 0.80;
        else if (shooterLv >= 9.0) successChance = 0.90;

        if (Math.random() < successChance) {
            this.isFlying = false; this.ignoreWalls = false; this.isChecking = false;
            if (scoringTeam === "BLUE") { scoreBlue += 2; } else { scoreRed += 2; }
            document.getElementById("score1").innerText = scoreBlue;
            document.getElementById("score2").innerText = scoreRed;
            if (isReferee) { socket.emit("syncScore", { blue: scoreBlue, red: scoreRed, scoringTeam: scoringTeam }); }
            this.resetBall();
        } else {
            const randomAngle = Math.random() * Math.PI * 2; const bouncePower = 11 + Math.random() * 4;
            this.vx = Math.cos(randomAngle) * bouncePower; this.vy = Math.sin(randomAngle) * bouncePower;
            this.x += this.vx * 1.5; this.ignoreWalls = false;
            if (isReferee) {
                socket.emit("syncBallAction", { x: this.x, y: this.y, vx: this.vx, vy: this.vy, holderId: null, isFlying: true, lastShooterSkill: shooterLv });
            }
        }
    },
    resetBall() {
        this.x = 500; this.y = 250; this.vx = 0; this.vy = 0; this.holder = null; this.isFlying = false; this.ignoreWalls = false; this.isChecking = false; this.lastShooterSkill = 5.0;
        if (isReferee) { socket.emit("syncBallAction", { x: 500, y: 250, vx: 0, vy: 0, holderId: null, isFlying: false }); }
    }
};

function gameLoop(currentTime) {
    const dt = (currentTime - lastTime) / 1000; lastTime = currentTime;
    if (gameState === "PLAYING") {
        const now = Date.now();
        if (now < globalDefenseLockUntil) {
            globalDefenseLockUntilZone.style.display = "flex"; const timeLeft = globalDefenseLockUntil - now; const pct = (timeLeft / 5000) * 100;
            cooldownTitle.innerText = `⚠️ 디펜스 쿨타임 (${(timeLeft/1000).toFixed(1)}초)`; cooldownProgressFiller.style.width = `${pct}%`;
        } else { globalDefenseLockUntilZone.style.display = "none"; }
    } else { globalDefenseLockUntilZone.style.display = "none"; }

    if (gameState === "PLAYING") {
        if (myControllingPlayer) {
            let dx = 0; let dy = 0;
            if (keys[onlineScheme.up]) dy = -1; if (keys[onlineScheme.down]) dy = 1; if (keys[onlineScheme.left]) dx = -1; if (keys[onlineScheme.right]) dx = 1;
            if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }
            if (joystickActive) { dx = mobileMoveX; dy = mobileMoveY; }
            if (dx !== 0 || dy !== 0) {
                myControllingPlayer.move(dx, dy, dt);
                socket.emit("syncPlayerMove", { team: myControllingPlayer.team, id: myControllingPlayer.id, x: myControllingPlayer.x, y: myControllingPlayer.y, angle: myControllingPlayer.angle });
            }
        }
        ball.update(dt);
    }
    else if (gameState === "MINIGAME") {
        if (isReferee) {
            miniGameTimer -= dt;
            if (miniGameTimer <= 0) {
                let isDefWin = miniGameGauge < 50; if (Math.abs(miniGameGauge - 50) < 0.01) isDefWin = Math.random() < 0.5;
                gameState = "PLAYING";
                if (isDefWin) {
                    ball.holder = activeDefender;
                    socket.emit("syncEndMiniGame", { isDefWin: true, defTeam: activeDefender.team, defId: activeDefender.id, holderTeam: activeDefender.team, holderId: activeDefender.id });
                } else {
                    ball.holder = activeAttacker;
                    socket.emit("syncEndMiniGame", { isDefWin: false, attTeam: activeAttacker.team, attId: activeAttacker.id, holderTeam: activeAttacker.team, holderId: activeAttacker.id });
                }
            }
        }
    }
    ctx.clearRect(0, 0, canvas.width, canvas.height); drawCourt(); activePlayers.forEach(p => p.draw()); ball.draw();
    requestAnimationFrame(gameLoop);
}

function drawCourt() {
    ctx.fillStyle = "#27ae60"; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.lineWidth = 3; ctx.strokeStyle = "rgba(255,255,255,0.6)";

    ctx.strokeRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = "rgba(52, 152, 219, 0.2)"; ctx.fillRect(0, 100, 120, 300); ctx.strokeRect(0, 100, 120, 300);
    ctx.fillStyle = "rgba(231, 76, 60, 0.2)"; ctx.fillRect(880, 100, 120, 300); ctx.strokeRect(880, 100, 120, 300);
    ctx.lineWidth = 5; ctx.strokeStyle = "#3498db"; ctx.beginPath(); ctx.arc(court.leftGoal.x, court.leftGoal.y, court.leftGoal.radius, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = "#e74c3c"; ctx.beginPath(); ctx.arc(court.rightGoal.x, court.rightGoal.y, court.rightGoal.radius, 0, Math.PI * 2); ctx.stroke();

function startMiniGameUI(data) {
    gameState = "MINIGAME"; miniGameGauge = 50;
    activeDefender = activePlayers.find(p => p.team === data.defTeam && p.id === data.defId); activeAttacker = activePlayers.find(p => p.team === data.attTeam && p.id === data.attId);
    const defName = activeDefender?.ownerName || "수비수"; const attName = activeAttacker?.ownerName || "공격수";
    document.getElementById("miniGameVS").innerText = `🛡️ [수비] ${defName} VS 🎯 [공격] ${attName}`;
    progressBar.style.width = "50%"; miniGameUI.style.display = "block";
    cutIn.innerText = "디펜스 발동!!"; cutIn.classList.add("active"); setTimeout(() => { cutIn.classList.remove("active"); }, 900);
}

function endMiniGame(resultData) {
    gameState = "PLAYING"; miniGameUI.style.display = "none";
    if (resultData.holderId) { ball.holder = activePlayers.find(p => p.team === resultData.holderTeam && p.id === resultData.holderId); } else { ball.holder = null; }
    if (resultData.globalDefenseLockUntil) { globalDefenseLockUntil = resultData.globalDefenseLockUntil; }
    cutIn.innerText = resultData.isDefWin ? "스틸 성공!!" : "돌파 성공!!"; cutIn.classList.add("active"); setTimeout(() => { cutIn.classList.remove("active"); }, 900);
}

socket.on("onInitRoomState", (state) => {
    console.log("[클라이언트] 초기 정보 로드 성공 및 연동", state);
    
    scoreBlue = state.scoreBlue; scoreRed = state.scoreRed;
    document.getElementById("score1").innerText = scoreBlue; document.getElementById("score2").innerText = scoreRed;
    maxBluePlayers = state.maxBluePlayers; maxRedPlayers = state.maxRedPlayers;
    maxBlueInput.value = maxBluePlayers; maxRedInput.value = maxRedPlayers;
    teamBlueName = state.teamBlueName; teamRedName = state.teamRedName;
    document.getElementById("teamNameBlueInput").value = teamBlueName; document.getElementById("teamNameRedInput").value = teamRedName;
    document.getElementById("teamLabel1").innerText = teamBlueName; document.getElementById("teamLabel2").innerText = teamRedName;

    if (state.globalDefenseLockUntil) { globalDefenseLockUntil = state.globalDefenseLockUntil; }
    
    buildActivePlayersPool(true);

    if (state.registeredOwners && Array.isArray(state.registeredOwners)) {
        state.registeredOwners.forEach(data => {
            const p = activePlayers.find(o => o.team === data.team && o.id === data.id);
            if (p) {
                p.ownerName = data.ownerName; p.socketId = data.socketId; p.skillLevel = data.skillLevel;
                if (data.x !== undefined) p.x = data.x;
                if (data.y !== undefined) p.y = data.y;
                if (data.angle !== undefined) p.angle = data.angle;
                registeredNames.add(data.ownerName);
            }
        });
    }

    // 나의 슬롯 연동 재확인
    const findMySlot = activePlayers.find(p => p.ownerName === myProfileName);
    if (findMySlot) { myControllingPlayer = findMySlot; }

    updateAdminDropdown();
    logContainer.innerHTML = ""; if (state.logs) state.logs.forEach(log => appendLogToUI(log));

    if (state.directorName) {
        if (state.directorToken === "DIR_TOKEN_" + myProfileName) {
            isReferee = true; myDirectorName = state.directorName;
            document.getElementById("directorTitleLabel").innerText = `[감독관: ${myDirectorName}]`;
            document.getElementById("adminSkillZone").style.display = "flex"; document.getElementById("refereeZone").style.display = "none";
            chatInputZone.style.display = "flex"; document.getElementById("teamNameBlueInput").disabled = false; document.getElementById("teamNameRedInput").disabled = false;
            socket.emit("syncRegisterDirector", { name: myDirectorName, token: "DIR_TOKEN_" + myProfileName });
        } else { document.getElementById("statusText").innerText = `[관전자 모드] 감독 ${state.directorName}님이 방을 관리 중입니다.`; }
    } else {
        isReferee = false; myDirectorName = ""; document.getElementById("refereeZone").style.display = "flex";
        document.getElementById("adminSkillZone").style.display = "none"; chatInputZone.style.display = "none";
    }
    
    gameState = state.gameState; toggleUIVisibility();
    
    if(!loopStarted) {
        lastTime = performance.now(); gameLoop(lastTime); loopStarted = true;
    }
});

socket.on("onPlayerMove", (data) => { const p = activePlayers.find(o => o.team === data.team && o.id === data.id); if (p) { p.x = data.x; p.y = data.y; p.angle = data.angle; } });
socket.on("onBallAction", (data) => {
    ball.x = data.x; ball.y = data.y; ball.vx = data.vx; ball.vy = data.vy; ball.isFlying = data.isFlying; ball.lastShooterSkill = data.lastShooterSkill || 5.0;
    if (data.holderId) { ball.holder = activePlayers.find(p => p.team === data.holderTeam && p.id === data.holderId); } else { ball.holder = null; }
});
socket.on("onMatchCapacityChange", (data) => { maxBluePlayers = data.blueMax; maxRedPlayers = data.redMax; maxBlueInput.value = maxBluePlayers; maxRedInput.value = data.redMax; buildActivePlayersPool(true); });
socket.on("onRegisterOwner", (data) => {
    const p = activePlayers.find(o => o.team === data.team && o.id === data.id);
    if (p) {
        if (p.ownerName) registeredNames.delete(p.ownerName);
        if (data.ownerName === "") { p.ownerName = null; p.socketId = null; p.skillLevel = 5.0; } 
        else {
            p.ownerName = data.ownerName; p.socketId = data.socketId || null; registeredNames.add(data.ownerName);
            if (data.ownerName === myProfileName) { myControllingPlayer = p; }
        }
    }
    updateAdminDropdown();
});
socket.on("onUpdateSkillLevel", (data) => { const p = activePlayers.find(o => o.team === data.team && o.id === data.id); if (p) { p.skillLevel = data.skillLevel; } loadTargetSkillLevel(); });
socket.on("onLiveTeamName", (data) => {
    if (data.team === "BLUE") { teamBlueName = data.name; document.getElementById("teamNameBlueInput").value = data.name; document.getElementById("teamLabel1").innerText = data.name; } 
    else { teamRedName = data.name; document.getElementById("teamNameRedInput").value = data.name; document.getElementById("teamLabel2").innerText = data.name; }
});
socket.on("onRegisterDirector", (data) => {
    if (!data.directorName) {
        isReferee = false; myDirectorName = ""; document.getElementById("refereeZone").style.display = "flex";
        document.getElementById("adminSkillZone").style.display = "none"; chatInputZone.style.display = "none";
        document.getElementById("teamNameBlueInput").disabled = true; document.getElementById("teamNameRedInput").disabled = true;
        toggleUIVisibility(); return;
    }
    if (data.directorToken === "DIR_TOKEN_" + myProfileName) {
        isReferee = true; myDirectorName = data.directorName; document.getElementById("directorTitleLabel").innerText = `[감독관: ${myDirectorName}]`;
        document.getElementById("adminSkillZone").style.display = "flex"; document.getElementById("refereeZone").style.display = "none"; chatInputZone.style.display = "flex";
        document.getElementById("teamNameBlueInput").disabled = false; document.getElementById("teamNameRedInput").disabled = false;
    } else { document.getElementById("statusText").innerText = `[관전자 모드] 감독 ${data.directorName}님이 방을 관리 중입니다.`; }
    toggleUIVisibility();
});
socket.on("onClearLogs", () => { logContainer.innerHTML = ""; });
socket.on("onStartGame", (data) => { gameState = "PLAYING"; teamBlueName = data.teamBlueName; teamRedName = data.teamRedName; maxBluePlayers = data.maxBluePlayers; maxRedPlayers = data.maxRedPlayers; globalDefenseLockUntil = 0; buildActivePlayersPool(true); toggleUIVisibility(); });
socket.on("onGameStateChange", (data) => { gameState = data.state; toggleUIVisibility(); });
socket.on("onResetMatch", () => {
    gameState = "SETUP"; scoreBlue = 0; scoreRed = 0; document.getElementById("score1").innerText = 0; document.getElementById("score2").innerText = 0;
    myControllingPlayer = null; isReferee = false; myDirectorName = ""; globalDefenseLockUntil = 0; registeredNames.clear();
    buildActivePlayersPool(false); ball.resetBall();
    document.getElementById("refName").value = ""; document.getElementById("refKey").value = "";
    document.getElementById("refereeZone").style.display = "flex"; document.getElementById("adminSkillZone").style.display = "none"; chatInputZone.style.display = "none";
    document.getElementById("teamNameBlueInput").disabled = true; document.getElementById("teamNameRedInput").disabled = true;
    toggleUIVisibility();
});
socket.on("onScoreUpdate", (data) => { scoreBlue = data.blue; scoreRed = data.red; document.getElementById("score1").innerText = scoreBlue; document.getElementById("score2").innerText = scoreRed; });
socket.on("onStartMiniGame", (data) => { startMiniGameUI(data); });
socket.on("onMiniGameGauge", (gauge) => { miniGameGauge = gauge; progressBar.style.width = `${miniGameGauge}%`; });
socket.on("onEndMiniGame", (resultData) => { endMiniGame(resultData); });
socket.on("onNewLog", (logEntry) => { appendLogToUI(logEntry); });

function toggleUIVisibility() {
    const inputsDisabled = (gameState !== "SETUP" || !isReferee); maxBlueInput.disabled = inputsDisabled; maxRedInput.disabled = inputsDisabled;
    if (gameState === "PLAYING" || gameState === "MINIGAME" || gameState === "PAUSE") {
        document.getElementById("startBtn").disabled = true; pauseBtn.disabled = !isReferee; resetBtn.disabled = !isReferee;
        if (gameState === "PAUSE") { statusText.innerText = "[일시정지] 경기가 멈췄습니다."; statusText.style.color = "#e74c3c"; pauseBtn.innerText = "RESUME"; } 
        else { statusText.innerText = "[경기 중] 매치 진행 중!"; statusText.style.color = "#2ecc71"; pauseBtn.innerText = "PAUSE"; }
    } else {
        statusText.innerText = isReferee ? "[대기 모드] 팀별 매치 인원을 설정하고 경기를 시작하세요." : "[관전자 모드] 감독 코드를 입력하세요.";
        statusText.style.color = "#f1c40f"; document.getElementById("startBtn").disabled = !isReferee; pauseBtn.disabled = true; resetBtn.disabled = !isReferee; pauseBtn.innerText = "PAUSE";
    }
}
</script>
</body>
</html>
