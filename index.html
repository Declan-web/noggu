<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다들 모여! - 통합 완결 버전</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin: 0; background-color: #222; color: #fff; font-family: 'Arial', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #lobby { margin-bottom: 15px; display: flex; gap: 12px; align-items: center; background: #333; padding: 10px 20px; border-radius: 8px; border: 1px solid #555; z-index: 20; }
        canvas { background-color: #d35400; border: 4px solid #fff; display: block; border-radius: 4px; outline: none; }
        #mainLayout { display: flex; gap: 20px; align-items: flex-start; justify-content: center; width: 100%; max-width: 1780px; padding: 0 20px; }
        .side-panel { width: 240px; height: 508px; background-color: #555; border-radius: 12px; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        #logContainer { font-size: 14px; line-height: 1.5; color: #ecf0f1; }
        input, button { padding: 6px 10px; border-radius: 4px; border: 1px solid #777; background: #444; color: #fff; }
        button { cursor: pointer; background: #27ae60; border: none; font-weight: bold; }
        button:disabled { background: #7f8c8d; cursor: not-allowed; }
        #startBtn { background: #2980b9; }
        #pauseBtn { background: #e67e22; }
    </style>
</head>
<body>

    <div id="lobby">
        <div id="refereeZone">
            <input type="text" id="refName" placeholder="감독명">
            <input type="password" id="refKey" placeholder="코드">
            <button onclick="authReferee()">감독 임명</button>
        </div>
        <button id="startBtn" onclick="startGame()">GAME START</button>
        <button id="pauseBtn" onclick="togglePause()">PAUSE</button>
        <span id="statusText" style="color: #f1c40f;">대기 중 (관전자 모드)</span>
    </div>
    
    <div id="mainLayout">
        <div class="side-panel">
            <h3>조작 가이드</h3>
            <p><b>W, A, S, D</b>: 이동</p>
            <p><b>E</b>: 공 줍기</p>
            <p><b>Shift</b>: 패스</p>
            <p><b>Space</b>: 슛</p>
            <p><b>마우스 좌클릭</b>: 수비</p>
        </div>
        <canvas id="gameCanvas" width="1000" height="500"></canvas>
        <div class="side-panel" id="logContainer">
            <h3>게임 로그</h3>
            <div id="logMessages"></div>
        </div>
    </div>

<script>
const socket = io();
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const logMessages = document.getElementById("logMessages");

// 전역 게임 상태 변수
let myControllingPlayer = null;
let keys = {};
let ball = { x: 500, y: 250, holder: null, isFlying: false };
let activePlayers = [];
let gameState = "SETUP";

// 로그 기록 함수
function addLog(message) {
    const p = document.createElement("p");
    p.textContent = message;
    p.style.margin = "4px 0";
    logMessages.appendChild(p);
    document.getElementById("logContainer").scrollTop = document.getElementById("logContainer").scrollHeight;
}

// [핵심] 공 줍기 판정 (범위 50px로 넉넉하게 확장)
function checkManualBallGrab(player) {
    if (ball.holder || ball.isFlying) return;
    const dist = Math.hypot(ball.x - player.x, ball.y - player.y);
    if (dist < 50) { 
        ball.holder = player;
        socket.emit("syncBallAction", { 
            x: ball.x, 
            y: ball.y, 
            vx: 0, 
            vy: 0, 
            holderId: { team: player.team, id: player.id }, 
            isFlying: false 
        });
        addLog(`[시스템] 공 획득: ${player.team}팀 ${player.id}번`);
    }
}

// 슛 액션
function shootAction(player) {
    if (!ball.holder || ball.holder.id !== player.id || ball.holder.team !== player.team) return;
    ball.holder = null;
    ball.isFlying = true;
    socket.emit("syncBallAction", {
        x: ball.x,
        y: ball.y,
        vx: player.team === "BLUE" ? 15 : -15,
        vy: 0,
        holderId: null,
        isFlying: true
    });
    addLog(`[시스템] 슛 시도: ${player.team}팀 ${player.id}번`);
}

// 패스 액션
function passAction(player) {
    if (!ball.holder || ball.holder.id !== player.id || ball.holder.team !== player.team) return;
    ball.holder = null;
    ball.isFlying = true;
    socket.emit("syncBallAction", {
        x: ball.x,
        y: ball.y,
        vx: player.team === "BLUE" ? 10 : -10,
        vy: 0,
        holderId: null,
        isFlying: true
    });
    addLog(`[시스템] 패스 시도: ${player.team}팀 ${player.id}번`);
}

// 수비 판정 트리거
function checkDefenseTrigger(player) {
    socket.emit("defenseTrigger", { team: player.team, id: player.id });
}

// 감독 권한 인증
function authReferee() {
    const name = document.getElementById("refName").value;
    const key = document.getElementById("refKey").value;
    if (name && key) {
        socket.emit("authReferee", { name, key });
    }
}

// 게임 시작 및 일시정지 요청
function startGame() {
    socket.emit("requestStartGame");
}

function togglePause() {
    socket.emit("requestTogglePause");
}

// 키보드 리스너 등록 (입력 유실 방지하기 위해 window 객체에 바인딩)
window.addEventListener("keydown", e => {
    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
    
    const key = e.key.toLowerCase();
    keys[key] = true;
    
    // 즉시 반응해야 하는 일회성 이벤트 처리
    if (myControllingPlayer) {
        if (key === 'e') checkManualBallGrab(myControllingPlayer);
        if (key === ' ') shootAction(myControllingPlayer);
        if (key === 'shift') passAction(myControllingPlayer);
    }
    
    if ([" ", "shift", "w", "a", "s", "d"].includes(key)) e.preventDefault();
});

window.addEventListener("keyup", e => { 
    keys[e.key.toLowerCase()] = false; 
});

// 마우스 다운 이벤트 (포커스 잃음 방지 및 수비동작 연동)
window.addEventListener("mousedown", e => {
    canvas.focus();
    if (e.button === 0 && gameState === "PLAYING" && myControllingPlayer) {
        checkDefenseTrigger(myControllingPlayer);
    }
});

// [핵심] 캐릭터 이동 및 실시간 서버 좌표 전송 로직
function update() {
    if (gameState !== "PLAYING" || !myControllingPlayer) return;
    
    let moved = false;
    const moveSpeed = 4;

    if (keys['w']) { myControllingPlayer.y -= moveSpeed; moved = true; }
    if (keys['s']) { myControllingPlayer.y += moveSpeed; moved = true; }
    if (keys['a']) { myControllingPlayer.x -= moveSpeed; moved = true; }
    if (keys['d']) { myControllingPlayer.x += moveSpeed; moved = true; }

    // 맵 경계 제한 (캔버스 밖으로 이탈 방지)
    if (myControllingPlayer.x < 15) myControllingPlayer.x = 15;
    if (myControllingPlayer.x > canvas.width - 15) myControllingPlayer.x = canvas.width - 15;
    if (myControllingPlayer.y < 15) myControllingPlayer.y = 15;
    if (myControllingPlayer.y > canvas.height - 15) myControllingPlayer.y = canvas.height - 15;

    // 조작 중인 캐릭터의 위치가 변했다면 서버로 무조건 즉시 브로드캐스팅 발송
    if (moved) {
        socket.emit("syncPlayerMovement", {
            id: myControllingPlayer.id,
            team: myControllingPlayer.team,
            x: myControllingPlayer.x,
            y: myControllingPlayer.y
        });
    }

    // 공을 들고 있는 경우 공의 포지션을 캐릭터와 일치시킴
    if (ball.holder && ball.holder.id === myControllingPlayer.id && ball.holder.team === myControllingPlayer.team) {
        ball.x = myControllingPlayer.x;
        ball.y = myControllingPlayer.y;
    }
}

// 화면 렌더링 로직
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 중앙선 및 골대 그리기
    ctx.strokeStyle = "rgba(255,255,255,0.6)";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 0);
    ctx.lineTo(canvas.width / 2, canvas.height);
    ctx.stroke();

    // 모든 플레이어 순회하며 그리기
    activePlayers.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 15, 0, Math.PI * 2);
        ctx.fillStyle = p.team === "BLUE" ? "#3498db" : "#e74c3c";
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // 조작 중인 플레이어에게 하이라이트 표시
        if (myControllingPlayer && myControllingPlayer.id === p.id && myControllingPlayer.team === p.team) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 22, 0, Math.PI * 2);
            ctx.strokeStyle = "#f1c40f";
            ctx.lineWidth = 2;
            ctx.stroke();
        }
    });
    
    // 공 그리기
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, 10, 0, Math.PI * 2);
    ctx.fillStyle = "#f39c12";
    ctx.fill();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.stroke();
}

// 메인 게임 루프 정의
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// [서버 소켓 이벤트 리스너]
socket.on("initControlPlayer", (data) => {
    myControllingPlayer = data;
    document.getElementById("statusText").textContent = `${data.team}팀 ${data.id}번 선수로 참여 중`;
    document.getElementById("statusText").style.color = data.team === "BLUE" ? "#3498db" : "#e74c3c";
    addLog(`[시스템] 게임에 참여했습니다: ${data.team}팀 ${data.id}번`);
});

socket.on("syncGameState", (data) => {
    gameState = data.state;
    activePlayers = data.players;
    
    if (gameState === "PLAYING") {
        document.getElementById("statusText").textContent = "경기 진행 중";
        document.getElementById("statusText").style.color = "#2ecc71";
    } else if (gameState === "PAUSED") {
        document.getElementById("statusText").textContent = "일시 정지됨";
        document.getElementById("statusText").style.color = "#e67e22";
    }
});

socket.on("onBallAction", (data) => {
    ball.x = data.x;
    ball.y = data.y;
    ball.isFlying = data.isFlying;
    ball.holder = data.holderId ? activePlayers.find(p => p.team === data.holderId.team && p.id === data.holderId.id) : null;
});

socket.on("logNotification", (message) => {
    addLog(message);
});

// 시스템 시작
gameLoop();
</script>
</body>
</html>
