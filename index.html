<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다들 모여!</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        
        #lobby {
            margin-bottom: 15px;
            display: flex;
            gap: 12px;
            align-items: center;
            background: #333;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #555;
            flex-wrap: wrap;
            z-index: 20;
        }
        select, button, input {
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            border: none;
        }
        input[type="password"] {
            background-color: #444;
            color: #fff;
            border: 1px solid #666;
            width: 80px;
            text-align: center;
        }
        input[type="text"] {
            background-color: #444;
            color: #fff;
            border: 1px solid #666;
            width: 100px;
        }
        input[type="number"] {
            background-color: #444;
            color: #fff;
            border: 1px solid #666;
            width: 45px;
            text-align: center;
        }
        select {
            background-color: #444;
            color: #fff;
            border: 1px solid #666;
        }
        button {
            background-color: #f39c12;
            color: #fff;
            cursor: pointer;
        }
        button:hover {
            background-color: #d35400;
        }
        button:disabled, select:disabled, input:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
        }

        #mainLayout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            justify-content: center;
            width: 100%;
            max-width: 1780px; 
            padding: 0 20px;
            box-sizing: border-box;
        }

        .side-panel {
            width: 240px;
            height: 508px; 
            background-color: #555555;
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .side-panel.log-panel {
            width: 480px; 
        }

        .panel-title {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 1px;
            border-bottom: 2px solid #666;
            padding-bottom: 10px;
        }

        #keyGuideList {
            display: flex;
            flex-direction: column;
            gap: 15px;
            font-size: 14px;
            line-height: 1.6;
        }
        .key-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }
        .key-val {
            color: #f1c40f;
            font-weight: bold;
        }

        #logContainer {
            flex: 1;
            overflow-y: auto;
            background: #444;
            border-radius: 6px;
            padding: 12px;
            font-size: 15px; 
            display: flex;
            flex-direction: column;
            gap: 10px;
            word-break: break-all;
        }
        
        .log-item {
            border-bottom: 1px solid #555;
            padding-bottom: 6px;
            line-height: 1.5;
        }
        .log-time { color: #aaa; margin-right: 6px; font-size: 12px; }
        .log-type-score { color: #2ecc71; font-weight: bold; }
        .log-type-defense { color: #e67e22; font-weight: bold; }
        .log-type-chat { color: #f1c40f; font-weight: bold; background: rgba(241, 196, 15, 0.1); border-radius: 2px; padding: 2px 4px; }

        #chatInputZone {
            margin-top: 10px;
            display: none; 
            gap: 5px;
        }
        #directorChatMsg {
            flex: 1;
            background: #333;
            color: #fff;
            border: 1px solid #666;
            padding: 6px;
            font-size: 13px;
            border-radius: 4px;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 0 25px rgba(0,0,0,0.7);
        }
        canvas {
            background-color: #d35400;
            border: 4px solid #fff;
            display: block;
            border-radius: 4px;
        }
        #cutIn {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 70px;
            font-weight: 900;
            color: #e74c3c;
            text-shadow: -4px -4px 0 #fff, 4px -4px 0 #fff, -4px 4px 0 #fff, 4px 4px 0 #fff, 0px 8px 10px rgba(0,0,0,0.5);
            font-style: italic;
            pointer-events: none;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }
        #cutIn.active {
            transform: translate(-50%, -50%) scale(1);
        }
        #miniGameUI {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 15px 25px;
            border-radius: 10px;
            border: 2px solid #fff;
            text-align: center;
            display: none;
            z-index: 5;
        }
        .progress-bar {
            width: 300px;
            height: 25px;
            background-color: #555;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
            border: 1px solid #fff;
        }
        #progress {
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, #3498db, #e74c3c);
        }
        #ui {
            margin-top: 15px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            gap: 60px;
            justify-content: center;
            width: 100%;
        }
        #adminSkillZone {
            display: none;
            align-items: center;
            gap: 5px;
            background: #444;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #666;
        }
        #pauseBtn { background-color: #34495e; color: #fff; }
        #pauseBtn:hover { background-color: #2c3e50; }
        #resetBtn { background-color: #c0392b; color: #fff; }
        #resetBtn:hover { background-color: #962d22; }
        #clearLogBtn { background-color: #7f8c8d; color: #fff; margin-left: 5px; }
        #clearLogBtn:hover { background-color: #95a5a6; }
        
        .capacity-zone {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #444;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #666;
            font-size: 13px;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="lobby">
        <div id="refereeZone" style="display: flex; gap: 8px; align-items: center;">
            <label for="refName">감독 이름: </label>
            <input type="text" id="refName" placeholder="감독명 입력" style="width: 90px;">
            <label for="refKey">코드: </label>
            <input type="password" id="refKey" placeholder="코드">
            <button onclick="authReferee()" id="authBtn">감독 임명</button>
        </div>
        
        <div id="adminSkillZone">
            <label id="directorTitleLabel" style="color: #f1c40f; margin-right: 5px; font-weight: bold;"></label>
            <label>경기력 관리:</label>
            <select id="adminTargetPlayer" onchange="loadTargetSkillLevel()"></select>
            <input type="number" id="adminSkillInput" min="5.0" max="9.9" step="0.1" value="5.0">
            <button onclick="updatePlayerSkill()">적용</button>
            <button id="clearLogBtn" onclick="clearLogsFromServer()">로그 초기화</button>
        </div>

        <span style="color:#555;">|</span>

        <label>팀명 세팅: </label>
        <input type="text" id="teamNameBlueInput" value="TEAM BLUE" placeholder="블루팀명" oninput="sendLiveTeamName('BLUE')" disabled>
        <input type="text" id="teamNameRedInput" value="TEAM RED" placeholder="레드팀명" oninput="sendLiveTeamName('RED')" disabled>

        <div class="capacity-zone">
            <span style="color: #3498db; font-weight: bold;">BLUE</span>
            <input type="number" id="maxBlueInput" min="1" max="5" value="5" onchange="sendMatchCapacity()" disabled>
            <span style="font-weight: bold; color: #aaa;">VS</span>
            <input type="number" id="maxRedInput" min="1" max="5" value="5" onchange="sendMatchCapacity()" disabled>
            <span style="color: #e74c3c; font-weight: bold;">RED</span>
        </div>

        <button id="startBtn" onclick="startGame()" disabled>[시작] GAME START</button>
        <button id="pauseBtn" onclick="togglePause()" disabled>[정지] PAUSE</button>
        <button id="resetBtn" onclick="triggerManualReset()" disabled>[초기화] RESET MATCH</button>
        <span id="statusText" style="color: #f1c40f; margin-left: 5px;">[관전자 모드] 코드를 입력하세요.</span>
    </div>
    
    <div id="mainLayout">
        <div class="side-panel">
            <div class="panel-title">조작키</div>
            <div id="keyGuideList">
                <div class="key-row"><span>상하좌우 이동</span><span class="key-val">W, A, S, D</span></div>
                <div class="key-row"><span>공 줍기</span><span class="key-val">E</span></div>
                <div class="key-row"><span>패스</span><span class="key-val">Shift</span></div>
                <div class="key-row"><span>슛</span><span class="key-val">Space</span></div>
                <div class="key-row"><span>디펜스 시도</span><span class="key-val">좌클릭</span></div>
                <div class="key-row"><span>디펜스 미니게임</span><span class="key-val">우클릭</span></div>
            </div>
        </div>

        <div id="gameContainer">
            <div id="cutIn">디펜스!!</div>
            <div id="miniGameUI">
                <div id="miniGameTitle" style="font-weight:bold; font-size:16px;">🔥 마우스 우클릭을 연타하세요! 🔥</div>
                <div class="progress-bar">
                    <div id="progress"></div>
                </div>
                <div id="miniGameVS" style="font-size:12px; margin-top:5px; color:#ccc;">수비수 VS 공격수</div>
            </div>
            <canvas id="gameCanvas" width="1000" height="500"></canvas>
        </div>

        <div class="side-panel log-panel">
            <div class="panel-title">LOG</div>
            <div id="logContainer"></div>
            <div id="chatInputZone">
                <input type="text" id="directorChatMsg" placeholder="감독 공지 메시지 입력..." onkeydown="if(event.key==='Enter') sendDirectorChat()">
                <button onclick="sendDirectorChat()" style="padding: 4px 10px; font-size:12px;">전송</button>
            </div>
        </div>
    </div>
    
    <div id="ui">
        <div style="color: #3498db;"><span id="teamLabel1">TEAM BLUE</span>: <span id="score1">0</span></div>
        <div style="color: #e74c3c;"><span id="teamLabel2">TEAM RED</span>: <span id="score2">0</span></div>
    </div>

<script>
const socket = io();

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const cutIn = document.getElementById("cutIn");
const miniGameUI = document.getElementById("miniGameUI");
const progressBar = document.getElementById("progress");
const statusText = document.getElementById("statusText");
const pauseBtn = document.getElementById("pauseBtn");
const resetBtn = document.getElementById("resetBtn");
const logContainer = document.getElementById("logContainer");
const chatInputZone = document.getElementById("chatInputZone");

const maxBlueInput = document.getElementById("maxBlueInput");
const maxRedInput = document.getElementById("maxRedInput");

let isReferee = false; 
let myDirectorName = ""; 

let scoreBlue = 0;
let scoreRed = 0;
let teamBlueName = "TEAM BLUE";
let teamRedName = "TEAM RED";

// 설정 인원 한도 변수 (기본값 5 vs 5)
let maxBluePlayers = 5;
let maxRedPlayers = 5;

let gameState = "SETUP"; 
let miniGameGauge = 50;    
let miniGameTimer = 0;
let activeDefender = null;
let activeAttacker = null;

let defenseLockUntil = 0;

let myControllingPlayer = null; 
let keys = {}; 
const registeredNames = new Set();

let lastTime = performance.now();

const court = {
    width: canvas.width,
    height: canvas.height,
    leftGoal: { x: 50, y: 250, radius: 20 },
    rightGoal: { x: 950, y: 250, radius: 20 }
};

const onlineScheme = { 
    up: 'w', 
    down: 's', 
    left: 'a', 
    right: 'd', 
    grab: 'e', 
    pass: 'shift', 
    shoot: ' ' 
};

class Player {
    constructor(x, y, team, id, spawnIndex) {
        this.x = x;
        this.y = y;
        this.team = team; 
        this.id = id;
        this.spawnIndex = spawnIndex;
        this.radius = 16;
        
        this.baseSpeed = 210; 
        this.color = team === "BLUE" ? "#3498db" : "#e74c3c";
        
        this.ownerName = null;     
        this.socketId = null; 
        this.angle = team === "BLUE" ? 0 : Math.PI; 

        this.lastDefenseTime = 0; 
        this.defenseCooldown = 3000; 
        this.skillLevel = 5.0;
    }

    draw() {
        // 지정된 칸 범위를 초과하는 플레이어는 대기 상태(SETUP) 화면에 그리지 않습니다.
        if (gameState === "SETUP") {
            if (this.team === "BLUE" && this.id > maxBluePlayers) return;
            if (this.team === "RED" && this.id > maxRedPlayers) return;
        }

        const now = Date.now();
        const timePassed = now - this.lastDefenseTime;
        const isCooling = timePassed < this.defenseCooldown;

        const isMe = (myControllingPlayer && myControllingPlayer.team === this.team && myControllingPlayer.id === this.id);

        ctx.save();
        if (this.ownerName) {
            ctx.strokeStyle = isCooling ? "rgba(180, 180, 180, 0.4)" : "rgba(255, 242, 0, 0.75)";
            ctx.lineWidth = 2.5;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x + Math.cos(this.angle) * 45, this.y + Math.sin(this.angle) * 45);
            ctx.stroke();
        }
        ctx.restore();

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);

        if (isMe) {
            ctx.fillStyle = this.color; 
        } else {
            ctx.fillStyle = this.team === "BLUE" ? "#1e547b" : "#8a2b21";
        }
        ctx.fill();

        if (isMe) {
            ctx.lineWidth = 4.5;
            ctx.strokeStyle = "#f1c40f"; 
        } else {
            ctx.lineWidth = 2.0;
            ctx.strokeStyle = this.ownerName ? "#444444" : "#cccccc"; 
        }
        ctx.stroke();
        ctx.closePath();

        ctx.fillStyle = "#fff";
        ctx.font = "bold 10px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(this.id, this.x, this.y);

        if (this.ownerName) {
            ctx.fillStyle = isMe ? "#fff" : "#bbbbbb";
            ctx.font = isMe ? "bold 12px sans-serif" : "bold 11px sans-serif";
            ctx.fillText(`${this.ownerName} [${this.skillLevel.toFixed(1)}v]`, this.x, this.y - this.radius - 8);

            if (isCooling && gameState !== "PAUSE") {
                const remaining = Math.ceil((this.defenseCooldown - timePassed) / 1000);
                ctx.fillStyle = "#ff4d4d";
                ctx.font = "9px sans-serif";
                ctx.fillText(`${remaining}s`, this.x, this.y + this.radius + 12);
            }
        }
    }

    move(dx, dy, dt) {
        this.x += dx * this.baseSpeed * dt;
        this.y += dy * this.baseSpeed * dt;
        this.x = Math.max(this.radius, Math.min(court.width - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(court.height - this.radius, this.y));

        if (dx !== 0 || dy !== 0) {
            this.angle = Math.atan2(dy, dx);
        }
    }

    updateAI(dt) {
        if (gameState !== "PLAYING" || this.ownerName) return;

        let dx = 0, dy = 0;
        if (ball.holder === this) {
            this.angle = this.team === "BLUE" ? 0 : Math.PI;
            const targetGoal = this.team === "BLUE" ? court.rightGoal : court.leftGoal;
            const distToGoal = Math.hypot(targetGoal.x - this.x, targetGoal.y - this.y);
            if (distToGoal > 160) {
                dx = targetGoal.x - this.x;
                dy = targetGoal.y - this.y;
            } else if (Math.random() < 0.02) {
                shootAction(this);
            }
        } else {
            if (!ball.holder) {
                dx = ball.x - this.x;
                dy = ball.y - this.y;
            }
        }

        if (dx !== 0 || dy !== 0) {
            const length = Math.hypot(dx, dy);
            this.move(dx / length, dy / length, dt);
            
            if (!ball.holder && !ball.isFlying && Math.hypot(ball.x - this.x, ball.y - this.y) < this.radius + ball.radius + 2) {
                ball.holder = this;
                socket.emit("syncBallAction", { x: ball.x, y: ball.y, vx: 0, vy: 0, holderId: { team: this.team, id: this.id }, isFlying: false });
            }
        }
    }
}

const ball = {
    x: 500,
    y: 250,
    radius: 9,
    vx: 0,
    vy: 0,
    holder: null,
    isFlying: false,
    ignoreWalls: false, 
    isChecking: false, 
    lastShooterSkill: 5.0,

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#e67e22";
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = "#000";
        ctx.stroke();
        ctx.closePath();
    },

    update(dt) {
        if (gameState !== "PLAYING") return;

        if (this.holder) {
            const dribbleY = Math.sin(Date.now() * 0.012) * 6;
            this.x = this.holder.x + Math.cos(this.holder.angle) * 14;
            this.y = this.holder.y + Math.sin(this.holder.angle) * 14 + dribbleY;
            this.ignoreWalls = false;
            this.isChecking = false;
        } else if (this.isFlying) {
            this.x += this.vx * dt * 60;
            this.y += this.vy * dt * 60;
            this.vx *= Math.pow(0.98, dt * 60);
            this.vy *= Math.pow(0.98, dt * 60);

            const distToRight = Math.hypot(this.x - court.rightGoal.x, this.y - court.rightGoal.y);
            const distToLeft = Math.hypot(this.x - court.leftGoal.x, this.y - court.leftGoal.y);

            if (distToRight < court.rightGoal.radius + 25 || distToLeft < court.leftGoal.radius + 25) {
                this.ignoreWalls = true; 
            } else {
                this.ignoreWalls = false;
                this.isChecking = false; 
            }

            if (!this.isChecking) {
                if (distToRight < court.rightGoal.radius + 25) {
                    this.isChecking = true;
                    this.checkGoalProbability("BLUE"); 
                }
                else if (distToLeft < court.leftGoal.radius + 25) {
                    this.isChecking = true;
                    this.checkGoalProbability("RED"); 
                }
            }

            if (Math.abs(this.vx) < 0.3 && Math.abs(this.vy) < 0.3) {
                this.isFlying = false;
                this.ignoreWalls = false;
                this.isChecking = false;
            }
        }

        if (!this.ignoreWalls) {
            if (this.x < this.radius || this.x > court.width - this.radius) this.vx *= -1;
            if (this.y < this.radius || this.y > court.height - this.radius) this.vy *= -1;
        }
        this.x = Math.max(this.radius, Math.min(court.width - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(court.height - this.radius, this.y));
    },

    checkGoalProbability(scoringTeam) {
        const shooterLv = this.lastShooterSkill || 5.0;
        let successChance = 0.50; 

        if (shooterLv >= 6.0 && shooterLv < 7.0) successChance = 0.60;
        else if (shooterLv >= 7.0 && shooterLv < 8.0) successChance = 0.70;
        else if (shooterLv >= 8.0 && shooterLv < 9.0) successChance = 0.80;
        else if (shooterLv >= 9.0) successChance = 0.90;
        
        if (Math.random() < successChance) {
            this.isFlying = false;
            this.ignoreWalls = false;
            this.isChecking = false;

            if (scoringTeam === "BLUE") { scoreBlue += 2; }
            else { scoreRed += 2; }
            
            document.getElementById("score1").innerText = scoreBlue;
            document.getElementById("score2").innerText = scoreRed;
            
            if (isReferee) {
                socket.emit("syncScore", { blue: scoreBlue, red: scoreRed, scoringTeam: scoringTeam });
            }
            this.resetBall();
        } else {
            const randomAngle = Math.random() * Math.PI * 2; 
            const bouncePower = 11 + Math.random() * 4; 
            
            this.vx = Math.cos(randomAngle) * bouncePower;
            this.vy = Math.sin(randomAngle) * bouncePower;
            
            this.x += this.vx * 1.5;
            this.ignoreWalls = false;

            if (isReferee) {
                socket.emit("syncBallAction", { 
                    x: this.x, 
                    y: this.y, 
                    vx: this.vx, 
                    vy: this.vy, 
                    holderId: null, 
                    isFlying: true, 
                    lastShooterSkill: shooterLv 
                });
            }
        }
    },

    resetBall() {
        this.x = 500;
        this.y = 250;
        this.vx = 0;
        this.vy = 0;
        this.holder = null;
        this.isFlying = false;
        this.ignoreWalls = false;
        this.isChecking = false;
        this.lastShooterSkill = 5.0;
        if (isReferee) {
            socket.emit("syncBallAction", { x: 500, y: 250, vx: 0, vy: 0, holderId: null, isFlying: false });
        }
    }
};

const allSpawnPositions = {
    BLUE: [ {x:200, y:250}, {x:320, y:130}, {x:320, y:370}, {x:120, y:160}, {x:120, y:340} ],
    RED:  [ {x:800, y:250}, {x:680, y:130}, {x:680, y:370}, {x:880, y:160}, {x:880, y:340} ]
};

let activePlayers = [];

// 감독 설정 인원 한도만큼 실동작 캐릭터 풀을 유연하게 빌드합니다.
function buildActivePlayersPool() {
    activePlayers = [];
    registeredNames.clear();

    // 블루팀 인원 한도만큼 생성
    for(let i = 0; i < maxBluePlayers; i++) {
        let bPos = allSpawnPositions.BLUE[i];
        activePlayers.push(new Player(bPos.x, bPos.y, "BLUE", i+1, i));
    }
    // 레드팀 인원 한도만큼 생성
    for(let i = 0; i < maxRedPlayers; i++) {
        let rPos = allSpawnPositions.RED[i];
        activePlayers.push(new Player(rPos.x, rPos.y, "RED", i+1, i));
    }
    updateAdminDropdown();
}

    maxRedInput.value = rMax;

    maxBluePlayers = bMax;
    maxRedPlayers = rMax;

    buildActivePlayersPool();
    socket.emit("syncMatchCapacity", { blueMax: bMax, redMax: rMax });
}

function shootAction(player) {
    if (gameState === "PAUSE") return;
    ball.holder = null;
    ball.isFlying = true;
    ball.ignoreWalls = false;
    ball.isChecking = false;
    
    const power = 14;
    ball.vx = Math.cos(player.angle) * power;
    ball.vy = Math.sin(player.angle) * power;
    ball.lastShooterSkill = player.skillLevel || 5.0;

    socket.emit("syncBallAction", { 
        x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy, holderId: null, isFlying: true, lastShooterSkill: player.skillLevel || 5.0
    });
}

function passAction(player) {

    ball.ignoreWalls = false;

document.getElementById("gameContainer").addEventListener("contextmenu", e => {

});

canvas.addEventListener("mousedown", e => {
    if (gameState === "MINIGAME" && e.button === 2) {
        if (myControllingPlayer) {
            const p = myControllingPlayer;
            if (activeDefender && p.team === activeDefender.team && p.id === activeDefender.id) {
                miniGameGauge -= 4;
                if (miniGameGauge < 0) miniGameGauge = 0;
                socket.emit("syncMiniGameHit", miniGameGauge);
            }
            else if (activeAttacker && p.team === activeAttacker.team && p.id === activeAttacker.id) {
                miniGameGauge += 4;
                if (miniGameGauge > 100) miniGameGauge = 100;
                socket.emit("syncMiniGameHit", miniGameGauge);
            }
        }
        return;
    }

    if (e.button === 0) {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        if (gameState === "SETUP") {
            if (myControllingPlayer) {
                alert("이미 선택한 캐릭터가 존재합니다.");
                return;
            }

            activePlayers.forEach(p => {
                const dist = Math.hypot(p.x - mouseX, p.y - mouseY);
                if (dist < p.radius + 10) {
                    if (!p.ownerName) {
                        const name = prompt(`[${p.team === "BLUE" ? "블루" : "레드"} ${p.id}번] 유저 이름 입력:`);
                        if (name && name.trim() !== "") {
                            const trimmedName = name.trim();
                            if (registeredNames.has(trimmedName)) {
                                alert("이미 등록된 유저명입니다.");
                                return;
                            }
                            p.ownerName = trimmedName;
                            p.socketId = socket.id; 
                            myControllingPlayer = p; 
                            registeredNames.add(trimmedName);
                            socket.emit("syncRegisterOwner", { team: p.team, id: p.id, ownerName: trimmedName });
                            updateAdminDropdown();
                        }
                    } else {
                        alert(`이미 선택 완료된 캐릭터입니다.`);
                    }
                }
            });
        }
        else if (gameState === "PLAYING" && myControllingPlayer) {
            checkDefenseTrigger(myControllingPlayer);
        }
    }
});

window.addEventListener("keydown", e => {
    if (e.key === " " || e.key === "Enter" || e.key.toLowerCase() === "shift") e.preventDefault(); 

    const key = e.key.toLowerCase();
    keys[key] = true;
    
    if (gameState === "PAUSE") return; 

    if (gameState === "PLAYING" && myControllingPlayer) {
        const p = myControllingPlayer;
        if (key === onlineScheme.grab) {
            checkManualBallGrab(p);
        }
        if (ball.holder === p) {
            if (key === onlineScheme.shoot) shootAction(p);
            if (key === onlineScheme.pass) passAction(p);
        }
    }
});

window.addEventListener("keyup", e => { 
    keys[e.key.toLowerCase()] = false; 
});

function checkManualBallGrab(player) {
    if (ball.holder || ball.isFlying) return;
    
    const dist = Math.hypot(ball.x - player.x, ball.y - player.y);
    if (dist < player.radius + ball.radius + 15) { 
        ball.holder = player;
        ball.ignoreWalls = false;
        ball.isChecking = false;
        socket.emit("syncBallAction", { x: ball.x, y: ball.y, vx: 0, vy: 0, holderId: { team: player.team, id: player.id }, isFlying: false });
    }
}

function checkDefenseTrigger(defender) {
    const now = Date.now();
    if (now < defenseLockUntil) return;
    if (now - defender.lastDefenseTime < defender.defenseCooldown) return; 

    if (ball.holder && ball.holder.team !== defender.team) {
        const dist = Math.hypot(defender.x - ball.holder.x, defender.y - ball.holder.y);
        if (dist < defender.radius + ball.holder.radius + 40) {
            defender.lastDefenseTime = now; 
            socket.emit("syncStartDefense", { defTeam: defender.team, defId: defender.id, attTeam: ball.holder.team, attId: ball.holder.id });
        }
    }
}

function startDefenseMiniGame(defender, attacker) {
    gameState = "MINIGAME";
    activeDefender = defender;
    activeAttacker = attacker;
    miniGameGauge = 50; 
    miniGameTimer = 180; 

    const defName = defender.ownerName || `${defender.team === "BLUE" ? teamBlueName : teamRedName} ${defender.id}`;
    const attName = attacker.ownerName || `${attacker.team === "BLUE" ? teamBlueName : teamRedName} ${attacker.id}`;
    document.getElementById("miniGameVS").innerText = `[수비수] ${defName} VS [공격수] ${attName}`;

    cutIn.classList.add("active");
    setTimeout(() => {
        if (gameState === "PAUSE") return; 
        cutIn.classList.remove("active");
        miniGameUI.style.display = "block";
    }, 600);
}

function updateMiniGame() {
    if (gameState !== "MINIGAME") return;
    
    miniGameTimer--;
    if (isReferee) {
        socket.emit("syncMiniGameTick", { gauge: miniGameGauge, timer: miniGameTimer });
    }

    if (miniGameGauge <= 5) {
        if (isReferee || myControllingPlayer === activeDefender) {
            socket.emit("syncEndMiniGame", { isDefWin: true });
        }
    } 
    else if (miniGameGauge >= 95 || miniGameTimer <= 0) {
        if (isReferee || myControllingPlayer === activeAttacker) {
            socket.emit("syncEndMiniGame", { isDefWin: false });
        }
    } 
}

function endMiniGame(isDefenderWin) {
    gameState = "PLAYING";
    miniGameUI.style.display = "none";
    ball.ignoreWalls = false;
    ball.isChecking = false;
    keys = {};

    if (isDefenderWin) {
        ball.holder = activeDefender;
        if (isReferee) {
            socket.emit("syncBallAction", { 
                x: ball.x, y: ball.y, vx: 0, vy: 0, holderId: { team: activeDefender.team, id: activeDefender.id }, isFlying: false 
            });
        }
    } else {
        const angle = Math.atan2(activeDefender.y - activeAttacker.y, activeDefender.x - activeAttacker.x);
        activeDefender.x += Math.cos(angle) * 50;
        activeDefender.y += Math.sin(angle) * 50;
        if (isReferee) {
            socket.emit("syncPlayerMove", { team: activeDefender.team, id: activeDefender.id, x: activeDefender.x, y: activeDefender.y, angle: activeDefender.angle });
        }
    }
    
    defenseLockUntil = Date.now() + 3000;
    activeDefender = null;
    activeAttacker = null;
}

function update(dt) {
    if (gameState === "PAUSE") return;

    if (gameState === "PLAYING") {
        if (myControllingPlayer) {
            const p = myControllingPlayer;
            let dx = 0, dy = 0;
            
            if (keys[onlineScheme.up]) dy = -1;
            if (keys[onlineScheme.down]) dy = 1;
            if (keys[onlineScheme.left]) dx = -1;
            if (keys[onlineScheme.right]) dx = 1;
            
            if (dx !== 0 || dy !== 0) {
                p.move(dx, dy, dt); 
                socket.emit("syncPlayerMove", { team: p.team, id: p.id, x: p.x, y: p.y, angle: p.angle });
            }
        }

        activePlayers.forEach(p => {
            if (!p.ownerName && isReferee) {
                p.updateAI(dt); 
                socket.emit("syncPlayerMove", { team: p.team, id: p.id, x: p.x, y: p.y, angle: p.angle });
            }
        });

        ball.update(dt); 
        if (isReferee) {
            socket.emit("syncBallLocation", { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy, isFlying: ball.isFlying });
        }
    } else if (gameState === "MINIGAME") {
        updateMiniGame();
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "rgba(255,255,255,0.4)";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(500, 0); ctx.lineTo(500, 500); ctx.stroke();
    ctx.beginPath(); ctx.arc(500, 250, 70, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeRect(0, 150, 80, 200);
    ctx.strokeRect(920, 150, 80, 200);

    ctx.strokeStyle = "#fff";
    ctx.beginPath(); ctx.arc(court.leftGoal.x, court.leftGoal.y, court.leftGoal.radius, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(court.rightGoal.x, court.rightGoal.y, court.rightGoal.radius, 0, Math.PI * 2); ctx.stroke();

    activePlayers.forEach(p => p.draw());
    ball.draw();

    if (gameState === "PAUSE") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 40px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("[정지] MATCH PAUSED", canvas.width / 2, canvas.height / 2);
    }
}

function gameLoop() {
    const now = performance.now();
    let dt = (now - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1; 
    lastTime = now;

    update(dt);
    draw();
    requestAnimationFrame(gameLoop);
}

    maxRedPlayers = serverRoom.maxRedPlayers || 5;
    
    maxBlueInput.value = maxBluePlayers;
    maxRedInput.value = maxRedPlayers;

    buildActivePlayersPool();

    serverRoom.registeredOwners.forEach(data => {
        const target = activePlayers.find(p => p.team === data.team && p.id === data.id);
        if (target) {
            target.ownerName = data.ownerName;
            target.socketId = data.socketId;
            target.skillLevel = data.skillLevel || 5.0;
            registeredNames.add(data.ownerName);
            if(data.socketId === socket.id) {
                myControllingPlayer = target;
            }
        }
    });

        document.getElementById("refereeZone").style.display = "none";

    appendLogToUI(logEntry);
});

function toggleUIVisibility() {
    const inputsDisabled = (gameState !== "SETUP" || !isReferee);
    maxBlueInput.disabled = inputsDisabled;
    maxRedInput.disabled = inputsDisabled;

    if (gameState === "PLAYING" || gameState === "MINIGAME" || gameState === "PAUSE") {
        document.getElementById("startBtn").disabled = true;
        pauseBtn.disabled = !isReferee;
        resetBtn.disabled = !isReferee;
        if (gameState === "PAUSE") {
            statusText.innerText = "[일시정지] 경기가 멈췄습니다.";
            statusText.style.color = "#e74c3c";
            pauseBtn.innerText = "[재개] RESUME";
        } else {
            statusText.innerText = "[경기 중] 매치 진행 중!";
            statusText.style.color = "#2ecc71";
            pauseBtn.innerText = "[정지] PAUSE";
        }
    } else {
        statusText.innerText = isReferee ? "[대기 모드] 팀별 매치 인원을 설정하고 경기를 시작하세요." : "[관전자 모드] 코드를 입력하세요.";
        statusText.style.color = "#f1c40f";
        document.getElementById("startBtn").disabled = !isReferee;
        pauseBtn.disabled = true;
        resetBtn.disabled = !isReferee;
        pauseBtn.innerText = "[정지] PAUSE";
    }
}

buildActivePlayersPool();
ball.resetBall();
lastTime = performance.now(); 
gameLoop();
</script>
</body>
</html>
