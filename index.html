<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>다들 모여!</title>
    <style>
        body {
            margin: 0; background-color: #222; color: #fff;
            font-family: 'Arial', sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start; min-height: 100vh;
            overflow-x: hidden; overflow-y: auto; padding-bottom: 20px; box-sizing: border-box;
            -webkit-user-select: none; user-select: none;
        }

        #roomEntrance {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #1a1a1a; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10000;
        }
        .entrance-box {
            background: #2c3e50; padding: 25px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center;
            border: 2px solid #f39c12; max-width: 420px; width: 85%;
        }
        .entrance-box h1 { margin-top: 0; color: #f39c12; font-size: 24px; }
        .input-group { display: flex; flex-direction: column; margin-bottom: 12px; text-align: left; }
        .input-group label { font-size: 13px; color: #f1c40f; font-weight: bold; margin-bottom: 4px; }
        .entrance-box input, .entrance-box select {
            width: 100%; padding: 10px; font-size: 16px; text-align: center;
            border-radius: 6px; border: none; font-weight: bold; background: #fff; color: #000; box-sizing: border-box;
        }
        .entrance-box button {
            width: 100%; padding: 12px; font-size: 16px; background: #e67e22;
            color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        .entrance-box button:hover { background: #d35400; }
        
        #lobby {
            margin-top: 10px; margin-bottom: 15px; display: none; gap: 12px;
            align-items: center; background: #333; padding: 10px 20px;
            border-radius: 8px; border: 1px solid #555; flex-wrap: wrap;
            z-index: 20; justify-content: center; width: 95%; max-width: 1400px; box-sizing: border-box;
        }
        
        #mainLayout {
            display: none; gap: 20px; align-items: flex-start; justify-content: center;
            width: 100%; max-width: 1780px; padding: 0 10px; box-sizing: border-box; flex-wrap: wrap;
        }

        select, button, input { padding: 8px 12px; font-size: 14px; font-weight: bold; border-radius: 4px; border: none; }
        input[type="password"] { background-color: #444; color: #fff; border: 1px solid #666; width: 80px; text-align: center; }
        input[type="text"] { background-color: #444; color: #fff; border: 1px solid #666; width: 100px; }
        input[type="number"] { background-color: #444; color: #fff; border: 1px solid #666; width: 45px; text-align: center; }
        select { background-color: #444; color: #fff; border: 1px solid #666; }
        button { background-color: #f39c12; color: #fff; cursor: pointer; touch-action: manipulation; }
        button:hover { background-color: #d35400; }
        button:disabled, select:disabled, input:disabled { background-color: #555; color: #888; cursor: not-allowed; }

        .side-panel { width: 240px; height: 508px; background-color: #555555; border-radius: 12px; padding: 20px; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        .side-panel.log-panel { width: 440px; }

        #gameContainer { position: relative; box-shadow: 0 0 25px rgba(0,0,0,0.7); width: 100%; max-width: 1000px; margin: 0 auto; }
        
        canvas { background-color: #d35400; border: 4px solid #fff; display: block; border-radius: 4px; outline: none; width: 100% !important; height: auto !important; box-sizing: border-box; }

        @media (max-width: 1024px) {
            .side-panel { width: 100% !important; height: 160px !important; }
            .side-panel.log-panel { height: 200px !important; }
            #gameContainer { order: -1; width: 100%; }
        }

        .panel-title { font-size: 18px; font-weight: bold; text-align: center; margin-bottom: 15px; letter-spacing: 1px; border-bottom: 2px solid #666; padding-bottom: 10px; }
        #keyGuideList { display: flex; flex-direction: column; gap: 10px; font-size: 13px; line-height: 1.4; overflow-y: auto; }
        .key-row { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 5px; }
        .key-val { color: #f1c40f; font-weight: bold; }

        #logContainer { flex: 1; overflow-y: auto; background: #444; border-radius: 6px; padding: 12px; font-size: 14px; display: flex; flex-direction: column; gap: 8px; word-break: break-all; white-space: pre-wrap; }
        .log-item { border-bottom: 1px solid #555; padding-bottom: 4px; line-height: 1.4; }
        .log-time { color: #aaa; margin-right: 6px; font-size: 11px; }
        .log-type-score { color: #2ecc71; font-weight: bold; }
        .log-type-defense { color: #e67e22; font-weight: bold; }
        .log-type-chat { color: #f1c40f; font-weight: bold; background: rgba(241, 196, 15, 0.1); border-radius: 2px; padding: 2px 4px; }

        #chatInputZone { margin-top: 10px; display: none; gap: 5px; }
        #directorChatMsg { flex: 1; background: #333; color: #fff; border: 1px solid #666; padding: 6px; font-size: 13px; border-radius: 4px; }

        #cutIn {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0);
            font-size: 50px; font-weight: 900; color: #e74c3c;
            text-shadow: -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 3px 3px 0 #fff, 0px 6px 8px rgba(0,0,0,0.5);
            font-style: italic; pointer-events: none; transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 10;
        }
        #cutIn.active { transform: translate(-50%, -50%) scale(1); }
        
        #miniGameUI {
            position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
            background: #110f0c; padding: 18px 25px; border-radius: 16px;
            border: 2px solid #ffcc00; text-align: center; display: none; z-index: 999;
            touch-action: none; width: 90%; max-width: 440px; box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }
        .progress-container { width: 100%; height: 28px; background-color: #e74c3c; border-radius: 6px; overflow: hidden; margin-top: 12px; border: 2px solid #fff; position: relative; box-sizing: border-box; }
        #progressFiller { width: 50%; height: 100%; background-color: #3498db; transition: width 0.04s ease-out; }
        #gaugeTextInfo { position: absolute; width: 100%; top: 0; left: 0; height: 100%; display: flex; justify-content: space-between; align-items: center; padding: 0 12px; box-sizing: border-box; font-size: 13px; font-weight: bold; color: #fff; text-shadow: 1px 1px 2px #000; pointer-events: none; }
        #miniGameClickZone { display: none; margin-top: 12px; }
        .mini-tap-btn { width: 100%; padding: 10px; background: #f39c12; color: #fff; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; border: none; }
        .mini-tap-btn:active { background: #d35400; }

        #ui { margin-top: 10px; font-size: 24px; font-weight: bold; display: none; gap: 60px; justify-content: center; width: 100%; }
        #adminSkillZone { display: none; align-items: center; gap: 5px; background: #444; padding: 3px 8px; border-radius: 4px; border: 1px solid #666; }
        #pauseBtn { background-color: #34495e; color: #fff; }
        #resetBtn { background-color: #c0392b; color: #fff; }
        #clearLogBtn { background-color: #7f8c8d; color: #fff; margin-left: 5px; }
        .capacity-zone { display: flex; align-items: center; gap: 4px; background: #444; padding: 4px 8px; border-radius: 4px; border: 1px solid #666; font-size: 13px; }

        #globalDefenseLockUntilZone {
            margin-top: 15px; width: 90%; max-width: 400px; background: rgba(0, 0, 0, 0.6);
            border: 1px solid #666; padding: 8px 12px; border-radius: 6px; display: none;
            flex-direction: column; align-items: center; gap: 5px; box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        #cooldownTitle { font-size: 12px; font-weight: bold; color: #e74c3c; }
        .cooldown-progress-container { width: 100%; height: 12px; background-color: #333; border-radius: 6px; overflow: hidden; border: 1px solid #555; }
        #cooldownProgressFiller { width: 0%; height: 100%; background: #e74c3c; }

        #mobileController {
            display: none; position: fixed; left: 0; bottom: 0; width: 100vw; height: 160px;
            justify-content: space-between; align-items: center; padding: 10px 20px; box-sizing: border-box;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            z-index: 9999; pointer-events: none;
        }
        .v-joystick-container { position: relative; width: 120px; height: 120px; background: rgba(22, 22, 22, 0.7); border: 3px solid #f39c12; border-radius: 50%; display: flex; align-items: center; justify-content: center; touch-action: none; pointer-events: auto; }
        .v-joystick-stick { position: absolute; width: 45px; height: 45px; background: #f39c12; border-radius: 50%; box-shadow: 0 4px 8px rgba(0,0,0,0.6); }
        .v-buttons-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; pointer-events: auto; }
        .v-btn {
            width: 60px; height: 60px; background: rgba(50, 50, 50, 0.85); border: 2px solid #aaa;
            color: white; border-radius: 50%; font-size: 11px; font-weight: bold; display: flex;
            align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            touch-action: none; -webkit-tap-highlight-color: transparent;
        }
        .v-btn:active { background: #d35400; border-color: #fff; transform: scale(0.9); }
        .v-btn.btn-action-grab { background: rgba(41, 128, 185, 0.9); border-color: #3498db; }
        .v-btn.btn-action-def { background: rgba(39, 174, 96, 0.9); border-color: #2ecc71; }
        
        @media (pointer: coarse) { #mobileController.active { display: flex; } }
        #fullscreenBtn { background-color: #8e44ad; color: #fff; }
        #roomInfoBadge { background-color: #2980b9; color: white; padding: 6px 12px; border-radius: 4px; font-size: 13px; font-weight: bold; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body oncontextmenu="return false;">

    <div id="roomEntrance">
        <div class="entrance-box">
            <h1>차성 체육관</h1>
            <div class="input-group">
                <label for="roomCodeSelect">들리지 않아? 사람들의 함성 소리*</label>
                <select id="roomCodeSelect">
                    <option value="0001">1 번 코트</option>
                    <option value="0002">2 번 코트</option>
                </select>
            </div>
            <div class="input-group">
                <label for="roomUserNameInput">선수명</label>
                <input type="text" id="roomUserNameInput" placeholder="예: 차형월" style="width:100%;">
            </div>
            <div class="input-group">
                <label for="roomUserPasswordInput">접속 비밀번호 (숫자 4자리)</label>
                <input type="password" id="roomUserPasswordInput" maxlength="4" placeholder="••••" style="width:100%;">
            </div>
            <button onclick="submitRoomAuth(false)">선수 정보를 저장합니다.</button>
        </div>
    </div>

    <div id="lobby">
        <div id="roomInfoBadge">방: 미지정</div>
        <button id="fullscreenBtn" onclick="requestFullScreen()">전체화면 켜기</button>
        <div id="refereeZone" style="display: flex; gap: 8px; align-items: center;">
            <label for="refName">감독: </label>
            <input type="text" id="refName" placeholder="감독명" style="width: 70px;">
            <label for="refKey">코드: </label>
            <input type="password" id="refKey" placeholder="코드">
            <button onclick="authReferee()" id="authBtn">임명</button>
        </div>
        
        <div id="adminSkillZone">
            <label>경기력:</label>
            <select id="adminTargetPlayer" onchange="loadTargetSkillLevel()"></select>
            <input type="number" id="adminSkillInput" min="5.0" max="9.9" step="0.1" value="5.0">
            <button onclick="updatePlayerSkill()">적용</button>
            <button id="clearLogBtn" onclick="clearLogsFromServer()">로그 초기화</button>
        </div>

        <span style="color:#555;">|</span>
        <label>팀명: </label>
        <input type="text" id="teamNameBlueInput" value="TEAM BLUE" placeholder="블루팀명" oninput="sendLiveTeamName('BLUE')" disabled>
        <input type="text" id="teamNameRedInput" value="TEAM RED" placeholder="레드팀명" oninput="sendLiveTeamName('RED')" disabled>

        <div class="capacity-zone">
            <span style="color: #3498db; font-weight: bold;">BLUE</span>
            <input type="number" id="maxBlueInput" min="1" max="5" value="5" onchange="sendMatchCapacity()" disabled>
            <span style="font-weight: bold; color: #aaa;">VS</span>
            <input type="number" id="maxRedInput" min="1" max="5" value="5" onchange="sendMatchCapacity()" disabled>
            <span style="color: #e74c3c; font-weight: bold;">RED</span>
        </div>

        <button id="startBtn" onclick="startGame()" disabled>[시작] START</button>
        <button id="pauseBtn" onclick="togglePause()" disabled>PAUSE</button>
        <button id="resetBtn" onclick="triggerManualReset()" disabled>RESET</button>
        <span id="statusText" style="color: #f1c40f; margin-left: 5px;">[관전자 모드] 데이터를 입력하세요.</span>
    </div>
    
    <div id="mainLayout">
        <div class="side-panel">
            <div class="panel-title">조작키</div>
            <div id="keyGuideList">
                <div class="key-row"><span>상하좌우 이동</span><span class="key-val">W,A,S,D / 패드</span></div>
                <div class="key-row"><span>공 줍기</span><span class="key-val">E / GRAB</span></div>
                <div class="key-row"><span>패스</span><span class="key-val">Shift / PASS</span></div>
                <div class="key-row"><span>슛</span><span class="key-val">Space / SHOOT</span></div>
                <div class="key-row"><span>디펜스 시도</span><span class="key-val">좌클릭 / DEF</span></div>
                <div class="key-row"><span>디펜스 게임</span><span class="key-val">우클릭 연타</span></div>
            </div>
        </div>

        <div id="gameContainer">
            <div id="cutIn">디펜스!!</div>
            
            <div id="miniGameUI">
                <div id="miniGameTitle" style="font-weight:bold; font-size:16px; color:#ffffff; letter-spacing: 0.5px;">🔥 디펜스 게임 🔥</div>
                <div class="progress-container">
                    <div id="progressFiller"></div>
                    <div id="gaugeTextInfo">
                        <span id="leftTeamGaugeValue" style="color:#fff;">수비: 25</span>
                        <span id="rightTeamGaugeValue" style="color:#fff;">공격: 25</span>
                    </div>
                </div>
                <div id="miniGameVS" style="font-size:13px; margin-top:8px; color:#cccccc; font-weight:bold; letter-spacing: 0.3px;">[수비] 수비수 VS [공격] .</div>
                <div id="miniGameClickZone" style="margin-top: 10px;"><button class="mini-tap-btn" id="miniTapButton">PUSH!!</button></div>
            </div>
            
            <canvas id="gameCanvas" width="1000" height="500" tabindex="1"></canvas>
        </div>

        <div class="side-panel log-panel">
            <div class="panel-title">LOG</div>
            <div id="logContainer"></div>
            <div id="chatInputZone">
                <input type="text" id="directorChatMsg" placeholder="공지 메시지 입력..." onkeydown="if(event.key==='Enter') sendDirectorChat()">
                <button onclick="sendDirectorChat()" style="padding: 4px 10px; font-size:12px;">전송</button>
            </div>
        </div>
    </div>
    
    <div id="ui">
        <div style="color: #3498db;"><span id="teamLabel1">TEAM BLUE</span>: <span id="score1">0</span></div>
        <div style="color: #e74c3c;"><span id="teamLabel2">TEAM RED</span>: <span id="score2">0</span></div>
    </div>

    <div id="globalDefenseLockUntilZone">
        <div id="cooldownTitle">디펜스 쿨타임 진행 중!</div>
        <div class="cooldown-progress-container"><div id="cooldownProgressFiller"></div></div>
    </div>

    <div id="mobileController">
        <div class="v-joystick-container" id="vJoystickContainer"><div class="v-joystick-stick" id="vJoystickStick"></div></div>
        <div class="v-buttons-grid">
            <div class="v-btn btn-action-grab" id="vBtnGrab">GRAB</div>
            <div class="v-btn btn-action-def" id="vBtnDef">DEF</div>
            <div class="v-btn" id="vBtnPass">PASS</div>
            <div class="v-btn" id="vBtnShoot">SHOOT</div>
        </div>
    </div>

<script>
const socket = io();
let targetRoomId = null;
let myProfileName = "";
let myProfilePassword = "";

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const cutIn = document.getElementById("cutIn");

const miniGameUI = document.getElementById("miniGameUI");
const progressFiller = document.getElementById("progressFiller");

const miniGameClickZone = document.getElementById("miniGameClickZone");
const miniTapButton = document.getElementById("miniTapButton");
const statusText = document.getElementById("statusText");
const pauseBtn = document.getElementById("pauseBtn");
const resetBtn = document.getElementById("resetBtn");
const logContainer = document.getElementById("logContainer");
const chatInputZone = document.getElementById("chatInputZone");

const maxBlueInput = document.getElementById("maxBlueInput");
const maxRedInput = document.getElementById("maxRedInput");
const globalDefenseLockUntilZone = document.getElementById("globalDefenseLockUntilZone");
const cooldownTitle = document.getElementById("cooldownTitle");
const cooldownProgressFiller = document.getElementById("cooldownProgressFiller");

let isReferee = false;
let myDirectorName = "";
let scoreBlue = 0;
let scoreRed = 0;
let teamBlueName = "TEAM BLUE";
let teamRedName = "TEAM RED";
let maxBluePlayers = 5;
let maxRedPlayers = 5;
let gameState = "SETUP";
let miniGameGauge = 25;
let activeDefender = null;
let activeAttacker = null;
let globalDefenseLockUntil = 0;

let myControllingPlayer = null;
let keys = {};
const registeredNames = new Set();

let mobileMoveX = 0;
let mobileMoveY = 0;
let lastTime = performance.now();
let loopStarted = false;

const isMobileDevice = window.matchMedia("(pointer: coarse)").matches;

const court = {
    width: canvas.width,
    height: canvas.height,
    leftGoal: { x: 50, y: 250, radius: 15 },
    rightGoal: { x: 950, y: 250, radius: 15 }
};

const onlineScheme = {
    up: 'w', down: 's', left: 'a', right: 'd',
    grab: 'e', pass: 'shift', shoot: ' '
};

function saveLocalMatchSession() {
    const sessionData = {
        isReferee: isReferee,
        myDirectorName: myDirectorName,
        myControllingPlayerId: myControllingPlayer ? myControllingPlayer.id : null,
        myControllingPlayerTeam: myControllingPlayer ? myControllingPlayer.team : null
    };
    localStorage.setItem("saved_match_session", JSON.stringify(sessionData));
}

function loadLocalMatchSession() {
    const raw = localStorage.getItem("saved_match_session");
    if (!raw) return null;
    try {
        return JSON.parse(raw);
    } catch(e) {
        return null;
    }
}

function submitRoomAuth(isAutoRefresh = false) {
    let rCode, uName, uPass;
    if (isAutoRefresh) {
        rCode = localStorage.getItem("saved_room_id");
        uName = localStorage.getItem("saved_user_name");
        uPass = localStorage.getItem("saved_password");
    } else {
        rCode = document.getElementById("roomCodeSelect").value;
        uName = document.getElementById("roomUserNameInput").value.trim();
        uPass = document.getElementById("roomUserPasswordInput").value.trim();

        if(!uName) {
            alert("유저 참관명(본인 실명)을 입력해 주세요!");
            return;
        }
        if(!uPass || uPass.length !== 4 || isNaN(uPass)) {
            alert("비밀번호 숫자 4자리를 입력해 주세요!");
            return;
        }
    }

    targetRoomId = rCode;
    myProfileName = uName;
    myProfilePassword = uPass;

    socket.emit('joinRoom', { roomId: targetRoomId, userName: myProfileName, password: myProfilePassword, isAutoRefresh: isAutoRefresh });
}

window.addEventListener("DOMContentLoaded", () => {
    const savedRoom = localStorage.getItem("saved_room_id");
    const savedName = localStorage.getItem("saved_user_name");
    const savedPass = localStorage.getItem("saved_password");
    if (savedRoom && savedName && savedPass) {
        submitRoomAuth(true);
    }
});

socket.on('authResult', (res) => {
    if(!res.success) {
        if (res.isAutoRefresh) {
            localStorage.clear();
        } else {
            alert(res.message);
        }
        return;
    }

    localStorage.setItem("saved_room_id", targetRoomId);
    localStorage.setItem("saved_user_name", myProfileName);
    localStorage.setItem("saved_password", myProfilePassword);

    document.getElementById("roomEntrance").style.display = "none";
    document.getElementById("lobby").style.display = "flex";
    document.getElementById("mainLayout").style.display = "flex";
    document.getElementById("ui").style.display = "flex";
    document.getElementById("roomInfoBadge").innerText = `코트 ID: ${targetRoomId} / 선수: ${myProfileName}`;

    const savedSession = loadLocalMatchSession();
    if (savedSession) {
        isReferee = savedSession.isReferee;
        myDirectorName = savedSession.myDirectorName || "";
        if (isReferee) {
            document.getElementById("refName").value = myDirectorName;
            document.getElementById("refName").disabled = true;
            document.getElementById("refKey").style.display = "none";
            document.getElementById("authBtn").style.display = "none";
            document.getElementById("adminSkillZone").style.display = "flex";
            document.getElementById("chatInputZone").style.display = "flex";
            
            document.getElementById("teamNameBlueInput").disabled = false;
            document.getElementById("teamNameRedInput").disabled = false;
            document.getElementById("maxBlueInput").disabled = false;
            document.getElementById("maxRedInput").disabled = false;
        }
    }

    if (!loopStarted) {
        initGameWorld();
        requestAnimationFrame(gameLoop);
        loopStarted = true;
    }
    canvas.focus();
});

let players = [];
let ball = {
    x: 500, y: 250, vx: 0, vy: 0,
    radius: 8, holderId: null, holderTeam: null,
    isFlying: false, lastShooterSkill: 5.0
};

function initGameWorld() {
    players = [];
    // BLUE TEAM
    for (let i = 1; i <= 5; i++) {
        players.push({
            team: "BLUE", id: i, x: 200, y: 60 + i * 65, radius: 14,
            speed: 3.4, angle: 0, ownerName: "", isControlled: false,
            baseColor: "#3498db", strokeColor: "#2980b9", skillLevel: 5.0
        });
    }
    // RED TEAM
    for (let i = 1; i <= 5; i++) {
        players.push({

function requestFullScreen() {
    const doc = window.document;
    const docEl = doc.documentElement;
    const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
    const cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

    if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
        requestFullScreen.call(docEl);
        document.getElementById("fullscreenBtn").innerText = "전체화면 끄기";
    } else {
        cancelFullScreen.call(doc);
        document.getElementById("fullscreenBtn").innerText = "전체화면 켜기";
    }
}

function getCanvasMousePos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
    };
}

function handleLeftClickDefense(e) {
    if (gameState !== "PLAYING" || Date.now() < globalDefenseLockUntil) return;
    if (!myControllingPlayer || ball.holderId === null) return;
    if (ball.holderTeam === myControllingPlayer.team) return;

    const pos = getCanvasMousePos(e);
    const p = myControllingPlayer;
    const distToClick = Math.hypot(pos.x - p.x, pos.y - p.y);
    if (distToClick > 45) return;

    const holder = players.find(o => o.team === ball.holderTeam && o.id === ball.holderId);
    if (!holder) return;

    const distToHolder = Math.hypot(p.x - holder.x, p.y - holder.y);
    if (distToHolder <= 35) {
        socket.emit('syncStartMiniGame', {
            attTeam: holder.team, attId: holder.id,
            defTeam: p.team, defId: p.id
        });
    }
}

function handleRightClickMiniGame(e) {
    if (gameState !== "MINIGAME") return;
    if (!myControllingPlayer) return;

    let role = null;
    if (activeDefender && activeDefender.team === myControllingPlayer.team && activeDefender.id === myControllingPlayer.id) {
        role = "DEFENDER";
    } else if (activeAttacker && activeAttacker.team === myControllingPlayer.team && activeAttacker.id === myControllingPlayer.id) {
        role = "ATTACKER";
    }
    if (role) {
        socket.emit('syncMiniGameHit', { role });
    }
}

if (isMobileDevice) {
    document.getElementById("mobileController").classList.add("active");
    
    const joystickContainer = document.getElementById("vJoystickContainer");
    const joystickStick = document.getElementById("vJoystickStick");
    let joystickActive = false;
    let touchId = null;
    let startX = 0, startY = 0;

    joystickContainer.addEventListener("touchstart", (e) => {
        if (joystickActive) return;
        const t = e.changedTouches[0];
        touchId = t.identifier;
        joystickActive = true;
        const rect = joystickContainer.getBoundingClientRect();
        startX = rect.left + rect.width / 2;
        startY = rect.top + rect.height / 2;
    }, {passive: true});

    window.addEventListener("touchmove", (e) => {
        if (!joystickActive) return;
        let targetTouch = null;
        for (let i = 0; i < e.touches.length; i++) {
            if (e.touches[i].identifier === touchId) {
                targetTouch = e.touches[i];
                break;
            }
        }
        if (!targetTouch) return;

        const dx = targetTouch.clientX - startX;
        const dy = targetTouch.clientY - startY;
        const dist = Math.hypot(dx, dy);
        const maxDist = 40;

        let angle = Math.atan2(dy, dx);
        let moveDist = Math.min(dist, maxDist);

        const stickX = moveDist * Math.cos(angle);
        const stickY = moveDist * Math.sin(angle);
        joystickStick.style.transform = `translate(${stickX}px, ${stickY}px)`;

        mobileMoveX = stickX / maxDist;
        mobileMoveY = stickY / maxDist;
    }, {passive: false});

    const endJoystick = (e) => {
        if (!joystickActive) return;
        let remains = false;
        if (e.touches) {
            for(let i=0; i<e.touches.length; i++) {
                if(e.touches[i].identifier === touchId) remains = true;
            }
        }
        if (!remains) {
            joystickActive = false;
            touchId = null;
            joystickStick.style.transform = "translate(0px, 0px)";
            mobileMoveX = 0;
            mobileMoveY = 0;
        }
    };

    joystickContainer.addEventListener("touchend", endJoystick, {passive: true});
    joystickContainer.addEventListener("touchcancel", endJoystick, {passive: true});

    document.getElementById("vBtnGrab").addEventListener("touchstart", (e) => { e.preventDefault(); handleGrabAction(); });
    document.getElementById("vBtnDef").addEventListener("touchstart", (e) => {
        e.preventDefault();
        if (gameState === "MINIGAME") {
            handleRightClickMiniGame(null);
        } else {
            if(!myControllingPlayer) return;
            const holder = players.find(o => o.team === ball.holderTeam && o.id === ball.holderId);
            if(holder) {
                socket.emit('syncStartMiniGame', { attTeam: holder.team, id: holder.id, defTeam: myControllingPlayer.team, defId: myControllingPlayer.id });
            }
        }
    });
    document.getElementById("vBtnPass").addEventListener("touchstart", (e) => { e.preventDefault(); handlePassAction(); });
    document.getElementById("vBtnShoot").addEventListener("touchstart", (e) => { e.preventDefault(); handleShootAction(); });
}

canvas.addEventListener("click", (e) => {
    if (gameState !== "SETUP") return;
    const pos = getCanvasMousePos(e);
    players.forEach(p => {
        const d = Math.hypot(pos.x - p.x, pos.y - p.y);
        if (d <= p.radius) {
            const bMax = parseInt(maxBlueInput.value);
            const rMax = parseInt(maxRedInput.value);
            if (p.team === "BLUE" && p.id > bMax) return;
            if (p.team === "RED" && p.id > rMax) return;

            if (p.ownerName === "") {
                if (myControllingPlayer) {
                    socket.emit('syncRegisterOwner', { team: myControllingPlayer.team, id: myControllingPlayer.id, ownerName: "", password: "" });
                }
                socket.emit('syncRegisterOwner', { team: p.team, id: p.id, ownerName: myProfileName, password: myProfilePassword, x: p.x, y: p.y, angle: p.angle });
            } else if (p.ownerName === myProfileName && p.password === myProfilePassword) {
                socket.emit('syncRegisterOwner', { team: p.team, id: p.id, ownerName: "", password: "" });
            } else {
                alert("이미 다른 선수가 배정된 명당자리입니다.");
            }

function handleGrabAction() {
    if (gameState !== "PLAYING" || ball.holderId !== null || ball.isFlying) return;
    if (!myControllingPlayer) return;
    const p = myControllingPlayer;
    const dist = Math.hypot(ball.x - p.x, ball.y - p.y);
    if (dist <= p.radius + ball.radius + 10) {
        ball.holderId = p.id;
        ball.holderTeam = p.team;
        ball.isFlying = false;
        ball.vx = 0; ball.vy = 0;
        socket.emit('syncBallAction', { x: ball.x, y: ball.y, vx: 0, vy: 0, isFlying: false, holderId: p.id, holderTeam: p.team, isActionSignal: true });
    }
}

function handlePassAction() {
    if (gameState !== "PLAYING" || !myControllingPlayer) return;
    const p = myControllingPlayer;
    if (ball.holderTeam === p.team && ball.holderId === p.id) {
        let target = null;
        let minDist = Infinity;
        players.forEach(o => {
            if (o.team === p.team && o.id !== p.id && o.ownerName !== "") {
                const d = Math.hypot(o.x - p.x, o.y - p.y);
                if (d < minDist) { minDist = d; target = o; }
            }
        });

        ball.holderId = null; ball.holderTeam = null; ball.isFlying = true;
        if (target) {
            const angle = Math.atan2(target.y - p.y, target.x - p.x);
            ball.vx = Math.cos(angle) * 11; ball.vy = Math.sin(angle) * 11;
        } else {
            ball.vx = Math.cos(p.angle) * 10; ball.vy = Math.sin(p.angle) * 10;
        }
        socket.emit('syncBallAction', { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy, isFlying: true, isActionSignal: true });
    }
}

function handleShootAction() {
    if (gameState !== "PLAYING" || !myControllingPlayer) return;
    const p = myControllingPlayer;
    if (ball.holderTeam === p.team && ball.holderId === p.id) {
        const goal = (p.team === "BLUE") ? court.rightGoal : court.leftGoal;
        const angle = Math.atan2(goal.y - p.y, goal.x - p.x);
        
        let power = p.skillLevel * 2.3;
        if (power > 25) power = 25; // BALL_MAX_SPEED 대입

        ball.holderId = null; ball.holderTeam = null; ball.isFlying = true;
        ball.vx = Math.cos(angle) * power;
        ball.vy = Math.sin(angle) * power;
        ball.lastShooterSkill = p.skillLevel;

        socket.emit('syncBallAction', { x: ball.x, y: ball.y, vx: ball.vx, vy: ball.vy, isFlying: true, lastShooterSkill: p.skillLevel, isActionSignal: true });
    }
}

    maxBlueInput.disabled = inputsDisabled;
    maxRedInput.disabled = inputsDisabled;

    if (gameState === "PLAYING" || gameState === "MINIGAME" || gameState === "PAUSE") {
        document.getElementById("startBtn").disabled = true;
        pauseBtn.disabled = !isReferee;
        resetBtn.disabled = !isReferee;

        if (gameState === "PAUSE") {
            statusText.innerText = "[일시정지]";

        } else {

        statusText.innerText = isReferee ? "[대기 모드] 매치 인프라 조율 가능" : "[대기 모드] 감독 진영의 개시 대기 중";

    }

    if(isReferee) {

    gameState = "MINIGAME";

    activeAttacker = { team: data.attTeam, id: data.attId };
    miniGameGauge = 25;

    cutIn.classList.add("active");
    setTimeout(() => { cutIn.classList.remove("active"); }, 800);

    miniGameUI.style.display = "block";
    
    const defP = players.find(o => o.team === data.defTeam && o.id === data.defId);
    const attP = players.find(o => o.team === data.attTeam && o.id === data.attId);
    const defName = defP ? defP.ownerName : "수비수";
    const attName = attP ? attP.ownerName : "공격수";

    document.getElementById("miniGameVS").innerText = `[수비] ${defName} VS [공격] ${attName}`;
    
    if (myControllingPlayer && 
       ((myControllingPlayer.team === data.defTeam && myControllingPlayer.id === data.defId) ||
        (myControllingPlayer.team === data.attTeam && myControllingPlayer.id === data.attId))) {
        miniGameClickZone.style.display = "block";
        miniTapButton.onclick = () => {
            let role = (myControllingPlayer.team === data.defTeam) ? "DEFENDER" : "ATTACKER";
            socket.emit('syncMiniGameHit', { role });

    } else {
        miniGameClickZone.style.display = "none";

    updateGaugeDisplay(25);

function updateLocalPhysics(dt) {
    if (gameState !== "PLAYING") return;

    if (myControllingPlayer) {
        const p = myControllingPlayer;
        let moveX = 0;
        let moveY = 0;

        if (isMobileDevice) {
            moveX = mobileMoveX * p.speed;
            moveY = mobileMoveY * p.speed;
        } else {
            if (keys['w'] || keys['arrowup']) moveY = -p.speed;
            if (keys['s'] || keys['arrowdown']) moveY = p.speed;
            if (keys['a'] || keys['arrowleft']) moveX = -p.speed;
            if (keys['d'] || keys['arrowright']) moveX = p.speed;
        }

        if (moveX !== 0 || moveY !== 0) {
            p.x += moveX;
            p.y += moveY;
            p.angle = Math.atan2(moveY, moveX);

            if (p.x < p.radius) p.x = p.radius;
            if (p.x > court.width - p.radius) p.x = court.width - p.radius;
            if (p.y < p.radius) p.y = p.radius;
            if (p.y > court.height - p.radius) p.y = court.height - p.radius;

            socket.emit('syncPlayerMove', { team: p.team, id: p.id, x: p.x, y: p.y, angle: p.angle });
        }
    }

    if (ball.holderId !== null) {
        const holder = players.find(o => o.team === ball.holderTeam && o.id === ball.holderId);
        if (holder) {
            ball.x = holder.x + Math.cos(holder.angle) * 14;
            ball.y = holder.y + Math.sin(holder.angle) * 14;
        }
    }

    if (isReferee && !ball.isFlying && ball.holderId === null) {
        const distToLeftGoal = Math.hypot(ball.x - court.leftGoal.x, ball.y - court.leftGoal.y);
        if (distToLeftGoal <= court.leftGoal.radius + ball.radius) {
            ball.x = 500; ball.y = 250; ball.vx = 0; ball.vy = 0;
            socket.emit('syncScore', { blue: scoreBlue, red: scoreRed + 1, scoringTeam: "RED" });
            socket.emit('syncBallAction', { x: 500, y: 250, vx: 0, vy: 0, isFlying: false, isActionSignal: true });
        }

        const distToRightGoal = Math.hypot(ball.x - court.rightGoal.x, ball.y - court.rightGoal.y);
        if (distToRightGoal <= court.rightGoal.radius + ball.radius) {
            ball.x = 500; ball.y = 250; ball.vx = 0; ball.vy = 0;
            socket.emit('syncScore', { blue: scoreBlue + 1, red: scoreRed, scoringTeam: "BLUE" });
            socket.emit('syncBallAction', { x: 500, y: 250, vx: 0, vy: 0, isFlying: false, isActionSignal: true });
        }
    }
}

function drawGameField() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#d35400";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "rgba(255,255,255,0.6)";
    ctx.lineWidth = 4;
    ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 10);
    ctx.lineTo(canvas.width / 2, canvas.height - 10);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(canvas.width / 2, canvas.height / 2, 80, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = "rgba(52, 152, 219, 0.2)";
    ctx.fillRect(10, 10, 120, canvas.height - 20);
    ctx.fillStyle = "rgba(231, 76, 60, 0.2)";
    ctx.fillRect(canvas.width - 130, 10, 120, canvas.height - 20);

    ctx.lineWidth = 5;
    ctx.strokeStyle = "#3498db";
    ctx.beginPath();
    ctx.arc(court.leftGoal.x, court.leftGoal.y, court.leftGoal.radius, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = "#e74c3c";
    ctx.beginPath();
    ctx.arc(court.rightGoal.x, court.rightGoal.y, court.rightGoal.radius, 0, Math.PI * 2);
    ctx.stroke();

    const bMax = parseInt(maxBlueInput.value);
    const rMax = parseInt(maxRedInput.value);

    players.forEach(p => {
        if (p.team === "BLUE" && p.id > bMax) return;
        if (p.team === "RED" && p.id > rMax) return;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);

        ctx.fillStyle = p.baseColor;
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = p.isControlled ? 3 : 1.5;

        ctx.beginPath();
        ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.moveTo(p.radius - 2, -5);
        ctx.lineTo(p.radius + 6, 0);
        ctx.lineTo(p.radius - 2, 5);
        ctx.fill();

        ctx.restore();

        if (p.ownerName !== "") {
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 11px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(p.ownerName, p.x, p.y - p.radius - 6);
        } else {
            ctx.fillStyle = "rgba(255,255,255,0.4)";
            ctx.font = "9px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(`${p.team.substring(0,1)}${p.id}`, p.x, p.y + 3);
        }
    });

    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fillStyle = "#f1c40f";
    ctx.fill();
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    const now = Date.now();
    if (now < globalDefenseLockUntil) {
        globalDefenseLockUntilZone.style.display = "flex";
        const totalCool = 5000;
        const remain = globalDefenseLockUntil - now;
        const progressPct = Math.max(0, Math.min(100, (remain / totalCool) * 100));
        document.getElementById("cooldownProgressFiller").style.width = `${progressPct}%`;
    } else {
        globalDefenseLockUntilZone.style.display = "none";
    }
}

function gameLoop(timestamp) {
    let dt = timestamp - lastTime;
    if (dt > 100) dt = 16;
    lastTime = timestamp;

    updateLocalPhysics(dt);
    drawGameField();

    requestAnimationFrame(gameLoop);
}
</script>
