<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 멀티플레이 농구 게임 (관리자 권한 패널 통합)</title>
    <style>
        body {
            margin: 0;
            background-color: #2b2b2b;
            color: white;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #topBar {
            background-color: #383838;
            border: 1px solid #4a4a4a;
            border-radius: 6px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
            font-size: 14px;
            width: 764px;
            position: relative;
        }
        .divider { color: #555; }
        select {
            background-color: #222;
            color: white;
            border: 1px solid #666;
            padding: 4px 10px;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }
        #startBtn {
            background-color: #f39c12; 
            color: white;
            border: none;
            padding: 6px 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        #startBtn:hover { background-color: #d35400; }
        #statusText { color: #f1c40f; font-size: 13px; }
        
        /* [관리자 UI 인증 단추 스타일] */
        #adminLoginBtn {
            position: absolute;
            right: 15px;
            background-color: #7f8c8d;
            font-size: 11px;
            padding: 4px 8px;
            margin: 0;
        }
        /* [관리자 전용 제어 명령 패널 스타일] */
        #adminPanel {
            background-color: #c0392b;
            border: 1px solid #e74c3c;
            border-radius: 4px;
            padding: 6px 15px;
            margin-bottom: 10px;
            display: none; /* 관리자 인증 완료 시 스크립트로 노출 제어 */
            gap: 15px;
            align-items: center;
            font-size: 13px;
            width: 774px;
        }
        .admin-core-btn {
            background-color: #2c3e50;
            font-size: 12px;
            padding: 4px 10px;
            margin: 0;
        }

        #gameCanvas {
            border: 4px solid #fff;
            border-radius: 4px;
            background-color: #d35400; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        #scoreBoard {
            display: flex;
            gap: 30px;
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        .blue-score { color: #3498db; }
        .red-score { color: #e74c3c; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="adminPanel">
        <span>⚡ <b>관리자 시스템 가동 중</b> :</span>
        <button class="admin-core-btn" id="adminResetScoreBtn">점수 초기화</button>
        <button class="admin-core-btn" id="adminKickBtn">특정 유저 강제퇴장</button>
    </div>

    <div id="topBar">
        <div>
            <span class="divider">|</span> &nbsp;인원: 
            <select id="playerCountSelect">
                <option value="1">1 VS 1</option>
                <option value="2">2 VS 2</option>
                <option value="3">3 VS 3</option>
                <option value="4">4 VS 4</option>
                <option value="5">5 VS 5</option>
            </select>
        </div>
        <button id="startBtn">▶ GAME START</button>
        <div id="statusText">[대기 모드] 캐릭터를 선택하고 게임을 기동하세요.</div>
        <button id="adminLoginBtn">관리자 인증</button>
    </div>

    <canvas id="gameCanvas" width="850" height="500"></canvas>

    <div id="scoreBoard">
        <div class="blue-score">TEAM BLUE: <span id="blueScoreText">0</span></div>
        <div class="red-score">TEAM RED: <span id="redScoreText">0</span></div>
    </div>

    <script>
        const socket = io();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const playerCountSelect = document.getElementById('playerCountSelect');
        const startBtn = document.getElementById('startBtn');
        const statusText = document.getElementById('statusText');
        const blueScoreText = document.getElementById('blueScoreText');
        const redScoreText = document.getElementById('redScoreText');
        
        // 관리자용 UI 요소 바인딩
        const adminPanel = document.getElementById('adminPanel');
        const adminLoginBtn = document.getElementById('adminLoginBtn');
        const adminResetScoreBtn = document.getElementById('adminResetScoreBtn');
        const adminKickBtn = document.getElementById('adminKickBtn');

        let myId = null;
        let remotePlayers = {};
        let gameState = {
            ball: { x: 425, y: 250 },
            score: { blue: 0, red: 0 },
            gameStarted: false,
            adminId: null
        };

        let myData = {
            name: 'Chaehee',
            team: 'BLUE', 
            isSpectator: false,
            isAdmin: false,
            x: 200,
            y: 250,
            number: 1
        };

        const keys = {};

        // [관리자 이벤트 수신기 부착]
        adminLoginBtn.addEventListener('click', () => {
            const pass = prompt("관리자 인증 비밀번호를 입력하세요:");
            if(pass) socket.emit('verifyAdminPassword', pass);
        });

        socket.on('adminAuthResult', (res) => {
            alert(res.message);
            if(res.success) {
                adminPanel.style.display = 'flex'; // 관리자 전용 제어바 노출
            }
        });

        adminResetScoreBtn.addEventListener('click', () => {
            socket.emit('adminCommand', { type: 'RESET_SCORE' });
        });

        adminKickBtn.addEventListener('click', () => {
            const target = prompt("추방할 플레이어의 고유 소켓 ID를 입력하세요:");
            if(target) socket.emit('adminCommand', { type: 'KICK_PLAYER', targetId: target });
        });

        socket.on('forcedKick', () => {
            alert("관리자에 의해 방에서 강제 퇴장 처리되었습니다.");
            location.reload();
        });

        socket.on('errorNotification', (msg) => { alert(msg); });

        // 인원 설정 및 게임 구동 연동 동작
        playerCountSelect.addEventListener('change', (e) => {
            socket.emit('changeMaxPlayers', e.target.value);
        });

        startBtn.addEventListener('click', () => {
            socket.emit('startGame');
        });

        socket.on('connect', () => {
            myId = socket.id;
            socket.emit('joinGame', myData);
        });

        socket.on('updatePlayers', (serverPlayers) => {
            remotePlayers = serverPlayers;
            // 만약 내가 관리자 권한을 획득했다면 제어판 노출 동기화
            if (remotePlayers[myId] && remotePlayers[myId].isAdmin) {
                adminPanel.style.display = 'flex';
            } else {
                adminPanel.style.display = 'none';
            }
        });

        socket.on('updateGameState', (serverState) => {
            gameState = serverState;
            playerCountSelect.value = gameState.maxPlayers;
            blueScoreText.textContent = gameState.score.blue;
            redScoreText.textContent = gameState.score.red;
        });

        socket.on('gameStarted', (serverState) => {
            gameState = serverState;
            statusText.textContent = "[경기 중] 실시간 매치가 진행 중입니다!";
            statusText.style.color = "#2ecc71";
        });

        window.addEventListener('keydown', (e) => { keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key] = false; });

        function updateMovement() {
            if (!remotePlayers[myId] || remotePlayers[myId].isSpectator) return;

            let moved = false;
            let speed = 4;

            if (keys['ArrowUp'] || keys['w'] || keys['W']) { myData.y -= speed; moved = true; }
            if (keys['ArrowDown'] || keys['s'] || keys['S']) { myData.y += speed; moved = true; }
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) { myData.x -= speed; moved = true; }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) { myData.x += speed; moved = true; }

            if (myData.x < 20) myData.x = 20;
            if (myData.x > canvas.width - 20) myData.x = canvas.width - 20;
            if (myData.y < 20) myData.y = 20;
            if (myData.y > canvas.height - 20) myData.y = canvas.height - 20;

            if (moved) {
                socket.emit('playerMove', { x: myData.x, y: myData.y });
            }
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // [코트 라인 페인팅 구현]
            ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
            ctx.lineWidth = 2;

            // 정중앙선 및 중앙 서클 원형 도포
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 60, 0, Math.PI * 2);
            ctx.stroke();

            // 좌측 페널티 에어리어 라인 설계
            ctx.strokeRect(0, 150, 80, 200);
            ctx.beginPath();
            ctx.arc(80, 250, 40, -Math.PI/2, Math.PI/2);
            ctx.stroke();

            // 우측 페널티 에어리어 라인 설계
            ctx.strokeRect(canvas.width - 80, 150, 80, 200);
            ctx.beginPath();
            ctx.arc(canvas.width - 80, 250, 40, Math.PI/2, -Math.PI/2);
            ctx.stroke();

            // [오브젝트 그리기] 중앙 오렌지 농구공 마크 배치
            ctx.beginPath();
            ctx.arc(gameState.ball.x, gameState.ball.y, 10, 0, Math.PI * 2);
            ctx.fillStyle = "#e67e22";
            ctx.fill();
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // [선수 렌더링 엔진]
            for (let id in remotePlayers) {
                const player = remotePlayers[id];
                if (player.isSpectator) continue;

                ctx.beginPath();
                ctx.arc(player.x, player.y, 16, 0, Math.PI * 2);
                
                if (player.team === 'BLUE') {
                    ctx.fillStyle = '#3498db';
                } else {
                    ctx.fillStyle = '#e74c3c';
                }
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 선수 등번호(Number) 한가운데 마킹
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(player.number, player.x, player.y);

                // 관리자 권한을 가진 유저일 경우 머리 위에 특수 별표(★) 표시 렌더링 로직 추가
                if (player.isAdmin) {
                    ctx.fillStyle = '#f1c40f';
                    ctx.font = '14px sans-serif';
                    ctx.fillText('★', player.x, player.y - 24);
                }
            }
        }

        function gameLoop() {
            updateMovement();
            drawGame();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
